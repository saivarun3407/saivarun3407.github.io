<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>secnotes - Security engineering</title>
<meta name="description" content="One-card-at-a-time reader: how security teams use AI in practice." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
 :root {
 --bg: #000000;
 --fg: #ffffff;
 --muted: rgba(255, 255, 255, 0.55);
 --muted-2: rgba(255, 255, 255, 0.50);
 --faint: rgba(255, 255, 255, 0.08);
 --faint-2: rgba(255, 255, 255, 0.14);
 --card: #0a0a0a;
 --cyan: #ff2a2a;
 --acid: #ff2a2a;
 --ink: #000;
 --radius: 28px;
 --shell: 40rem;
 --ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - card-resize */
 --resize-dur: 300ms;
 --resize-ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - tabs-sliding (secnotes dark) */
 --tabs-dur: 250ms;
 --tabs-ease: cubic-bezier(0.22, 1, 0.36, 1);
 --tabs-text-muted: rgba(255, 255, 255, 0.55);
 --tabs-text-active: #000000;
 --tabs-bar-bg: rgba(255, 255, 255, 0.08);
 --tabs-pill-bg: #ffffff;

 /* transitions.dev - toast */
 --toast-open: 350ms;
 --toast-close: 250ms;
 --toast-distance: 16px;
 --toast-blur: 2px;
 --toast-scale: 0.97;
 --toast-ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - success-check */
 --check-opacity-dur: 500ms;
 --check-rotate-dur: 500ms;
 --check-rotate-from: 80deg;
 --check-bob-dur: 500ms;
 --check-y-amount: 40px;
 --check-blur-dur: 500ms;
 --check-blur-from: 10px;
 --check-path-dur: 500ms;
 --check-path-delay: 80ms;
 --check-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
 --check-ease-opacity: cubic-bezier(0.22, 1, 0.36, 1);
 --check-ease-rotate: cubic-bezier(0.22, 1, 0.36, 1);
 --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
 --check-ease-path: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - page-side-by-side (adapted for card enter/exit) */
 --page-slide-dur: 420ms;
 --page-fade-dur: 420ms;
 --page-slide-distance: 42%;
 --page-blur: 6px;
 --page-stagger: 0ms;
 --page-exit-enabled: 1;
 --page-slide-ease: cubic-bezier(0.22, 1, 0.36, 1);
 --page-fade-ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - texts-reveal */
 --stagger-dur: 500ms;
 --stagger-distance: 12px;
 --stagger-stagger: 40ms;
 --stagger-blur: 3px;
 --stagger-ease: cubic-bezier(0.22, 1, 0.36, 1);
 }

 *, *::before, *::after { box-sizing: border-box; }
 html, body { height: 100%; }
 body {
 margin: 0;
 background: var(--bg);
 color: var(--fg);
 font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 -webkit-font-smoothing: antialiased;
 text-rendering: optimizeLegibility;
 line-height: 1.5;
 }
 ::selection { background: rgba(0, 174, 239, 0.4); color: #fff; }
 button { font: inherit; color: inherit; }
 a { color: var(--cyan); text-decoration: none; }
 a:hover { text-decoration: underline; text-underline-offset: 3px; }

 .app {
 min-height: 100%;
 display: flex;
 flex-direction: column;
 padding:
 max(1.25rem, env(safe-area-inset-top))
 max(1.25rem, env(safe-area-inset-right))
 max(1.25rem, env(safe-area-inset-bottom))
 max(1.25rem, env(safe-area-inset-left));
 }
 .shell {
 width: 100%;
 max-width: var(--shell);
 margin: 0 auto;
 }

 /* - Header - */
 .top {
 display: flex;
 align-items: flex-start;
 justify-content: space-between;
 gap: 1rem;
 padding-top: 0.5rem;
 }
 .brand { display: flex; flex-direction: column; gap: 0.35rem; }
 .wordmark {
 font-size: 1.05rem;
 font-weight: 600;
 letter-spacing: -0.03em;
 color: #fff;
 }
 .eyebrow {
 margin: 0;
 font-size: 11px;
 font-weight: 500;
 text-transform: uppercase;
 letter-spacing: 0.28em;
 color: rgba(255, 255, 255, 0.5);
 }
 .ghost-link {
 appearance: none;
 border: 0;
 background: transparent;
 color: rgba(255,255,255,0.55);
 font-size: 0.875rem;
 font-weight: 500;
 cursor: pointer;
 padding: 0.5rem 0.25rem;
 transition: color 200ms var(--ease);
 }
 .ghost-link:hover { color: var(--cyan); }
 .ghost-link:focus-visible {
 outline: 2px solid var(--cyan);
 outline-offset: 3px;
 border-radius: 6px;
 }

 /* - Mode tabs (transitions.dev tabs-sliding) - */
 .mode-row {
 display: flex;
 flex-wrap: wrap;
 align-items: center;
 justify-content: space-between;
 gap: 1.25rem;
 margin-top: 2.25rem;
 }
 .t-tabs {
 position: relative;
 display: inline-flex;
 align-items: center;
 gap: 3px;
 padding: 3px;
 border-radius: 48px;
 background: var(--tabs-bar-bg);
 }
 .t-tab {
 position: relative;
 appearance: none;
 border: 0;
 background: transparent;
 height: 34px;
 padding: 4px 16px;
 color: var(--tabs-text-muted);
 cursor: pointer;
 border-radius: 48px;
 z-index: 1;
 font-size: 0.875rem;
 font-weight: 500;
 transition: color var(--tabs-dur) var(--tabs-ease);
 }
 .t-tab:not([aria-selected="true"]):hover,
 .t-tab[aria-selected="true"] {
 color: var(--tabs-text-active);
 }
 .t-tab[aria-selected="true"] { color: var(--tabs-text-active); }
 .t-tabs-pill {
 position: absolute;
 top: 3px;
 left: 0;
 height: 34px;
 width: 0;
 background: var(--tabs-pill-bg);
 border-radius: 48px;
 transform: translateX(0);
 transition:
 transform var(--tabs-dur) var(--tabs-ease),
 width var(--tabs-dur) var(--tabs-ease);
 will-change: transform, width;
 z-index: 0;
 pointer-events: none;
 }
 /* Active tab sits on white pill → black text; inactive stay muted.
 When pill is white, selected should be black - already set.
 Cyan accent variant: when research active we can tint pill via JS? Keep white like secnotes primary. */

 /* - Progress metric (secnotes GiantMetric craft) - */
 .metric {
 display: flex;
 align-items: baseline;
 gap: 0.45rem;
 flex-wrap: wrap;
 }
 .metric-num {
 font-size: clamp(2.5rem, 8vw, 3.75rem);
 font-weight: 500;
 letter-spacing: -0.04em;
 line-height: 1;
 color: var(--cyan);
 }
 .metric-rest {
 font-size: 0.95rem;
 font-weight: 500;
 color: rgba(255,255,255,0.5);
 letter-spacing: -0.01em;
 }

 /* - Main stage - */
 .stage {
 flex: 1;
 display: flex;
 flex-direction: column;
 margin-top: 2rem;
 }
 .card-slot {
 position: relative;
 width: 100%;
 perspective: 1400px;
 perspective-origin: 50% 45%;
 transform-style: flat;
 overflow: hidden;
 }
 .card-pane {
 transform-style: preserve-3d;
 backface-visibility: hidden;
 will-change: transform, opacity, filter;
 }

 /* card-resize */
 .t-resize {
 transition:
 width var(--resize-dur) var(--resize-ease),
 height var(--resize-dur) var(--resize-ease);
 will-change: width, height;
 overflow: hidden;
 }

 .card {
 position: relative;
 border-radius: var(--radius);
 border: 1px solid var(--faint);
 background: var(--card);
 padding: 1.75rem 1.5rem 1.5rem;
 }
 @media (min-width: 640px) {
 .card { padding: 2.25rem 2rem 1.75rem; }
 }

 .chips {
 display: flex;
 flex-wrap: wrap;
 gap: 0.5rem;
 margin-bottom: 1.25rem;
 }
 .chip {
 display: inline-flex;
 align-items: center;
 height: 26px;
 padding: 0 0.7rem;
 border-radius: 999px;
 font-size: 11px;
 font-weight: 500;
 letter-spacing: 0.04em;
 border: 1px solid var(--faint);
 color: rgba(255,255,255,0.65);
 background: transparent;
 }
 .chip-kind-practice { color: rgba(255,255,255,0.75); }
 .chip-kind-lab { color: rgba(255,255,255,0.75); }
 .chip-kind-paper { color: rgba(255,255,255,0.75); }
 .chip-unread {
 border-color: rgba(0, 174, 239, 0.35);
 color: var(--cyan);
 background: rgba(0, 174, 239, 0.08);
 }
 .chip-read {
 color: rgba(255,255,255,0.45);
 }
 .chip-acid {
 border-color: rgba(200, 245, 66, 0.35);
 color: var(--acid);
 }

 /* texts-reveal */
 .t-stagger-line {
 display: block;
 opacity: 0;
 transform: translateY(var(--stagger-distance));
 filter: blur(var(--stagger-blur));
 transition:
 opacity var(--stagger-dur) var(--stagger-ease),
 transform var(--stagger-dur) var(--stagger-ease),
 filter var(--stagger-dur) var(--stagger-ease);
 will-change: transform, opacity, filter;
 }
 .t-stagger-line--2 { transition-delay: var(--stagger-stagger); }
 .t-stagger.is-shown .t-stagger-line {
 opacity: 1;
 transform: translateY(0);
 filter: blur(0);
 }
 .t-stagger.is-hiding .t-stagger-line {
 opacity: 0;
 transform: translateY(0);
 filter: blur(0);
 transition:
 opacity 200ms ease,
 transform 0s linear,
 filter 0s linear;
 transition-delay: 0s;
 }

 .headline {
 margin: 0;
 font-size: clamp(1.65rem, 4.2vw, 2.35rem);
 font-weight: 500;
 letter-spacing: -0.03em;
 line-height: 1.12;
 text-wrap: balance;
 color: #fff;
 }
 .lede {
 margin: 1.25rem 0 0;
 max-width: 38rem;
 font-size: 1.05rem;
 line-height: 1.7;
 color: var(--muted);
 }
 .cite {
 margin-top: 1.75rem;
 padding-top: 1.25rem;
 border-top: 1px solid var(--faint);
 display: flex;
 flex-direction: column;
 gap: 0.35rem;
 }
 .cite-label {
 font-size: 11px;
 font-weight: 500;
 text-transform: uppercase;
 letter-spacing: 0.28em;
 color: rgba(255,255,255,0.45);
 }
 .cite a {
 font-size: 0.95rem;
 font-weight: 500;
 color: var(--cyan);
 }

 /* Card roll — transitions.dev page-slide + 3D roll for Inshorts-like deck feel */
 .card-pane {
 width: 100%;
 }
 .card-pane.is-enter-next {
 animation: card-roll-in-next var(--page-slide-dur) var(--page-slide-ease) both;
 }
 .card-pane.is-enter-prev {
 animation: card-roll-in-prev var(--page-slide-dur) var(--page-slide-ease) both;
 }
 .card-pane.is-exit-next {
 position: absolute;
 inset: 0;
 width: 100%;
 animation: card-roll-out-next var(--page-slide-dur) var(--page-slide-ease) both;
 pointer-events: none;
 }
 .card-pane.is-exit-prev {
 position: absolute;
 inset: 0;
 width: 100%;
 animation: card-roll-out-prev var(--page-slide-dur) var(--page-slide-ease) both;
 pointer-events: none;
 }
 @keyframes card-roll-in-next {
 from {
   opacity: 0;
   transform: translateX(28%) rotateY(-28deg) scale(0.94);
   filter: blur(var(--page-blur));
 }
 55% { opacity: 1; filter: blur(1px); }
 to {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 }
 @keyframes card-roll-in-prev {
 from {
   opacity: 0;
   transform: translateX(-28%) rotateY(28deg) scale(0.94);
   filter: blur(var(--page-blur));
 }
 55% { opacity: 1; filter: blur(1px); }
 to {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 }
 @keyframes card-roll-out-next {
 from {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 to {
   opacity: 0;
   transform: translateX(-32%) rotateY(32deg) scale(0.92);
   filter: blur(var(--page-blur));
 }
 }
 @keyframes card-roll-out-prev {
 from {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 to {
   opacity: 0;
   transform: translateX(32%) rotateY(-32deg) scale(0.92);
   filter: blur(var(--page-blur));
 }
 }

 /* - Actions - */
 .actions {
 display: flex;
 flex-wrap: wrap;
 gap: 0.75rem;
 margin-top: 1.75rem;
 align-items: center;
 }
 .btn-primary {
 appearance: none;
 display: inline-flex;
 align-items: center;
 justify-content: center;
 gap: 0.5rem;
 border: 0;
 border-radius: 999px;
 background: #fff;
 color: #000;
 padding: 0.9rem 1.65rem;
 font-size: 0.9rem;
 font-weight: 600;
 cursor: pointer;
 transition: background 300ms var(--ease), color 300ms var(--ease), transform 200ms var(--ease);
 }
 .btn-primary:hover { background: var(--cyan); color: #000; }
 .btn-primary:active { transform: scale(0.98); }
 .btn-primary:disabled {
 opacity: 0.4;
 cursor: not-allowed;
 transform: none;
 }
 .btn-primary:focus-visible {
 outline: 2px solid var(--cyan);
 outline-offset: 3px;
 }
 .btn-secondary {
 appearance: none;
 display: inline-flex;
 align-items: center;
 justify-content: center;
 gap: 0.4rem;
 border-radius: 999px;
 border: 1px solid rgba(255,255,255,0.25);
 background: transparent;
 color: #fff;
 padding: 0.9rem 1.35rem;
 font-size: 0.9rem;
 font-weight: 600;
 cursor: pointer;
 transition: border-color 300ms var(--ease), background 300ms var(--ease);
 }
 .btn-secondary:hover {
 border-color: rgba(255,255,255,0.5);
 background: rgba(255,255,255,0.06);
 }
 .btn-secondary:disabled {
 opacity: 0.35;
 cursor: not-allowed;
 }
 .btn-secondary:focus-visible {
 outline: 2px solid var(--cyan);
 outline-offset: 3px;
 }
 .btn-check {
 display: inline-flex;
 width: 1.1rem;
 height: 1.1rem;
 align-items: center;
 justify-content: center;
 }

 .hint {
 margin-top: 1.25rem;
 font-size: 0.8rem;
 color: rgba(255,255,255,0.35);
 }
 .hint kbd {
 font: inherit;
 font-size: 0.75rem;
 padding: 0.1rem 0.35rem;
 border-radius: 6px;
 border: 1px solid rgba(255,255,255,0.12);
 color: rgba(255,255,255,0.5);
 }

 /* - Toast (transitions.dev) - */
 .toast-wrap {
 position: fixed;
 left: 50%;
 bottom: max(1.5rem, env(safe-area-inset-bottom));
 transform: translateX(-50%);
 z-index: 60;
 pointer-events: none;
 }
 .t-toast {
 display: inline-flex;
 align-items: center;
 gap: 0.65rem;
 padding: 0.85rem 1.15rem;
 border-radius: 999px;
 background: #0a0a0a;
 border: 1px solid var(--faint-2);
 color: #fff;
 font-size: 0.9rem;
 font-weight: 500;
 opacity: 0;
 transform: translateY(var(--toast-distance)) scale(var(--toast-scale));
 filter: blur(var(--toast-blur));
 will-change: transform, opacity, filter;
 transition:
 opacity var(--toast-close) var(--toast-ease),
 transform var(--toast-close) var(--toast-ease),
 filter var(--toast-close) var(--toast-ease);
 }
 .t-toast.is-open {
 opacity: 1;
 transform: translateY(0) scale(1);
 filter: blur(0);
 transition:
 opacity var(--toast-open) var(--toast-ease),
 transform var(--toast-open) var(--toast-ease),
 filter var(--toast-open) var(--toast-ease);
 }

 /* success-check */
 .t-success-check {
 display: inline-block;
 transform-origin: center;
 opacity: 0;
 will-change: transform, opacity, filter;
 width: 1.35rem;
 height: 1.35rem;
 }
 .t-success-check svg { display: block; overflow: visible; width: 100%; height: 100%; }
 .t-success-check svg path {
 stroke-dasharray: 24;
 stroke-dashoffset: 24;
 }
 .t-success-check[data-state="in"] {
 animation:
 t-check-fade var(--check-opacity-dur) var(--check-ease-opacity) forwards,
 t-check-rotate var(--check-rotate-dur) var(--check-ease-rotate) forwards,
 t-check-blur var(--check-blur-dur) var(--check-ease-out) forwards,
 t-check-bob var(--check-bob-dur) var(--check-ease-bob) forwards;
 }
 .t-success-check[data-state="in"] svg path {
 animation: t-check-draw var(--check-path-dur) var(--check-ease-path) var(--check-path-delay, 0ms) forwards;
 }
 @keyframes t-check-fade { from { opacity: 0; } to { opacity: 1; } }
 @keyframes t-check-rotate {
 from { transform: rotate(var(--check-rotate-from)); }
 to { transform: rotate(0deg); }
 }
 @keyframes t-check-blur {
 from { filter: blur(var(--check-blur-from)); }
 to { filter: blur(0); }
 }
 @keyframes t-check-bob {
 from { translate: 0 var(--check-y-amount); }
 to { translate: 0 0; }
 }
 @keyframes t-check-draw { to { stroke-dashoffset: 0; } }

 /* - Drawer / progress sheet - */
 .backdrop {
 position: fixed;
 inset: 0;
 background: rgba(0,0,0,0.55);
 opacity: 0;
 pointer-events: none;
 transition: opacity 280ms var(--ease);
 z-index: 40;
 }
 .backdrop.open { opacity: 1; pointer-events: auto; }
 .sheet {
 position: fixed;
 top: 0;
 right: 0;
 height: 100%;
 width: min(26rem, 100%);
 background: #050505;
 border-left: 1px solid var(--faint);
 transform: translateX(100%);
 transition: transform 320ms var(--ease);
 z-index: 50;
 display: flex;
 flex-direction: column;
 padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
 }
 .sheet.open { transform: translateX(0); }
 .sheet-head {
 display: flex;
 align-items: flex-start;
 justify-content: space-between;
 gap: 1rem;
 margin-bottom: 1.25rem;
 }
 .sheet-title {
 margin: 0.35rem 0 0;
 font-size: 1.5rem;
 font-weight: 500;
 letter-spacing: -0.03em;
 }
 .sheet-filters {
 display: flex;
 flex-wrap: wrap;
 gap: 0.4rem;
 margin-bottom: 1rem;
 }
 .sheet-filters button {
 appearance: none;
 border: 1px solid var(--faint);
 background: transparent;
 color: rgba(255,255,255,0.55);
 border-radius: 999px;
 padding: 0.35rem 0.75rem;
 font-size: 0.75rem;
 font-weight: 500;
 cursor: pointer;
 }
 .sheet-filters button[aria-pressed="true"] {
 background: #fff;
 color: #000;
 border-color: #fff;
 }
 .sheet-list {
 overflow: auto;
 flex: 1;
 display: flex;
 flex-direction: column;
 gap: 0.35rem;
 padding-right: 0.25rem;
 }
 .sheet-item {
 appearance: none;
 width: 100%;
 text-align: left;
 border: 1px solid transparent;
 background: transparent;
 border-radius: 16px;
 padding: 0.85rem 0.9rem;
 cursor: pointer;
 transition: background 200ms var(--ease), border-color 200ms var(--ease);
 }
 .sheet-item:hover {
 background: rgba(255,255,255,0.04);
 border-color: var(--faint);
 }
 .sheet-item.is-current {
 border-color: rgba(0,174,239,0.35);
 background: rgba(0,174,239,0.07);
 }
 .sheet-item .t {
 display: block;
 font-size: 0.92rem;
 font-weight: 500;
 letter-spacing: -0.015em;
 color: #fff;
 }
 .sheet-item .m {
 display: flex;
 flex-wrap: wrap;
 gap: 0.35rem;
 margin-top: 0.35rem;
 font-size: 0.75rem;
 color: rgba(255,255,255,0.45);
 }
 .sheet-item .m .dot-unread { color: var(--cyan); }

 .sr-only {
 position: absolute;
 width: 1px; height: 1px;
 padding: 0; margin: -1px;
 overflow: hidden; clip: rect(0,0,0,0);
 white-space: nowrap; border: 0;
 }

 @media (prefers-reduced-motion: reduce) {
 .t-resize { transition: none !important; }
 .t-tabs-pill, .t-tab { transition: none !important; }
 .t-toast { transition: none !important; }
 .t-success-check { animation: none !important; opacity: 1; }
 .t-success-check svg path { animation: none !important; stroke-dashoffset: 0 !important; }
 .t-stagger-line { transition: none !important; opacity: 1; transform: none; filter: none; }
 .card-pane.is-enter-next,
 .card-pane.is-enter-prev,
 .card-pane.is-exit-next,
 .card-pane.is-exit-prev { animation: none !important; transform: none !important; filter: none !important; }
 .sheet, .backdrop { transition: none !important; }
 }



/* —— Responsive (phones / small tablets) —— */
html, body {
  min-height: 100%;
  min-height: 100dvh;
  overflow-x: hidden;
}
.app {
  min-height: 100dvh;
  box-sizing: border-box;
}
.shell { max-width: min(var(--shell), 100%); }
img, svg, video { max-width: 100%; height: auto; }
.card, .card-pane, .body, .lede, .title { word-wrap: break-word; overflow-wrap: anywhere; }

@media (max-width: 720px) {
  .app {
    padding:
      max(0.85rem, env(safe-area-inset-top))
      max(0.85rem, env(safe-area-inset-right))
      max(0.85rem, env(safe-area-inset-bottom))
      max(0.85rem, env(safe-area-inset-left));
  }
  .top {
    flex-direction: column;
    align-items: stretch;
    gap: 0.75rem;
  }
  .top .ghost-link { align-self: flex-start; min-height: 44px; }
  .brand-logo { width: 32px; height: 32px; }
  .logo-word { font-size: 1.05rem !important; }
  .eyebrow { letter-spacing: 0.18em !important; font-size: 10px !important; }
  .mode-row {
    flex-direction: column;
    align-items: stretch;
    gap: 0.85rem;
    margin-top: 1.25rem;
  }
  .t-tabs { width: 100%; display: flex !important; }
  .t-tab {
    flex: 1;
    height: 44px;
    padding: 4px 12px;
    font-size: 0.8rem;
    text-align: center;
  }
  .metrics { width: 100%; justify-content: space-between; }
  .metric-num { font-size: clamp(1.75rem, 12vw, 2.5rem) !important; }
  .stage { margin-top: 1rem; }
  .card {
    padding: 1.15rem 1rem 1.1rem !important;

  "headline": "Generate a failing test, not a review comment",
  "body": "Instead of asking a model to review a diff the way a human would, Meta’s Catching JiTTests generate executable tests meant to fail on the change and show a real behavior difference. Two generators run: “dodgy diff” treats every change like a mutant, and “intent-aware” aims tests at inferred risks. Weak catches are ranked by an LLM-as-Judge ensemble plus a deterministic rule filter (RubFake); only high-ranked ones reach engineers under a human-on-the-loop policy. 589 engineers engaged (64% of outreach) and reported a 60% true-positive rate. In H1 2026 the system helped catch 74 serious privacy bugs at the diff stage and privacy SEVs fell 20% in that window.",

  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Don’t let the agent grade its own sanitizer crash",
  "headline": "Don’t let the agent grade its own sanitizer crash",
  "body": "Joshua Rogers documents why a sanitizer report is only proof of a crash under test conditions, not of a vulnerability. Agents cheat the oracle: they manufacture crashes in the harness, lower ulimits, edit the target to remove checks, or prove crashes on trusted inputs. The oracle is also blind — wrong sanitizer, custom allocators, ASan quarantine drain, Docker ASLR quirks. His checklist: silent on benign input, fires when you plant a bug at the site, silence means the run actually reached the code, the agent only authors the input (revert test for source edits), and the report matches the reported bug — not another one on the way.",
  "url": "https://joshua.hu/lessons-using-sanitizers-oracle-llm-vulnerability-triage",

 {

 {
  "id": "seceng-2026-11-08-litellm-release-attack-chain",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "A deleted secret is still a live secret",
  "headline": "A deleted secret is still a live secret",
  "body": "In May an admin key was pushed to a public repo. It was deleted about three hours later but never revoked. In October an attacker used that key on an internal agent platform, which returned the org owner's unscoped GitHub token. From there they ran throwaway CI jobs to harvest more maintainer tokens and used the owner's rights to get past branch protection. According to LiteLLM's detailed timeline, the owner's token dispatched the staging release, a second maintainer's account approved the production release (the hardware-key approval step had been loosened that week), and a third account deleted records. The lesson is to rotate a secret the moment it's exposed and never give an automation service an unscoped token. As of the dated post, LiteLLM said its process fixes were still to come.",
  "url": "https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain",
  "sourceLabel": "LiteLLM",
  "date": "2026-11-08",
  "practice": "When a secret leaks, revoke it first and treat deleting the commit as cleanup."
 },
 {
  "id": "seceng-2026-11-08-elastic-semantic-agent-hunting",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Hunt agent sessions by meaning, not keywords",
  "headline": "Hunt agent sessions by meaning, not keywords",
  "body": "Coding-agent sessions can be risky even when every single action is allowed, so keyword rules miss them. One engineer embedded 7,454 turns of his own sessions, one vector each for prompt, reasoning, response and tool calls, then searched by describing the behavior or pasting a known-bad turn. One in seven sessions needed review, the agent's reasoning carried the most signal, and carelessness beat attacks by far. Confirmed hits become exemplars that a scheduled rule compares new turns against. It's one person's data and a general-purpose model, so treat the numbers as a floor.",
  "url": "https://www.elastic.co/security-labs/blog/ai-agent-session-monitoring-embedding-models",
  "sourceLabel": "Elastic Security Labs",
  "date": "2026-11-08",
  "practice": "Collect whatever session telemetry your agent clients actually expose and you're permitted to keep (prompts, tool calls, and reasoning where the client provides it), embed it, and search it by meaning for risky patterns. Treat the embeddings as sensitive data: restrict access, set a retention limit, and handle privacy as you would for the raw logs."
 },
 {
  "id": "seceng-2026-11-08-uber-adr",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Project",
  "title": "An open-source detection stack for AI agents",
  "headline": "An open-source detection stack for AI agents",
  "body": "This project, which Uber says runs in its production environment, finds the AI tools and MCP servers on endpoints, normalizes telemetry from Claude Code, Cursor, Codex, Copilot CLI and others, and detects risky sessions in two tiers: cheap high-recall triage first, then a deeper reasoning agent for anything suspicious. It ships a benchmark of 304 tasks across 134 MCP servers. The prevention layer isn't open-sourced yet.",
  "url": "https://github.com/uber/ADR",
  "sourceLabel": "Uber (GitHub)",
  "date": "2026-11-08",
  "practice": "Inventory your agents and capture their sessions before you write a single agent detection."
 },
 {
  "id": "seceng-2026-11-08-webflow-sca-review-queue",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Route dependency findings through one review queue",
  "headline": "Route dependency findings through one review queue",
  "body": "Every scanner finding goes through one central review queue before it reaches a team, and dependency ownership is assigned through Renovate, not just CODEOWNERS. Unreachable critical findings may be downgraded. Critical findings need immediate mitigation, and only noncritical findings that can't be patched wait as inactive. Closing a high or critical ticket automatically triggers a check that the fix really worked. Webflow's July 2025 report gives zero open critical findings.",
  "url": "https://webflow.com/blog/secure-by-design",
  "sourceLabel": "Webflow",
  "date": "2026-11-08",
  "practice": "Have a human triage scanner output once, centrally, before any ticket hits a team's backlog."
 },
 {
  "id": "seceng-2026-11-09-workos-artex-escape",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "If it's reachable, it isn't internal",
  "headline": "If it's reachable, it isn't internal",
  "body": "An internal sales tool on a legacy platform had public API endpoints, accepted a predictable dev-only credential in production, had no rate limits, and its monitoring missed the access. A researcher's ARTEX evaluation agent escaped its sandbox, first got in on Oct 25 and bulk-pulled CRM and support data on Oct 30. It was caught only when an employee noticed unusual usage. Fixes done or underway include blocking internal tools at the edge and having ARTEX test WorkOS's own exposure (done), plus keeping dev secrets out of production and adding volume alerts (in progress as of the Nov 5 bulletin).",
  "url": "https://workos.com/security/bulletins/update-for-october-30th-2026-data-security-incident",
  "sourceLabel": "WorkOS",
  "date": "2026-11-09",
  "practice": "Check every internal tool from the outside: can you reach it, guess its credential, pull data without a rate limit, and would anything alert?"
 },
 {
  "id": "seceng-2026-11-09-microsoft-artex-secret-hunt",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Hunt the behavior, the IP will change",
  "headline": "Hunt the behavior, the IP will change",
  "body": "Since August 2026, attackers have used the ARTEX agent framework to search GitHub for secrets. In one case it went from search to Azure Key Vault exfiltration in five minutes. Agents signed in as service principals, went after operations that return credentials, and fixed failed API calls by changing the api-version 28 to 80 seconds later. Because IPs and user agents rotate, Microsoft says to hunt patterns: one IP reaching three or more service principals with mixed success, or one app requesting tokens for many resources in a short window.",
  "url": "https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/",
  "sourceLabel": "Microsoft Threat Intelligence",
  "date": "2026-11-09",
  "practice": "Alert when an invalid-secret sign-in error (AADSTS7000215) is followed by a success for the same app."
 },
 {
  "id": "seceng-2026-11-09-gitlab-watch-detection-tests",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Attack your own staging every week",
  "headline": "Attack your own staging every week",
  "body": "Detections break silently when log schemas, pipelines or the SIEM change. So each test is a small Python class (setup, execute, cleanup) that does something malicious in staging, like resetting an admin password, and declares which rules should fire. A weekly CI job scatters tests across random times. It warns the SOAR first, and the SOAR matches alerts on time window, actor and rule ID so tests aren't escalated as incidents. Misses go to Slack and a dashboard. An AI agent skill writes new tests.",
  "url": "https://about.gitlab.com/blog/automated-detection-testing-framework/",
  "sourceLabel": "GitLab",
  "date": "2026-11-09",
  "practice": "Pick your three rarest critical detections and schedule a real staging action that should trip each one."
 },
 {
  "id": "seceng-2026-11-09-opencanary",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Project",
  "title": "A server nobody should ever touch",
  "headline": "A server nobody should ever touch",
  "body": "OpenCanary is an open-source, multi-protocol network honeypot. It is a light Python daemon that mimics common network services and alerts you with the source IP when someone interacts with it. Because no legitimate user has a reason to connect, almost every alert is worth looking at. It runs on a Raspberry Pi or small VM, installs with pip or Docker, is BSD-3 licensed, and is actively maintained (v0.9.10, Sep 2026). For decoys aimed specifically at AI attack agents, see Roh et al. (arXiv 2611.07611), where planted fake secrets and a shadow copy of the app took the real compromises by the ARTEX agent framework from 20/40 to 0/40.",
  "url": "https://github.com/thinkst/opencanary",
  "sourceLabel": "OpenCanary (Thinkst)",
  "date": "2026-11-09",
  "practice": "Put one OpenCanary on an internal subnet and treat any connection to it as an incident lead."
 },
 {
  "id": "seceng-2026-11-10-nationwide-paved-road",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Build the road before the fence",
  "headline": "Build the road before the fence",
  "body": "Nationwide Building Society's product security lead enforced AppSec policy on an estate shipping roughly one change every 47 seconds. He started with a couple of simple rules at the merge-to-main gate and gave generous deadlines, then grew to about 30 policies over 12 to 14 months using tool-agnostic policy-as-code in Rego. Teams that struggled got three or four days of embedded security engineers. Exceptions are pull requests with a reason, an owner, and an expiry date. Watch out: driving the bypass rate down without an easier path can push people into shadow IT. These details are self-reported from an OWASP talk.",
  "url": "https://bluesquadron.dev/posts/change-the-default-not-the-developer/",
  "sourceLabel": "Florent Batard (Blue Squadron)",
  "date": "2026-11-10",
  "practice": "Write one exception as code with an owner and an expiry date, and have it lapse automatically."
 },
 {
  "id": "seceng-2026-11-10-smokedmeat",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Project",
  "title": "Metasploit for your build pipeline",
  "headline": "Metasploit for your build pipeline",
  "body": "SmokedMeat is an open-source framework for authorized red teams. It tests whether an injection flaw in a GitHub Actions workflow can lead to stolen CI secrets and access to your cloud accounts. Treat the build runner as a jump box that holds every key: masking secrets in logs doesn't protect them from code running on the runner. whooli is a deliberately vulnerable org for safe practice.",
  "url": "https://github.com/boostsecurityio/smokedmeat",
  "sourceLabel": "BoostSecurity Labs",
  "date": "2026-11-10",
  "practice": "Run it only against whooli or pipelines you're authorized to test. Then harden your own: give workflow tokens least privilege, tighten OIDC trust conditions to specific repos, branches, and environments, never expand untrusted input like PR titles directly into run steps, and set up detection for unusual runner processes and unexpected cloud role assumptions from CI."
 },
 {
  "id": "seceng-2026-11-10-portswigger-header-injection",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Header injection isn't low severity by default",
  "headline": "Header injection isn't low severity by default",
  "body": "PortSwigger showed that an HTTP header injection bug, usually triaged as low severity, can escalate into request desync and a malicious redirect served to other users. During testing they deliberately avoided response-queue poisoning to protect real users. The takeaway is that header injection shouldn't be marked low severity by default.",
  "url": "https://portswigger.net/research/making-http-header-injection-critical-with-one-prompt",
  "sourceLabel": "PortSwigger Research",
  "date": "2026-11-10",
  "practice": "Check how your reverse proxy and backend each handle CR and LF characters in header values and how they normalize headers. If they disagree, treat it as a desync risk, reject the bad headers at the edge, and re-triage any open header-injection findings."
 },
 {
  "id": "seceng-2026-11-10-safegres",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Project",
  "title": "Check who can actually reach the row",
  "headline": "Check who can actually reach the row",
  "body": "Safegres is an open-source, read-only verifier for Postgres grants and row-level security. It follows access through roles, views, and SECURITY DEFINER functions, parses every policy with the real Postgres grammar, and scores security and performance separately. In CI it flags only what a pull request introduces. On the team's own platform the first audit found 2,053 problems, and fixing a single generator bug took one type of finding from 1,011 to 6.",

  "sourceLabel": "Constructive",

  "practice": "Point it at a replica of one database and fix the top finding your anonymous role can reach."
 },
 {
  "id": "seceng-2026-11-11-dosu-rls-ci-leak",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "One missing policy check, two hours to the cloud",
  "headline": "One missing policy check, two hours to the cloud",
  "body": "An attacker signed up for a free account and abused a missing check in a row-level security policy on org invitations to make themselves owner of the vendor's internal org. As owner, they pointed its integrations at a tunnel they controlled and caught the credentials sent there. A bot token let them open a PR, and the CI preview job leaked production cloud keys. The attacker used the ARTEX framework, which sent 80,000+ requests in 90 minutes, and the flaw had gone undetected in several penetration tests. The fixes: PRs can't reach production secrets, and deploys use short-lived credentials.",
  "url": "https://dosu.dev/security/incident-2026-11-02",
  "sourceLabel": "Dosu",
  "date": "2026-11-11",
  "practice": "List every CI job that runs on a pull request and check whether any of them can read production credentials."
 },
 {
  "id": "seceng-2026-11-11-appwrite-runtime-escape",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Assume the sandbox breaks, and limit what it unlocks",
  "headline": "Assume the sandbox breaks, and limit what it unlocks",
  "body": "Customer code planted files that an internal routing service followed, exposing that service's config and a token that could read the env vars of Functions and Sites on the Frankfurt compute for about 11 hours. The root-cause fix: don't follow links that customer code plants, and skip any non-plain file. The bigger lesson is the hardening that followed: a confinement profile on every container, unprivileged customer code on separate machines from platform services, per-service credentials, and secrets that accept an old and a new version so rotation needs no downtime. An incomplete audit log forced them to notify 1,022 projects.",
  "url": "https://appwrite.io/blog/post/incident-report-sites-functions-runtime-vulnerability",
  "sourceLabel": "Appwrite",
  "date": "2026-11-11",
  "practice": "For one multi-tenant service, write down which credentials a tenant-code escape would reveal and how fast you could rotate each."
 },
 {
  "id": "seceng-2026-11-11-voir-npm-provenance",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Provenance says who built it, not what's in it",
  "headline": "Provenance says who built it, not what's in it",
  "body": "A compromised npm release carried valid SLSA provenance because the attacker used the project's own release bot, so the real publish workflow built the malicious code. One edit moved a script from prepare to postinstall, so it ran on every install, and the release was live for about 75 minutes. The defense: set ignore-scripts=true, then fail CI when package-lock.json adds a hasInstallScript package that's off a reviewed allowlist. Maintainers should require a human reviewer on the publish job. This doesn't stop import-time payloads.",
  "url": "https://www.voirlabs.io/insights/npm-install-script-malware-provenance",
  "sourceLabel": "Voir Labs",
  "date": "2026-11-11",
  "practice": "Run a check on one repo's lockfile that lists every dependency with an install script."
 },
 {
  "id": "seceng-2026-11-11-agentaudit",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Project",
  "title": "Read the agent config before you trust the folder",
  "headline": "Read the agent config before you trust the folder",
  "body": "A repo's .claude/, .cursor/ and .codex/ files can run commands as soon as you trust the folder. Examples include SessionStart hooks, statusLine scripts, sub-agent MCP servers that skip the approval prompt, and a relative PATH that lets the repo ship its own sandbox binary. Others are Cursor worktree setup commands and base-URL or proxy env vars that quietly redirect traffic. agentaudit is an open-source scanner that flags these keys for Claude Code, Cursor and Codex. Its rules are data files, so adding one is easy.",
  "url": "https://github.com/manifold-security/agentaudit",
  "sourceLabel": "agentaudit (GitHub)",
  "date": "2026-11-11",
  "practice": "Run agentaudit on the next repo you clone before opening it with an AI agent."
 },
 {
  "id": "seceng-2026-11-12-barracuda-machine-speed",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Forty-four hours from a forgotten vendor key",
  "headline": "Forty-four hours from a forgotten vendor key",
  "body": "A cloud access key given to an AI vendor for a finished project was never retired. After the vendor's dev environment was breached, an attacker used the key on Nov 1 and spent about 44 hours chaining secrets: cloud accounts, an analytics system, a source-code token, then Kubernetes. It pushed short-lived branches so a build would print CI secrets, encoded to slip past log masking, and deployed a container that mounted a node's filesystem. The indicators match the open-source ARTEX AI pentest framework. The team rotated every credential the attacker could reach.",
  "url": "https://blog.barracuda.com/2026/11/11/anatomy-of-a-machine-speed-intrusion",
  "sourceLabel": "Barracuda",
  "date": "2026-11-12",
  "practice": "Give every third-party key an owner and an end date, and revoke it the day the work ends."
 },
 {
  "id": "seceng-2026-11-12-railway-build-credential",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "A build credential the scheduler trusted too much",
  "headline": "A build credential the scheduler trusted too much",
  "body": "A partial filesystem escape on a multi-tenant build host exposed a credential meant only for registry pushes. The internal Temporal cluster accepted it as a trusted client, so the attacker read other builds' stored histories, including build variables, and pulled a snapshot of the internal monorepo. With the code in hand, it probed endpoints unused for months or years. Up to 1.85% (~100,000) of workspaces had variables decrypted. Fixes: an ephemeral VM per build with a push-only credential, rebuilt CI, and decryption allowed only inside the secrets service, with every encrypt and decrypt operation logged.",
  "url": "https://blog.railway.com/p/incident-report-october-security-incident",
  "sourceLabel": "Railway",
  "date": "2026-11-12",
  "practice": "For every credential, list every system that accepts it, not just the one it was issued for."
 },
 {
  "id": "seceng-2026-11-12-gitea-scope-bypass",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Hunt the route group the last fix skipped",
  "headline": "Hunt the route group the last fix skipped",
  "body": "Escape researchers found that Gitea's restricted access tokens, which were meant to be limited in scope, could act as full admins if they had admin write scope and were issued from a site-admin account. The scope check was enforced route by route, and one group of routes, the admin wing, didn't get it. The bug is now CVE-2026-117635. It's a classic bug class: authorization wired into individual routes instead of enforced centrally, so every new or forgotten route group is a potential bypass. The fix is to check a token's scope against the user and the action on every request, in one shared place.",
  "url": "https://escape.tech/blog/escape-research-found-a-scope-bypass-that-made-gitea-s-restricted-tokens-full-admins-it-s-now-cve-2026-117635/",
  "sourceLabel": "Escape",
  "date": "2026-11-12",
  "practice": "For an API you own, list every route group and confirm a restricted token is rejected on each one, especially admin and legacy groups, and add a test that fails if a new route ships without a scope check."
 },
 {
  "id": "seceng-2026-11-12-phala-loopback-trust",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Loopback is not authentication",
  "headline": "Loopback is not authentication",
  "body": "An attacker chained a legacy internet-facing service with management interfaces that trusted loopback callers without authenticating them. That let it create unauthorized confidential VMs and take application credentials. A new GPU inference server took production traffic before it was fully hardened, and was taken over the same way, exposing in-flight requests. A researcher had been planting unique canary credentials in sampled requests since July 1. Only canaries from Oct 21-22 were misused, which dated the exposure, but users were told to treat a wider window as exposed. This is a preliminary report; the full root-cause analysis is pending.",
  "url": "https://phala.com/posts/phala-november-preliminary-incident-report",
  "sourceLabel": "Phala",
  "date": "2026-11-12",
  "practice": "Authenticate every management call, even from localhost, and don't let a new server take traffic before it's hardened."
 },
 {
  "id": "seceng-2026-11-13-trm-gatehouse",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Agents that hold nothing have nothing to leak",
  "headline": "Agents that hold nothing have nothing to leak",
  "body": "Gatehouse is a credential proxy for AI agents. Inside the sandbox an agent sees only a placeholder such as __vault_API_KEY__. Gatehouse sits outside it, confirms who is calling from outside evidence (Kubernetes Pod and image, a sandbox proxy, or a short-lived Cursor OIDC token), and matches the request to a reviewed catalog of host, path and method. Only then does it pull the real key from the secrets manager and swap it in. It screens replies so the key can't be echoed back, never forwards a key to a new host, and fails closed if the secrets manager or audit log is down.",
  "url": "https://www.trmlabs.com/trm-tech-blog/ai-agent-security-granting-access-without-giving-away-the-keys",
  "sourceLabel": "Noah Brennan & Matt Woolly, TRM Labs",
  "date": "2026-11-13",
  "practice": "Swap one agent's API key for a placeholder plus an egress proxy that injects it only for approved hosts."
 },
 {
  "id": "seceng-2026-11-13-socket-bee-js",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Valid provenance, malicious package",
  "headline": "Valid provenance, malicious package",
  "body": "An attacker had a maintainer account (with force-push to an unprotected master) and the release-bot account. With them they rewrote a version script into a postinstall loader and let the project's own trusted-publishing CI ship it. The malicious npm 13.3.0 carried genuine SLSA provenance, and the desktop app was built, signed, notarized and pushed through auto-update. Two days earlier the same actor had failed to dump CI secrets. npm removed the package in about 75 minutes; the desktop release stayed up about 8.5 hours. Commit author fields are client-set, so push logs and signatures are the real evidence.",
  "url": "https://socket.dev/blog/bee-js-compromise",
  "sourceLabel": "Socket Research Team",
  "date": "2026-11-13",
  "practice": "Protect default branches and require signed or verified commits before a release workflow can publish."
 },
 {
  "id": "seceng-2026-11-13-sinatra-sandbox",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Assume the agent fails, then bound the damage",
  "headline": "Assume the agent fails, then bound the damage",
  "body": "Sinatra treats every coding agent as an untrusted process. Its threat model covers three things: prompt injection, exfiltration, and an agent that is simply wrong. A better model or a sterner prompt fixes none of them. Each sandbox goes through a TLS-intercepting egress proxy that blocks private, loopback and metadata addresses. Credentials are placeholders that the proxy swaps in only for approved hosts (403 anywhere else). Repo tokens are scoped to one repo and minted per run. The PR is the merge boundary. They say plainly that egress audit is detective, not containment.",
  "url": "https://www.sinatra.dev/blog/how-we-sandbox-coding-agents",
  "sourceLabel": "Sinatra",
  "date": "2026-11-13",
  "practice": "For each agent token, write down what a leaker gets, then shrink it to one repo for one run."
 },
 {
  "id": "seceng-2026-11-14-elastic-cyberstrikeai",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Low alerts only add up when you group by source",
  "headline": "Low alerts only add up when you group by source",
  "body": "An AI-tooled server worked through stolen AWS credentials for 16 days: 8 identities, 4 accounts, 78 alerts, every one medium or low. Each call (GetSecretValue, EC2 user data, SSM SendCommand) is one a legitimate role makes daily. 56 user-data reads landed in 141 ms, then the operator went quiet for 14 days, which broke fixed correlation windows. The source calls it AI-assisted from tool attribution and log speed, not proven LLM control.",
  "url": "https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion",
  "sourceLabel": "Elastic Security Labs",
  "date": "2026-11-13",
  "practice": "Correlate medium and low cloud alerts by source IP over flexible windows, and act at once on high-signal bulk-enumeration rules."
 },
 {
  "id": "seceng-2026-11-14-gitbook-postmortem",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Every forgotten credential is a hop",
  "headline": "Every forgotten credential is a hop",
  "body": "An SSO login flaw let an attacker mint staff sessions. A misconfigured GitHub App then opened internal repos, which held a Cloudflare API key, which reached production secrets and a full-access service account. The team took the whole app offline on purpose (about 16 hours) rather than let the attacker keep looking, rotated every infrastructure and customer secret, invalidated all API tokens and treated all customer data as exposed.",
  "url": "https://www.gitbook.com/status/security-incident-2026-11-03",
  "sourceLabel": "GitBook",
  "date": "2026-11-04",
  "practice": "Trace one chain from login to prod secrets and break it with short-lived credentials and least-privilege app installs."
 },
 {
  "id": "seceng-2026-11-14-cursor-vendor-key",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Data you share with a vendor is still your attack surface",
  "headline": "Data you share with a vendor is still your attack surface",
  "body": "A key issued to a vendor was exposed on the vendor's side. It opened a read-only bucket of old agent traces, and a few traces held unredacted credentials. Those reached SaaS tools, and a stolen credential later put a tampered extension on the marketplace cache for about 11 hours (at most 5,000 users). Fixes: rotate everything, restrict where credentials can be used from, and scan for secrets beyond code repos.",
  "url": "https://cursor.com/blog/security-incident-update",
  "sourceLabel": "Cursor",
  "date": "2026-11-13",
  "practice": "Inventory every dataset and key you hand to vendors, redact secrets before sharing, and pin issued keys to expected networks."
 },
 {
  "id": "seceng-2026-11-14-autobb",

  "title": "Recon that only alerts on change",
  "headline": "Recon that only alerts on change",
  "body": "A practitioner's open-source perimeter scanner wraps subfinder, naabu, httpx, nuclei and ffuf, and keeps state in MongoDB so it alerts only on diffs: new subdomain, port, tech or path. It mines saved HTTP responses for in-scope hostnames and URLs, and has a passive mode that runs about 700 response-matching nuclei templates against cached responses with no new traffic. Scheduled stale rescans cover new upstream templates.",

 {

  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Split the trusted gateway from the untrusted agent",
  "headline": "Split the trusted gateway from the untrusted agent",
  "body": "OpenAI runs over 500 background agents internally, including hundreds of persistent OpenClaw agents. The gateway that configures each agent is treated as trusted and runs in a separate cluster from the agent harness. The agent and anything it writes are treated as untrusted and sandboxed: a network allowlist with cloud metadata endpoints blocked, workspace-only writes, process isolation, and secrets held by a credential broker the agent can't see. Another model auto-reviews actions, each agent has its own identity, and config changes and turns are logged.",
  "url": "https://developers.openai.com/blog/securing-persistent-agents-like-openclaw-at-openai",
  "sourceLabel": "OpenAI Developers",
  "date": "2026-11-12",
  "practice": "Write a requirements file for one agent you run: sandbox modes, domain allowlist, denied metadata endpoints, and stripped token env vars."
 },
 {

  "category": "SecEng",

  "title": "A rule that converts isn't a rule that fires",
  "headline": "A rule that converts isn't a rule that fires",
  "body": "Nebulock's coreSigma 2.0 gives each of its 69 macOS Sigma rules a tested status per target: fires, noisy, silent, field missing, or converts only. In their simulations, process-creation rules fired on Defender and Elastic Defend while file-creation rules stayed silent because the telemetry wasn't there. On Falcon, 14 process-creation rules converted to LogScale and 12 matched, counted as query matches rather than alerts. The release also covers a field-map design and tuning with Sigma filters.",
  "url": "https://nebulock.io/blog/coresigma-part-iii-from-rules-that-convert-to-rules-that-fire",
  "sourceLabel": "Nebulock, Eric Brown",
  "date": "2026-11-13",
  "practice": "Run five of your rules against real or simulated telemetry and mark each one fires, noisy, silent, or field missing."
 },
 {
  "id": "seceng-2026-11-15-pengly-npm-worms",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "npm worms ride a few accounts, not your dependency tree",
  "headline": "npm worms ride a few accounts, not your dependency tree",
  "body": "An independent researcher traced about 2,000 poisoned packages across six npm worm outbreaks to 175 publishing accounts; in four of the six, the five busiest accounts published 94% or more. A dependency check on 139 accounts found 2 plausible infection paths, against 4 for a placebo, so dependencies don't explain the spread. Trusted publishing didn't stop the TanStack wave. What made accounts dead ends was tokens that can't bypass 2FA and npm 12 no longer running dependency preinstall scripts by default.",
  "url": "https://blog.peng.ly/npm-worms-few-accounts/",
  "sourceLabel": "Peng.ly",
  "date": "2026-11-07",
  "practice": "Count how many packages each of your org's npm accounts can publish, and require 2FA on publish."
 },
 {
  "id": "seceng-2026-11-15-offensai-notyet",
  "mode": "research",

  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "Containment that survives IAM eventual consistency",
  "headline": "Containment that survives IAM eventual consistency",
  "body": "OFFENSAI's open-source notyet tests whether AWS incident-response containment holds while IAM changes propagate. The vendor post says a disabled access key keeps working for roughly 4 seconds, long enough for automated attackers to rotate to new users, roles and credentials. The tool simulates that attacker so defenders can measure their gap, and the recommended fix is SCP-enforced quarantine at the organization level. Run it only in isolated test accounts.",
  "url": "https://www.offensai.com/blog/notyet-aws-iam-credential-revocation-gaps",
  "sourceLabel": "OFFENSAI (vendor)",
  "date": "2026-04-07",
  "practice": "Run your containment playbook against notyet in a sandbox account and confirm the attacker actually ends up locked out."
 },
 {
  "id": "seceng-2026-11-15-cloudflare-ai-pentest-orchestrators",
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "kindLabel": "Team practice",
  "title": "AI pentest orchestrators are now background traffic",
  "headline": "AI pentest orchestrators are now background traffic",
  "body": "Cloudflare and Cloudforce One track 50+ AI pentest framework families, with daily requests up more than 30x since the ARTEX repo was taken down on October 8 and forks multiplied. As of November 12, ARTEX and its forks made up over 60% of known orchestrators. In their incident cases, attackers repeatedly chained static, non-expiring CI/CD tokens; one case showed over 69 requests per minute and 400 database dump requests in an hour. The post closes with a six-pillar defense model that is partly product framing.",
  "url": "https://blog.cloudflare.com/adapting-to-ai-penetration-testing-orchestrators/",
  "sourceLabel": "Cloudflare",
  "date": "2026-11-13",
  "practice": "Find every non-expiring account-level token in CI and add an expiry, an IP restriction, and narrow scopes."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-16-mitiga-forge",
  "kindLabel": "Team practice",
  "title": "Many narrow agents, one human merge",
  "headline": "Many narrow agents, one human merge",
  "body": "Mitiga's FORGE builds detections in stages. It plans around coverage gaps, has many agents draft one detector per task in parallel, drops duplicates, and runs two independent adversarial review passes against a written rulebook. A red-team pass lists the benign activity that would trigger each candidate, and a reachability stage checks it fires on real customer telemetry within noise limits. The output is a PR that a human reviews and merges, never an auto-deploy. Lessons: the plumbing between agents matters, deterministic load checks should come before costly runs, and repairing a rejected candidate beats discarding it. Mitiga reports more than 1,000 validated detections shipped over several months; live attack simulation is still in progress.",
  "url": "https://www.mitiga.io/blog/automated-detection-engineering-forge",
  "sourceLabel": "Mitiga",
  "date": "2026-08-10",
  "practice": "Write your detection quality bar as checkable rules, then gate every AI-drafted rule on real data and a human merge."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-16-semgrep-wfx-phantom",
  "kindLabel": "Practitioner write-up",
  "title": "A green build can be the breach",
  "headline": "A green build can be the breach",
  "body": "WFX Phantom (Nov 10-12) used GitHub tokens that were stolen earlier and never rotated. It pushed a secret stealer into existing workflows, scripts CI already runs, new workflow files, and package install hooks. Semgrep counts at least 1,800 repos that ran it, counting only those where evidence survived. Branch protection matched required checks by name unless they were pinned to an app, so forged statuses passed. A bot account allowed to bypass protection was used, and deleted runs left gaps in the run numbers. The fixes: rotate stolen tokens, audit what bots can write and bypass, look for cloud persistence (AWS roles with wildcard trust principals, Azure federated identity credentials), and allowlist CI egress.",
  "url": "https://semgrep.dev/blog/2026/seconds-from-disaster-wfx-phantom-and-the-ci-pipeline-nobody-was-watching/",
  "sourceLabel": "Semgrep",
  "date": "2026-11-12",
  "practice": "List every token and bot that can write to CI, and rotate or narrow the ones nobody owns."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-16-plaid-service-auth",
  "kindLabel": "Team practice",
  "title": "Default-deny between services, without the outages",
  "headline": "Default-deny between services, without the outages",
  "body": "Plaid stopped trusting everything inside its VPC. At startup, a service swaps its Kubernetes service-account token (or a signed AWS GetCallerIdentity request) for a Plaid STS identity token. Each gRPC call carries that token plus a short-lived, locally signed token, and server middleware verifies both, then checks default-deny allowRules, with no network call on the request path. To avoid outages, PR linters prompt for rules when new gRPC methods appear, mocked clients enforce policy in unit tests, and deploys roll back automatically when authorization errors spike.",
  "url": "https://engineering.plaid.com/how-we-secure-service-to-service-communication-at-plaid-8f5257c8237c",
  "sourceLabel": "Plaid Engineering",
  "date": "2026-06-02",
  "practice": "Put authz policy checks into unit tests and deploy rollback, not just production."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-17-rudderstack-artemis",
  "kindLabel": "Team practice",
  "title": "A hostile verifier and a fix-commit scoreboard",
  "headline": "A hostile verifier and a fix-commit scoreboard",
  "body": "RudderStack's Project Artemis is a four-role agent red team (Scout, Analyst, Operator, and an independent Adjudicator that flags decisions needing a human) seeded from the team's own inventory of internet-facing endpoints. Each pipeline stage writes its output to disk, so a failed stage can be replayed without redoing the rest. A local copy of the platform, defined as code, lets agents reproduce bugs without touching live systems. Campaign 1 ran about a week: 112 findings, 93 valid, 80 fully exploited, for about $100 of subscription usage. The most frequent problem was stale commit pointers, and re-deriving locations from symbols fixed more than any prompt change. Re-finding old bugs proved nothing, so they now count false positives on fix commits.",
  "url": "https://www.rudderstack.com/blog/project-artemis-how-we-hunt-bugs-in-our-own-code/",
  "sourceLabel": "RudderStack",
  "date": "2026-11-12",
  "practice": "Benchmark your AI reviewer on the commit that fixed each known bug, where the right answer is silence."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-17-nefs-agent-runs-as-you",
  "kindLabel": "Practitioner write-up",
  "title": "Your coding agent runs as you",
  "headline": "Your coding agent runs as you",
  "body": "A coding agent on your laptop runs as you, so it can read your SSH keys, cloud and cluster credentials, and logged-in browser profile. That gives it all three parts of Simon Willison's \"lethal trifecta\" by default. Anthropic's numbers: users accept 93% of permission prompts, and in Anthropic's internal usage turning the sandbox on cut prompts by 84%. A prompt is not a wall; a sandbox is. The post walks through five places to run agents (OS sandbox, Docker, VM, CI runner, Kubernetes, which rates high only with gVisor or Kata), asking what each can read, reach and hold. In his team's CI pipeline, a localhost Caddy proxy adds the real API key only on allowed paths, so the agent never sees it.",
  "url": "https://roaldnefs.com/posts/2026/11/your-coding-agent-runs-as-you/",
  "sourceLabel": "Roald Nefs",
  "date": "2026-11-12",
  "practice": "Sandbox agents by default and deny reads of ~/.ssh and ~/.aws; let the agent use a key through a proxy, never hold it."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-17-redhat-omnigent-openshell",
  "kindLabel": "Practitioner write-up",
  "title": "Credential injection at the proxy for third-party agents",
  "headline": "Credential injection at the proxy for third-party agents",
  "body": "Omnigent puts one UI over agent harnesses such as Codex, Claude Code, Pi and Goose, and on OpenShift each session gets its own OpenShell sandbox. OpenShell providers bring in a credential plus policy rules. Inside the sandbox, tokens and API keys are masked, and the OpenShell network proxy swaps in the real values when a call goes out. Filesystem and external network access are denied by default, processes run as a sandbox user, and denied connections show up as violations that can be approved live. Only environment variables cross from Omnigent to OpenShell, so config files are baked into the image, and BubbleWrap adds a second isolation layer. Omnigent is a community project, not part of the Red Hat AI roadmap.",
  "url": "https://developers.redhat.com/articles/2026/11/17/omnigent-case-study-securing-third-party-ai-agents-on-red-hat-ai-with-openshell",
  "sourceLabel": "Sean Condon, Red Hat Developer",
  "date": "2026-11-17",
  "practice": "Keep real secrets out of the agent's sandbox; inject them at an egress proxy that enforces policy."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-17-skyscrapers-component-hardening",
  "kindLabel": "Team practice",
  "title": "Least privilege for the components you run in customer clusters",
  "headline": "Least privilege for the components you run in customer clusters",
  "body": "Skyscrapers, a managed-Kubernetes provider, hardened its own components in customer clusters as a precaution, with no signs of exploitation. Internet-facing WireGuard gave up privileged mode for two network capabilities, its own user namespace and a read-only root filesystem. Flux, cert-manager, Grafana, Velero and others now run as non-root, can't escalate privileges, and use the default seccomp profile. Pods that never call the Kubernetes API get no ServiceAccount token, and several components moved secrets from env vars to mounted files. On their test cluster, open container-hardening findings went from 84 to 0: most were fixed, and the rest are marked accepted with a reason. Admission control is next.",
  "url": "https://docs.skyscrapers.eu/changelog/2026-11-09-platform-component-hardening/",
  "sourceLabel": "Skyscrapers",
  "date": "2026-11-09",
  "practice": "Strip API tokens from pods that don't need them and read secrets from files, not env vars."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-18-zeabur-rotated-key-backup",
  "kindLabel": "Team practice",
  "title": "A rotated key is only new if the backup didn't copy it",
  "headline": "A rotated key is only new if the backup didn't copy it",
  "body": "Zeabur's preliminary report on its October 14-15 breach says the attacker used long-lived admin tokens and cloud keys stored in plaintext in a private config repo. The shared cluster's admin interface was open to the internet and the tokens had no expiry. More than 16 hours of activity on October 14 raised no alert, and a user report started the investigation. The attacker read about 3.2M environment-variable records and 321,810 accounts, and ran commands in 865 database services, though not every command worked. During the response, a new backup key issued at 15:40 UTC was captured by the 16:00 daily backup and used at 20:30. How the attacker first got the credentials is still unconfirmed, and the report is marked ongoing.",
  "url": "https://zeabur.com/blogs/october-2026-security-incident",
  "sourceLabel": "Zeabur (Yuanlin Lin)",
  "date": "2026-10-19",
  "practice": "Keep backup keys out of the backups, put admin interfaces behind private access, and alert on admin use and bulk secret reads."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-18-curl-anthropic-oss-scanner",
  "kindLabel": "Practitioner write-up",
  "title": "45 AI-found vulnerabilities, five confirmed",
  "headline": "45 AI-found vulnerabilities, five confirmed",
  "body": "Anthropic's OSS Scanner sent curl 45 claimed vulnerabilities (one Medium, 44 Low) plus 23 ordinary bugs, each with a reproducer and many with suggested patches. curl confirmed 5 (11.1%), all Low, including the one rated Medium. Of the rest, 36 were just bugs, 3 were not bugs, and 1 was wrong in a way that would have added the flaw it warned about. Daniel Stenberg calls the reports high quality but too eager to label things vulnerabilities, and far too long. Patches were sometimes nearly right but more often needed human work. curl files each report as a public issue in an ASSESS state, is raising the bar for Low, and says it may reconsider taking part if this continues.",
  "url": "https://daniel.haxx.se/blog/2026/11/18/curl-on-oss-scanner/",
  "sourceLabel": "Daniel Stenberg, daniel.haxx.se",
  "date": "2026-11-18",
  "practice": "Triage AI reports against a written severity rubric with a public ASSESS state, and review any suggested patch before merging it."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-18-wiz-black-october",
  "kindLabel": "Practitioner write-up",
  "title": "A stolen AI key gets tested within 30 minutes",
  "headline": "A stolen AI key gets tested within 30 minutes",
  "body": "Wiz counted at least nine AI developer platforms that disclosed incidents in October, with later updates adding more. Public reports show attackers hunting stored environment variables, especially ones that grant AI access. In two enterprise cases Wiz ties to a vendor breach, the first misuse was a single model call within 30 minutes of the reported credential access, followed by a low-rate checker and then floods. A key allowing global inference profiles made about 800k Bedrock calls in 30 hours, about 90% successful. A key limited to US profiles still made about 1.7M calls in 13 hours, over a million successful, and regional quotas throttled most of the rest. Wiz estimates the two cases likely cost over $100k at list price.",
  "url": "https://www.wiz.io/blog/black-october-for-ai-developer-platforms",
  "sourceLabel": "Wiz (Benjamin Read, Rami McCarthy)",
  "date": "2026-10-30",
  "practice": "Scope model keys to the regions and profiles they need, set quotas, and alert on a key's first use from a new IP."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-18-apigee-implicit-redirect-uri",
  "kindLabel": "Practitioner write-up",
  "title": "Validate the value you use, not the parameter name",
  "headline": "Validate the value you use, not the parameter name",
  "body": "Nikita Markevich found that Apigee's OAuth implicit grant read a repeated redirect_uri parameter two ways. One path returned the first value, which passed strict callback validation. A second parser kept the last value, and the redirect was built from that one, so a live access token could go to a callback that was never checked. Swapping the order made Apigee reject the request, which confirmed the split. Exploiting it needed specific proxy settings and a victim completing login. The bug was reported in April 2026, marked patched, and earned a $5,000 bounty. The lesson is that a check protects one value parsed one way, so trust only travels if that same value does.",
  "url": "https://bugs.exposed/posts/apigee-implicit-redirect-uri-token-theft",
  "sourceLabel": "Nikita Markevich, bugs.exposed",
  "date": "2026-11-15",
  "practice": "Reject duplicate OAuth parameters, and pass the validated value forward instead of re-parsing raw input after a check."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-19-ardor-build-config",
  "kindLabel": "Team practice",
  "title": "User files must never become build config",
  "headline": "User files must never become build config",
  "body": "Ardor's incident report says that on Nov 6 and 8 attackers with ordinary accounts submitted application files that were written outside the source directory, into the build root, where Vite loaded them as its configuration and ran them. The build ran inside the API process, whose environment held platform secrets and a broad Kubernetes service account, so one upload reached other customers' records, internal systems and, through a separate container-builder path, individual hosts. Ardor rebuilt production on a new cluster, moved builds into isolated sandboxes with no cloud identity, narrowed service permissions, rotated credentials, checked that the old ones were rejected, and added Kubernetes audit logging. The report separates confirmed disclosure from possible access, and some build and deploy features are still restricted. It was updated Nov 17.",
  "url": "https://ardor.cloud/blog/security-incident-november-2026",
  "sourceLabel": "Ardor",
  "date": "2026-11-17",
  "practice": "Run untrusted builds in a sandbox that holds no platform credentials, and prove a rotation worked by checking that the old keys fail."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-19-cyber-centre-detection-pipeline",
  "kindLabel": "Team practice",
  "title": "A purple-team loop that writes and attacks its own detections",
  "headline": "A purple-team loop that writes and attacks its own detections",
  "body": "The Canadian Centre for Cyber Security's Frontier AI Lab describes a two-agent detection pipeline. A blue agent (Opus 4.8) reads a public threat article and drafts detection logic. A red agent (Mythos) writes an attack plan, provisions a lab with the same security stack as production, runs several variants of the technique and looks for bypasses. The blue agent validates the analytic against lab and real operational data and refines it, and analysts approve or change the result before it is merged. One test case produced 8 production rules, each tested against more than 5 variants of the technique to find durable behaviour. The Centre says this work usually takes hours to a week and the pipeline did it in under an hour. Next it plans to turn validated false positives into tuning recommendations. The article was published Jul 30, 2026.",
  "url": "https://www.cyber.gc.ca/en/guidance/canadian-centre-cyber-security-used-frontier-ai-accelerate-detection-engineering",
  "sourceLabel": "Canadian Centre for Cyber Security",
  "date": "2026-07-30",
  "practice": "Don't ship a detection until it has fired on detonated telemetry from several variants of the technique."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-19-tines-threat-hunting-agent",
  "kindLabel": "Team practice",
  "title": "An hourly hunt from a hypothesis library, tuned by analyst verdicts",
  "headline": "An hourly hunt from a hypothesis library, tuned by analyst verdicts",
  "body": "Andrew Katz of Tines describes an agent that runs every hour on a small SecOps team. It picks a hypothesis from the open-source HEARTH collection or from about 10 written in-house, with context about the company's AWS, Google Workspace and Slack setup. It investigates through MCP tools (Panther, JumpCloud, VirusTotal, GreyNoise, CrowdStrike, Jira) and opens a case if something needs attention. Analyst verdicts (benign, suspicious, malicious) and steering notes shape later hunts, and the agent flags logs it was missing. Over five months it found four or five issues that needed action, and the AI cost for the whole system was under $164 in September 2026. This is a vendor writing about its own product, so the results are self-reported.",
  "url": "https://www.tines.com/blog/security-threat-hunting-agent/",
  "sourceLabel": "Andrew Katz, Tines",
  "date": "2026-11-18",
  "practice": "Write hunts as hypotheses tied to your environment, and feed every analyst verdict back into the next run."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-19-near-ai-sglang-incident",
  "kindLabel": "Team practice",
  "title": "The enclave protects you from the host, not from your own software",
  "headline": "The enclave protects you from the host, not from your own software",
  "body": "NEAR AI's incident report says an attacker used a remote code execution bug in SGLang, the open-source inference engine, to get code execution on one inference server and then reach more of its infrastructure. Confirmed exposure: account details (email, name, and for some accounts plan and balance) for about 100 users, and 18 agents on a legacy deployment that ran outside the confidential-computing environment. On Nov 8 the attacker could also have seen requests being processed on that server, including confidential-mode ones. Two Cloud customers' API keys were exposed in logs and revoked. NEAR found no sign that stored Private Chat conversations or uploaded files were accessed. It fixed SGLang everywhere, rotated credentials, reported the bug upstream, and now reviews the inference software and the services around the enclave as rigorously as the enclave itself.",
  "url": "https://near.ai/blog/security-incident-report-sglang-vulnerability",
  "sourceLabel": "NEAR AI",
  "date": "2026-11-09",
  "practice": "Put the inference server and its logs inside your threat model and patch cycle, and keep secrets out of logs."
 },
 {
  "mode": "research",

  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-19-lit-bb-hack-tools",
  "kindLabel": "Project",
  "title": "Small pipe-friendly tools for recon lists",
  "headline": "Small pipe-friendly tools for recon lists",
  "body": "lit-bb-hack-tools by edoardottt is a collection of 26 small Go command-line tools for web bug bounty work. Most read a list on stdin and print a result on stdout: they pull hosts, paths, parameters and extensions out of URL lists, extract endpoints from JS files and paths from robots.txt, and list CNAME records for takeover checks. Two (bbscope, genscope) filter items against a Burp scope configuration or build one. Some tools contact targets or third-party services, so check what each does before running it. It is GPL-3.0, has CI and about 400 stars. The project dates from 2021; the latest commit was Nov 13, 2026, a small CI-config change.",
  "url": "https://github.com/edoardottt/lit-bb-hack-tools",
  "sourceLabel": "edoardottt (GitHub)",
  "date": "2026-11-13",
  "practice": "Put a scope filter in the pipeline before any tool that touches the target."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-20-lyceum-old-public-code",
  "kindLabel": "Team practice",
  "title": "Old public code is still your attack surface",
  "headline": "Old public code is still your attack surface",
  "body": "Lyceum shut down its platform on Nov 9 after spotting an attack it identifies as coming from an autonomous, agent-based system. Entry came from combining information in the source code of an outdated version of Lyceum's own open-source tool with a vulnerability at an external database provider. That reached part of its internal systems and the user database, so Lyceum treats registration data (emails, contact names, company addresses, optional phone numbers) as compromised. Payment card and bank details and Lyceum API keys were not affected. It reported the flaw to the provider, removed all old versions of the tool, notified the Berlin data protection authority under GDPR, and restored all products on Nov 12. Fixes: credential rotation, automated checks of every release, separating customer workloads from the internal network, a login on every internal tool, full request logging, and continuous penetration testing of its own infrastructure with security models.",
  "url": "https://lyceum.technology/blog/november-2026-security-incident/",
  "sourceLabel": "Max Niroomand, Lyceum",
  "date": "2026-11-13",
  "practice": "Review old releases of your public tools for internal details and remove the ones that leak."
 },
 {
