  "id": "seceng-2026-11-20-packagist-zizmor",
  "kindLabel": "Team practice",
  "title": "Workflow files are code holding production credentials",
  "headline": "Workflow files are code holding production credentials",
  "body": "Steven Rombauts describes how the Composer and Packagist team hardened its GitHub Actions with zizmor, running it as a blocking check in the strictest ('pedantic') mode. He recommends pinning actions to commit SHAs and letting Dependabot or Renovate propose updates. Pitfalls: turning off credential persistence on checkout can break later steps that push or tag. A job with no permissions block can inherit a write-scoped token set at the organization level. Each maintained branch, such as Composer's 2.2 LTS, has its own workflow copy and needs its own fix. And suppressing findings in bulk defeats the point. zizmor would not have caught the May 2026 leak of GitHub tokens into Composer's CI logs, but a read-only token limits that kind of damage.",
  "url": "https://blog.packagist.com/securing-our-github-actions-workflows-with-zizmor/",
  "sourceLabel": "Steven Rombauts, Packagist",
  "date": "2026-07-23",
  "practice": "Set permissions: {} at the workflow level and grant scopes per job."
 },
 {
  "mode": "research",

  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-20-mnemonic-agentic-detection",
  "kindLabel": "Team practice",
  "title": "Give the agent your detection inventory, keep the merge button",
  "headline": "Give the agent your detection inventory, keep the merge button",
  "body": "mnemonic says its 2023 attempt at using language models on threat reports failed: models invented MITRE techniques, could not take long reports, and gave inconsistent answers. Its 2026 workflow uses output schemas, MCP and reusable skills. An agent turns a threat report into structured detection opportunities. A second step checks each one against mnemonic's detection inventory through an MCP server to see whether it is already covered. An orchestrator skill then drives specialist skills (detection patterns, taxonomy placement, event selection, scaffolding, linting, and a separate one for tests) to draft a rule. Every draft is treated as unverified, and an analyst validates it before it is merged. The post has no publication date.",
  "url": "https://www.mnemonic.io/resources/blog/agentic-detection-engineering-turning-threat-reports-into-detections/",
  "sourceLabel": "mnemonic",
  "date": null,
  "practice": "Expose your detection catalogue to agents so they can check coverage before drafting, and keep a human approving every merge."
 },
 {

  "kind": "post",
  "id": "seceng-2026-11-21-1password-logging-gaps",
  "kindLabel": "Team practice",
  "title": "Audit what your SIEM can't see before an incident does",
  "headline": "Audit what your SIEM can't see before an incident does",
  "body": "Sanya Kohli describes a scheduled audit at 1Password. A Python script uses APIs to pull procurement vendor lists, internal tool catalogs, SIEM log sources and tickets. The model only judges which vendors probably have security-relevant logs, and writes up each gap with its priority. The audit looks for two kinds of gap: tools that send no logs to the SIEM, and sources that look onboarded but have stopped sending or aren't parsed into searchable fields. Engineers close gaps with AI skills (instruction files that include required checks and approvals) and review every proposed action. Matching tools by name is a known limitation, because names can be ambiguous and the assessment can miss tools.",
  "url": "https://1password.com/blog/ai-security-logging-gaps",
  "sourceLabel": "Sanya Kohli, 1Password",
  "date": "2026-11-18",
  "practice": "Compare your tool inventory with your SIEM sources on a schedule, and count arriving but unparsed logs as a gap."
 },
 {

  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-21-bitrise-artex-incident",
  "kindLabel": "Team practice",
  "title": "One dormant account, ten hours, 919 keys rotated",
  "headline": "One dormant account, ten hours, 919 keys rotated",
  "body": "Between Oct 25 and Nov 18, 2026, an operator used ARTEX, an open-source AI pentest platform, against Bitrise. The agents first mapped the public surface under user agents that claimed to be an \"authorized pentest\", then came back as a customer and tried to reach other customers' files, which failed. On Nov 13 they signed in to a dormant internal test bot account that had no two-factor authentication and were using cloud keys 10 min 37 s later. For about ten hours they chained credentials to signing files, source code, infrastructure state and build logs; files in 15 customer workspaces were also accessed, and Bitrise contacted those customers. Bitrise shut the platform down, revoked all 919 cloud service-account keys, rotated every production secret it manages and rebuilt its build infrastructure. A replay on Nov 18 was refused. The report grades the evidence behind each step.",
  "url": "https://bitrise.io/artex-incident-report",
  "sourceLabel": "Arpad Kun and Imre Szvorenyi, Bitrise",
  "date": "2026-11-19",
  "practice": "Find and remove dormant test and service accounts, and require a second factor on every interactive login, including bot accounts."
 },
 {

  "kind": "post",
  "id": "seceng-2026-11-21-daylight-call-signs-canaries",
  "kindLabel": "Team practice",
  "title": "AI intruders leave tool marks you can hunt",
  "headline": "AI intruders leave tool marks you can hunt",
  "body": "Daylight Vanguard investigated an intrusion in which an operator used valid credentials on an internet-facing admin console that sat outside the site's extra authentication layer. A scripting feature in the console ran as root. Over about 105 minutes the operator ran 301 root commands and took cloud, CI/CD, SSH and TLS secrets plus source code. Daylight assesses with high confidence that most of this was done by an autonomous LLM agent, most likely several parallel workers, and does not name a framework. It lists five fingerprints: canary files signed with a call-sign, batched parallel commands, a steady machine-paced rhythm, output trimmed to fit a context window, and failed commands corrected within seconds. Human involvement in the first console session cannot be ruled out.",
  "url": "https://daylight.ai/blog/call-signs-and-canaries-fingerprinting-an-ai-agent-intrusion",
  "sourceLabel": "Garcia, Hau and Biderman, Daylight",
  "date": "2026-11-16",
  "practice": "Hunt for agent tool marks, and keep every admin console behind your auth layer."
 },
 {
  "mode": "research",

  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-21-datadog-turnstile",
  "kindLabel": "Team practice",
  "title": "A valid signature doesn't mean a safe artifact",
  "headline": "A valid signature doesn't mean a safe artifact",
  "body": "Callan Lamb and Brianna Heffernen explain why a container image signature cannot catch a bad commit, a poisoned dependency or a compromised build runner, because those happen before signing. Datadog's internal Turnstile system records cryptographically signed attestations through each artifact's life cycle, including pull request approvals and the build runner's identity, and checks them at deploy time against a per-environment policy that is stricter for production and regulated environments. New policies can warn in some environments and block in others, across tens of thousands of deployments a day. The design follows the source and build integrity principles in the SLSA threat model.",
  "url": "https://www.datadoghq.com/blog/engineering/software-supply-chain-policy-enforcement/",
  "sourceLabel": "Callan Lamb and Brianna Heffernen, Datadog",
  "date": "2026-10-20",
  "practice": "At deploy time, ask whether the artifact meets this environment's policy, and start new rules in warn mode."
 },
 {

  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-22-1password-hypersage-prover",
  "kindLabel": "Team practice",
  "title": "Grade the reviewer against the fixes, not the emoji",
  "headline": "Grade the reviewer against the fixes, not the emoji",
  "body": "Megan Barker describes HyperSAGE (SAGE v3), which adds a fourth pipeline stage, the Prover, after the Finder, Critic and Judge. About two-thirds of reviewer reactions on SAGE findings were thumbs-down; going through the rejections by hand, the most common reason, about a third, was that the code was already protected elsewhere. The Prover is a read-only agent (read, search and list only) with a fixed token budget. To suppress a finding it must cite real code and pick a reason from a fixed list, and it fails open: if it cannot meet that bar, the finding is posted. 1Password graded 125 past findings by what engineers actually fixed, not by emoji: 86 false positives and 39 true positives, of which only four were real unprotected flaws and 35 were hardening. The Prover suppressed 85 of 86 false positives, kept all four real unprotected flaws, and also dropped the 26 hardening findings. The authors note that four is a small sample and that this is an internal test.",
  "url": "https://1password.com/blog/scaling-security-reviews-agentic-pipeline",
  "sourceLabel": "Megan Barker, 1Password",
  "date": "2026-11-09",
  "practice": "Grade a review agent against the fixes engineers made, and require a citation and a fixed reason before it can suppress a finding."
 },
 {

  "category": "SecEng",

  "id": "seceng-2026-11-22-lnbits-nov8-incident",
  "kindLabel": "Team practice",
  "title": "Plugins are untrusted, even after a patch ships",
  "headline": "Plugins are untrusted, even after a patch ships",
  "body": "On 8 November 2026, many LNbits instances were attacked, including LNbits' own infrastructure, and funds were stolen. The report, published on 16 November, says entry came through server-side request forgery in several legacy Python extensions, and through recently patched extensions that some operators had not yet updated. In the more serious cases, attackers reached the underlying servers, probed internal services such as Caddy's admin API, and deployed malicious extensions that appeared to be built for each environment. LNbits believes the activity matches autonomous AI agents, but says it cannot confirm the tools used. Earlier reviews, including audits with advanced AI models, had missed these bugs. LNbits 1.7, released on 10 November, turns public registration off by default, adds an option for automatic extension updates, and continues a move to sandboxed WebAssembly extensions that began in 1.6.",
  "url": "https://news.lnbits.com/news/november-8th-incident-report",
  "sourceLabel": "LNbits Team",
  "date": "2026-11-16",
  "practice": "Treat plugins as untrusted and sandbox them, block internal admin APIs from the app, and shorten the time from patch to deploy."
 },
 {

  "id": "seceng-2026-11-22-ebury-iam-bridge",
  "kindLabel": "Team practice",
  "title": "Make keyless easier than keys",
  "headline": "Make keyless easier than keys",
  "body": "Nacho Rivera describes how Ebury replaced static AWS access keys and GCP service-account keys, which were shared and rarely rotated, with short-lived tokens issued through OIDC federation (STS AssumeRoleWithWebIdentity and GCP Workload Identity Federation). A dedicated hub AWS account and a dedicated hub GCP project, both owned by Security Engineering, are the only points of identity transfer between clouds, so those transfers can be audited in one place. Each application gets its own IAM entity on both sides. A team opens a GitHub Issue from a template; a pipeline validates the request, writes Terraform for both clouds, opens a pull request, and applies it after approval. A client library then wraps the token exchange in one call. The resulting credentials expire in minutes.",
  "url": "https://eburytech.substack.com/p/goodbye-access-keys-how-we-built",
  "sourceLabel": "Nacho Rivera, Ebury",
  "date": "2026-03-09",
  "practice": "Inventory static keys, and make the keyless path easier than handing out a long-lived secret."
 },
 {

  "category": "SecEng",

  "id": "seceng-2026-11-22-block-kube-policies-binauthz",
  "kindLabel": "Team practice",
  "title": "A valid signature still has to pass admission",
  "headline": "A valid signature still has to pass admission",
  "body": "Hardik Darji and colleagues describe BinauthZ, a plugin built into Block's existing OPA admission controller, Kube-Policies, rather than a second controller. At the Pod boundary it uses Sigstore/cosign to check a signature against an AWS KMS key, then passes signed build metadata such as the repository, commit, branch and build system to Rego. Configuration maps image patterns to a verification strategy and key. The webhook fails closed with a 10-second budget, so verification of the images in a request runs concurrently and results are cached with a one-hour TTL. Transient ECR, KMS or network errors are never cached, so a brief outage cannot linger as a denial or an allow for that hour.",
  "url": "https://engineering.block.xyz/blog/kube-policies-binauthz-closing-the-supply-chain-gap-in-kubernetes",
  "sourceLabel": "Darji, Gonzalez, Holliday, Donovan and Wilk, Block",
  "date": "2026-01-20",
  "practice": "Enforce artifact checks at admission, fail closed, and keep transient dependency errors out of the cache."
 },
 {

  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-23-korur-networkpolicy-semantics",
  "kindLabel": "Team practice",
  "title": "The API stores it; your CNI decides the session",
  "headline": "The API stores it; your CNI decides the session",
  "body": "Berkhan Tukuş notes that Kubernetes stores NetworkPolicies but the control plane never enforces them, and they have no status field — the status was removed from the v1 type, so the API cannot tell you whether a plugin has programmed a policy. He reads the Calico v3.33.0 and Cilium v1.20.4 source to show how the same YAML compiles differently. Calico checks policy only on new connections, so removing an allow rule leaves established sessions up; Cilium drops the next packet in the original direction. An ipBlock covering pod IPs matches on Calico but not on Cilium unless --policy-cidr-match-mode is set. His rules: default-deny both ways plus DNS egress, no ipBlock for in-cluster targets, and test revocation as well as admission.",
  "url": "https://korur.com/en/insights/kubernetes-networkpolicy-semantics",
  "sourceLabel": "Berkhan Tukuş, Korur",
  "date": "2026-11-06",
  "practice": "Before relying on push-deny-all to isolate, test what your CNI does to live sessions and add a step that ends them."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-23-chainstack-incident",
  "kindLabel": "Team practice",
  "title": "Default Grafana, then cluster-admin",
  "headline": "Default Grafana, then cluster-admin",
  "body": "Chainstack's 3 November incident report, with technical details added on 10 November, says an attacker entered through an internet-exposed Grafana instance in a development cluster that still had its default administrator credentials and no single sign-on or basic authentication in front. Grafana's data-source proxy, with no destination allowlist, reached an unauthenticated MCP tool server whose service account had cluster-admin rights. Machine credentials from development also reached production: on 31 October the attacker read secrets in bulk from the production cloud secrets manager and used a compromised VPN key to query production databases. A database of customer account information was accessed — organization names, account-holder names, member email addresses and password hashes — and node credentials are treated as exposed even though Chainstack has no evidence they were read. Customer-facing services were not modified. Chainstack says the attacker used the ARTEX framework, and that no software vulnerability was exploited: the path chained default credentials, exposed admin functionality, missing authentication, over-broad permissions and long-lived credentials. Access began on 26 October, reached production on 29 October, and was detected and cut the same day on 31 October, after a VPN identity clash broke database replication.",
  "url": "https://chainstack.com/security-incident-nov-2026/",
  "sourceLabel": "Chainstack",
  "date": "2026-11-03",
  "practice": "Keep development admin tools off the public internet, change their default credentials, and never give a debug or MCP server cluster-admin or credentials that also reach production."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-24-splunk-soc-agents",
  "kindLabel": "Team practice",
  "title": "Match agent autonomy to the task, not the role",
  "headline": "Match agent autonomy to the task, not the role",
  "body": "Splunk's own SOC, which acts as Customer Zero for its security products, sorts agent work into three modes rather than by job title. Delegated: high-volume work such as triage, enrichment, evidence gathering and routine disposition runs end to end, with spot checks. Guided: an analyst steers while the agent builds playbooks or connectors. Bounded: the agent drafts detection logic and response decisions, and a person approves before anything is committed. Splunk measured these figures in its own SOC: average triage handle time fell from 15.4 to 5.6 minutes, and writing a detection fell from about two hours to under ten minutes. The lessons: escalation counts as a feature, not a failure, and clear response plans improved the agent's verdicts. This is a vendor post about Splunk's own agents in Splunk Enterprise Security.",
  "url": "https://www.splunk.com/en_us/blog/artificial-intelligence/how-splunk-soc-uses-agents.html",
  "sourceLabel": "Abhey Kohli, Splunk",
  "date": "2026-11-05",
  "practice": "Pick the autonomy mode per task, and make a person approve anything that changes detections or response."
 },
 {

  "id": "seceng-2026-11-24-sentra-qubole-supply-chain",

  "title": "The vendor role you forgot is still a door",
  "headline": "The vendor role you forgot is still a door",
  "body": "An attacker used stolen Qubole credentials to assume cross-account AWS roles that customers had granted Qubole, many of them long after the customers stopped using the service. More than a dozen organizations were hit. Every role used an ExternalId, and the attacker presented the right one each time. About 100 passwords and keys were read in 7 minutes from three stores, plus thousands of credential records in downloaded files. The post describes pulls from Secrets Manager, SSM Parameter Store, Lambda environment variables and EC2 user data, and says there were zero write actions. What gave them away was the network — a rented OVH server and the Mullvad VPN, not Qubole's — and the behavior, not the credentials. This is a vendor post.",
  "url": "https://sentra.io/blog/breaches/inside-the-qubole-supply-chain-attack",
  "sourceLabel": "Reiter, Drucker, Rozali and Kranz, Sentra",
  "date": "2026-11-09",
  "practice": "List third-party trust roles, remove dormant ones, and alert when a vendor role acts from a new network."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-24-jfrog-agent-framework-hijack",
  "kindLabel": "Team practice",
  "title": "Installing is not running, but the next python is",
  "headline": "Installing is not running, but the next python is",
  "body": "JFrog reports that Microsoft's agent-framework meta-package (about 40,000 weekly downloads) had versions 1.26.1 and 1.26.2 repacked locally and pushed to PyPI on 17 November 2026. A .pth file in site-packages runs a credential stealer whenever Python starts — including pytest, pip and IDE language servers — even if nothing imports the package. Installing the wheel does not run the stealer by itself; the next Python process in that environment does. ZIP headers showed the wheels did not come from Microsoft's release pipeline. PyPI quarantined 1.26.1 after 31 minutes, and the attacker uploaded 1.26.2 two minutes later, because quarantining a version does not revoke the publishing credential. Automated dependency bots such as Renovate were already opening upgrade PRs within six minutes of 1.26.1 landing.",
  "url": "https://research.jfrog.com/post/agent-framework-hijack/",
  "sourceLabel": "Shavit Satou, JFrog Security Research",
  "date": "2026-11-18",
  "practice": "Add a cooldown before auto-merging fresh releases, and flag new .pth files in builds."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-24-jane-vector",
  "kindLabel": "Team practice",
  "title": "Let the agent retest the fix, keep the verdict human",
  "headline": "Let the agent retest the fix, keep the verdict human",
  "body": "Mohammad Kamrani describes Vector, Jane's internal AppSec platform, with four modules: retesting reported vulnerabilities (against the running app or from the code alone), triaging scanner findings, AI-native SAST built on the open-source deepsec, and PR scanning. Each agent pulls context from Jira and GitHub and returns a verdict with evidence. The retest module uses FIXED, NOT_FIXED, PARTIALLY_FIXED or NEEDS_HUMAN_REVIEW; a person approves or overrides the verdict. Jane says static triage cut a backlog of more than 2,000 tickets by over 80%. Each repository has a context brief, and an adversarial pass tries to refute the brief before a human reads it.",
  "url": "https://building.jane.app/vector-secure-sdlc/",
  "sourceLabel": "Mohammad Kamrani, Jane",
  "date": "2026-09-15",
  "practice": "Make \"is the fix real?\" an agent retest with a human sign-off, not a manual re-run."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-25-temporal-security-compounds",
  "kindLabel": "Team practice",
  "title": "Give agents a written record of every trust boundary",
  "headline": "Give agents a written record of every trust boundary",
  "body": "Kent Gruber describes how Temporal's AppSec team keeps a Git repo of Markdown, Mermaid diagrams and Go tests. For each component it records the trust boundaries, the control guarding each one, and why. Claims cite source lines and design docs. Every tested control has at least two tests: one showing it holds and one showing the bypass fails. Agents use the record to triage researcher reports and review designs, and every job ends with a reviewed PR adding what it learned. Controls outside the model: a hook masks credentials in tool output, a CVE needs a person's signed approval, and agents can't merge without human approval. Investigations still mostly run as long-lived agent sessions.",
  "url": "https://temporal.click/blog/security-that-compounds",
  "sourceLabel": "Kent Gruber, Temporal",
  "date": "2026-11-18",
  "practice": "For each trust boundary, keep one test that the control holds and one that the bypass fails, and make agents cite them."
 },
 {
  "mode": "research",
  "day": null,
  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-25-socket-gha-hardening",
  "kindLabel": "Practitioner write-up",
  "title": "Nine controls for a release pipeline outsiders can't hijack",
  "headline": "Nine controls for a release pipeline outsiders can't hijack",
  "body": "Karlo Zanki starts from incidents in which malicious code entered legitimate packages during the release, and in most cases that release ran on GitHub Actions: tj-actions/changed-files, Nx s1ngularity, Shai-Hulud, TanStack Router and others. Each of the nine chapters gives the mistake, cases seen in the wild and the config fix: pin actions to full commit SHAs, give GITHUB_TOKEN no permissions by default, never build untrusted code in pull_request_target, stop expression injection into run blocks, close the cache trust boundary, isolate or eliminate self-hosted runners, control dependency intake, verify third-party scripts and uploaders, and restrict runner egress. It ends with where these controls stop working.",
  "url": "https://socket.dev/blog/hardening-github-actions-against-outside-threats",
  "sourceLabel": "Karlo Zanki, Socket",
  "date": "2026-11-03",
  "practice": "Audit one release workflow against all nine chapters."
 },
 {

  "id": "seceng-2026-11-25-oracle-oci-iam-agents",
  "kindLabel": "Team practice",
  "title": "Agents keep the user's permissions, not a god-mode account",
  "headline": "Agents keep the user's permissions, not a god-mode account",
  "body": "Atul Goyal, Rajath Ravikumar and Harman Judge describe Oracle's internal AI rollout. This is a vendor post about Oracle's own products. Enterprise ChatGPT reaches internal systems through an MCP layer that carries the employee's identity (OAuth discovery, PKCE, Client ID Metadata Documents, resource indicators, user consent). The backend checks each request against that employee's own permissions, and consent to read doesn't authorize writes. Codex and operations agents get just-in-time access, least-privilege reviews and human approval for sensitive actions. Code scanners in OKE use workload identity federation instead of long-lived model API keys. Console AI uses service-specific Deny policies that block destructive operations even for broadly privileged users.",
  "url": "https://blogs.oracle.com/cloud-infrastructure/iam-enables-ai-transformation-at-oracle",
  "sourceLabel": "Atul Goyal, Rajath Ravikumar and Harman Judge, Oracle",

  "practice": "Before you give an agent a service account, check whether it can act as the user instead, and add an explicit deny for destructive actions."
 },
 {
  "mode": "research",

  "category": "SecEng",
  "kind": "post",
  "id": "seceng-2026-11-25-aibp-sign2shell",
  "kindLabel": "Practitioner write-up",
  "title": "Never let a web page pick what your native helper loads",
  "headline": "Never let a web page pick what your native helper loads",
  "body": "James Arnott found drive-by RCEs (CVSS 3.1 9.6) in the five most-installed Brazilian digital-signing extensions, about 10 million installs together. In all five, the website could choose which DLL the vendor's native host loads, and software built to verify signatures never checked the signature of the code it loaded. Four are fixed; CertiPlugin is mitigated (its allowlist was narrowed) but not fixed. The authors' fix: load DLLs only from a fixed allowlist, verify the file's signature, and take the origin from the browser instead of parsing URLs by hand. They found the bugs with a pipeline that flags extensions passing page input to a native host.",
  "url": "https://amibeingpwned.com/blog/how-we-hacked-brazil",
  "sourceLabel": "James Arnott, Am I Being Pwned",
  "date": "2026-11-17",
  "practice": "List the browser extensions that have native messaging hosts and check which page input reaches them."
 }

}
function saveRead() {
 localStorage.setItem(STORAGE_KEY, JSON.stringify(state.read));
}
function isRead(id) {
 return !!(state.read[id] && state.read[id].readAt);
}
function markRead(id) {
 if (!isRead(id)) {
 state.read[id] = { readAt: new Date().toISOString() };
 saveRead();
 return true;
 }
 return false;
}

/** Unread-first within mode; stable relative order from CARDS. */
function modeCards() {
 const list = CARDS.filter(c => c.mode === state.mode);
 const unread = list.filter(c => !isRead(c.id));
 const read = list.filter(c => isRead(c.id));
 return unread.concat(read);
}

function counts() {
 const train = CARDS.filter(c => c.mode === 'training');
 const res = CARDS.filter(c => c.mode === 'research');
 return {
 train: train.length,
 res: res.length,
 trainRead: train.filter(c => isRead(c.id)).length,
 resRead: res.filter(c => isRead(c.id)).length,
 total: CARDS.length,
 readN: CARDS.filter(c => isRead(c.id)).length,
 };
}

function escapeHtml(s) {
 return String(s).replace(/[&<>"']/g, c => ({
 '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
 }[c]));
}
function escapeAttr(s) {
 return escapeHtml(s).replace(/`/g, '&#96;');
}

function kindChipClass(kind) {
 if (kind === 'lab') return 'chip-kind-lab';
 if (kind === 'practice') return 'chip-kind-practice';
 return 'chip-kind-paper';
}

function buildCardHTML(card) {
 const read = isRead(card.id);
 const citeLabel = card.sourceLabel || 'Source';
 const linkText = citeLabel === 'Read the paper' ? 'Read the paper ↗' : 'Open primary source ↗';
 return `
 <article class="card" data-id="${escapeAttr(card.id)}" aria-label="${escapeAttr(card.title)}">
 <div class="chips">
 <span class="chip ${kindChipClass(card.kind)}">${escapeHtml(card.kindLabel)}</span>
 <span class="chip ${read ? 'chip-read' : 'chip-unread'}">${read ? 'Read' : 'Unread'}</span>
 ${card.date ? `<span class="chip">${escapeHtml(card.date)}</span>` : ''}
 ${card.mode === 'training' && card.day ? `<span class="chip chip-acid">Day ${card.day}</span>` : ''}
 </div>
 <div class="t-stagger" data-stagger>
 <h2 class="headline t-stagger-line t-stagger-line--1">${escapeHtml(card.headline || card.title)}</h2>
 <p class="lede t-stagger-line t-stagger-line--2">${escapeHtml(card.body)}</p>
 </div>
 <div class="cite">
 <span class="cite-label">${escapeHtml(citeLabel)}</span>
 <a href="${escapeAttr(card.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(linkText)}</a>
 </div>
 </article>
 `;
}

function syncTabsPill(animate) {
 const bar = document.getElementById('modeTabs');
 const pill = document.getElementById('tabsPill');
 const tabs = [...bar.querySelectorAll('.t-tab')];
 const active = tabs.find(t => t.getAttribute('aria-selected') === 'true') || tabs[0];
 if (!animate) {
 const prev = pill.style.transition;
 pill.style.transition = 'none';
 pill.style.transform = `translateX(${active.offsetLeft}px)`;
 pill.style.width = `${active.offsetWidth}px`;
 void pill.offsetWidth;
 pill.style.transition = prev;
 } else {
 pill.style.transform = `translateX(${active.offsetLeft}px)`;
 pill.style.width = `${active.offsetWidth}px`;
 }
}

function updateChrome() {
 const list = modeCards();
 const c = counts();
 const modeRead = state.mode === 'training' ? c.trainRead : c.resRead;
 const modeTotal = state.mode === 'training' ? c.train : c.res;
 document.getElementById('metricRead').textContent = String(modeRead);
 document.getElementById('metricRest').textContent =
 `/ ${modeTotal} ${state.mode === 'training' ? 'training' : 'research'}`;

 const markBtn = document.getElementById('markBtn');
 const cur = list[state.index];
 if (cur && isRead(cur.id)) {
 markBtn.textContent = 'Already read';
 markBtn.disabled = true;
 } else {
 markBtn.innerHTML = `<span class="btn-check" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 48 48" fill="none"><path d="M10 24.5L20 34.5L38 14" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span> Mark as read`;
 markBtn.disabled = state.animating || !cur;
 }
 document.getElementById('prevBtn').disabled = state.animating || state.index <= 0;
 document.getElementById('nextBtn').disabled = state.animating || !cur || state.index >= list.length - 1;

 document.getElementById('tabTraining').setAttribute('aria-selected', state.mode === 'training' ? 'true' : 'false');
 document.getElementById('tabResearch').setAttribute('aria-selected', state.mode === 'research' ? 'true' : 'false');

 document.getElementById('live').textContent =
 `${modeRead} of ${modeTotal} ${state.mode} read. Showing card ${state.index + 1} of ${list.length}.`;
}

function setSlotHeight(el) {
 const slot = document.getElementById('cardSlot');
 if (!el) { slot.style.height = 'auto'; return; }
 const h = el.offsetHeight;
 slot.style.height = h + 'px';
}

function revealStagger(root) {
 const block = root.querySelector('[data-stagger]');
 if (!block) return;
 block.classList.remove('is-hiding', 'is-shown');
 void block.offsetHeight;
 block.classList.add('is-shown');
}

function showToast(msg) {
 const t = document.getElementById('toast');
 const check = document.getElementById('toastCheck');
 document.getElementById('toastText').textContent = msg;
 check.setAttribute('data-state', 'out');
 void check.offsetWidth;
 check.setAttribute('data-state', 'in');
 t.classList.add('is-open');
 clearTimeout(showToast._timer);
 showToast._timer = setTimeout(() => {
 t.classList.remove('is-open');
 setTimeout(() => check.setAttribute('data-state', 'out'), 280);
 }, 1600);
}

function mountCard(direction) {
 const list = modeCards();
 if (!list.length) return;
 if (state.index < 0) state.index = 0;
 if (state.index >= list.length) state.index = list.length - 1;
 const card = list[state.index];
 const slot = document.getElementById('cardSlot');

 const pane = document.createElement('div');
 pane.className = 'card-pane';
 pane.innerHTML = buildCardHTML(card);

 const prev = slot.querySelector('.card-pane:not(.is-exit-next):not(.is-exit-prev)');

 if (prev && direction) {
 state.animating = true;
 updateChrome();
 const exitClass = direction === 'prev' ? 'is-exit-prev' : 'is-exit-next';
 const enterClass = direction === 'prev' ? 'is-enter-prev' : 'is-enter-next';
 prev.classList.add(exitClass);
 pane.classList.add(enterClass);
 slot.appendChild(pane);

 // Measure incoming content for height morph
 requestAnimationFrame(() => {
 setSlotHeight(pane);
 revealStagger(pane);
 });

 const done = () => {
 prev.remove();
 pane.classList.remove(enterClass);
 state.animating = false;
 updateChrome();
 setSlotHeight(pane);
 };
 prev.addEventListener('animationend', done, { once: true });
 setTimeout(done, 320);
 } else {
 slot.innerHTML = '';
 slot.appendChild(pane);
 // First paint: set height without fighting layout
 slot.style.height = 'auto';
 requestAnimationFrame(() => {
 setSlotHeight(pane);
 revealStagger(pane);
 });
 updateChrome();
 }
}

function goNext(mark) {
 if (state.animating) return;
 const list = modeCards();
 const cur = list[state.index];
 if (!cur) return;

 // Enter / Mark on an already-read card just advances (no toast)
 if (mark && isRead(cur.id)) {
 if (state.index < list.length - 1) {
 state.index += 1;
 mountCard('next');
 }
 return;
 }

 if (mark) {
 const newly = markRead(cur.id);
 if (newly) showToast('Marked read');
 const nextList = modeCards();
 // Current card just moved into the read section; land on first unread
 const nextUnread = nextList.findIndex(c => !isRead(c.id));
 if (nextUnread >= 0) {
 state.index = nextUnread;
 mountCard('next');
 } else {
 state.index = Math.max(0, nextList.length - 1);
 mountCard(null);
 if (newly) showToast('Marked read · end of list');
 }
 return;
 }

 if (state.index < list.length - 1) {
 state.index += 1;
 mountCard('next');
 }
}

function goPrev() {
 if (state.animating || state.index <= 0) return;
 state.index -= 1;
 mountCard('prev');
}

function setMode(mode) {
 if (mode === state.mode) return;
 state.mode = mode;
 state.index = 0;
 syncTabsPill(true);
 mountCard('next');
}

function openSheet() {
 const backdrop = document.getElementById('backdrop');
 const sheet = document.getElementById('sheet');
 backdrop.hidden = false;
 sheet.hidden = false;
 requestAnimationFrame(() => {
 backdrop.classList.add('open');
 sheet.classList.add('open');
 });
 renderSheet();
}
function closeSheet() {
 const backdrop = document.getElementById('backdrop');
 const sheet = document.getElementById('sheet');
 backdrop.classList.remove('open');
 sheet.classList.remove('open');
 setTimeout(() => {
 backdrop.hidden = true;
 sheet.hidden = true;
 }, 300);
}

function renderSheet() {
 const list = document.getElementById('sheetList');
 const f = state.drawerFilter;
 let items = CARDS.slice();
 if (f === 'unread') items = items.filter(c => !isRead(c.id));
 else if (f === 'read') items = items.filter(c => isRead(c.id));
 else if (f === 'training') items = items.filter(c => c.mode === 'training');
 else if (f === 'research') items = items.filter(c => c.mode === 'research');
 else if (f === 'lab' || f === 'practice' || f === 'paper') items = items.filter(c => c.kind === f);

 const cur = modeCards()[state.index];
 list.innerHTML = items.map(c => `
 <button type="button" class="sheet-item${cur && cur.id === c.id ? ' is-current' : ''}" data-id="${escapeAttr(c.id)}">
 <span class="t">${escapeHtml(c.title)}</span>
 <span class="m">
 <span>${c.mode === 'training' ? 'Training' : 'Research'}</span>
 <span>· ${escapeHtml(c.kindLabel)}</span>
 <span class="${isRead(c.id) ? '' : 'dot-unread'}">· ${isRead(c.id) ? 'Read' : 'Unread'}</span>
 </span>
 </button>
 `).join('') || '<p style="padding:1rem;color:rgba(255,255,255,0.45)">No cards match.</p>';
}

function jumpTo(id) {
 const card = CARDS.find(c => c.id === id);
 if (!card) return;
 state.mode = card.mode;
 syncTabsPill(true);
 const list = modeCards();
 const idx = list.findIndex(c => c.id === id);
 state.index = Math.max(0, idx);
 closeSheet();
 mountCard('next');
}

/* Events */
document.getElementById('markBtn').addEventListener('click', () => goNext(true));
document.getElementById('nextBtn').addEventListener('click', () => goNext(false));
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('tabTraining').addEventListener('click', () => setMode('training'));
document.getElementById('tabResearch').addEventListener('click', () => setMode('research'));
document.getElementById('openSheet').addEventListener('click', openSheet);
document.getElementById('closeSheet').addEventListener('click', closeSheet);
document.getElementById('backdrop').addEventListener('click', closeSheet);

document.getElementById('sheetFilters').addEventListener('click', (e) => {
 const btn = e.target.closest('button[data-filter]');
 if (!btn) return;
 state.drawerFilter = btn.dataset.filter;
 document.querySelectorAll('#sheetFilters button').forEach(b =>
 b.setAttribute('aria-pressed', b === btn ? 'true' : 'false')
 );
 renderSheet();
});
document.getElementById('sheetList').addEventListener('click', (e) => {
 const item = e.target.closest('[data-id]');
 if (item) jumpTo(item.dataset.id);
});

document.addEventListener('keydown', (e) => {
 if (e.target.matches('input, textarea, select')) return;
 if (e.key === 'ArrowRight') { e.preventDefault(); goNext(false); }
 else if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
 else if (e.key === 'Enter') { e.preventDefault(); goNext(true); }
 else if (e.key === 'Escape') closeSheet();
});

/* Optional swipe: left = next, right = prev */
const slot = document.getElementById('cardSlot');
slot.addEventListener('touchstart', (e) => {
 if (!e.touches[0]) return;
 state.touchStartX = e.touches[0].clientX;
 state.touchStartY = e.touches[0].clientY;
}, { passive: true });
slot.addEventListener('touchend', (e) => {
 if (state.touchStartX == null) return;
 const t = e.changedTouches[0];
 if (!t) return;
 const dx = t.clientX - state.touchStartX;
 const dy = t.clientY - state.touchStartY;
 state.touchStartX = null;
 state.touchStartY = null;
 if (Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
 if (dx < 0) goNext(false);
 else goPrev();
}, { passive: true });

window.addEventListener('resize', () => {
 syncTabsPill(false);
 const pane = document.querySelector('#cardSlot .card-pane');
 if (pane) setSlotHeight(pane);
});

loadRead();
requestAnimationFrame(() => {
 syncTabsPill(false);
 mountCard(null);
 updateChrome();
});
</script>
</body>
</html>
