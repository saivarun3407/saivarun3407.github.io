e finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.10611","sourceLabel":"Read the paper","date":"2026-09-11"},{"id":"res-2609.10594","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"Jailbreaking evaluators","headline":"Jailbreaking evaluators","body":"When automated attack-success-rate judges disagree with each other, evaluation itself becomes an attack surface and a source of false confidence in defenses. Secure evaluation pipelines need multiple judges, harness-outcome metrics, and human adjudication for high-severity cases. Ties to PatchBench-style metric inflation warnings and to red-team discipline that scores gates, not only model chatter. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.10594","sourceLabel":"Read the paper","date":"2026-09-11"},{"id":"res-2609.11024","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"The Missing Boundary","headline":"The Missing Boundary","body":"The Missing Boundary reports large loss-of-control rates when security context is degraded—on the order of mid-fifty to sixty percent in their settings—collapsing toward zero when boundaries are restored. That is empirical evidence that isolation beats prompt hope. Use it as a trust-boundary and CONTINUITY companion: measure control restoration in the harness, not only whether the model verbally agrees to behave.","url":"https://arxiv.org/abs/2609.11024","sourceLabel":"Read the paper","date":"2026-09-12"},{"id":"res-2609.11596","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"From Intent to Execution Grant","headline":"From Intent to Execution Grant","body":"This paper argues high-risk actions must bind intent to an execution grant at the sink—closing the gap between “the model meant well” and “the tool actually ran.” Implement capability tokens or signed grants checked by the tool runner before side effects. Strong architecture citation for least privilege and confirmation gates when agents plan in natural language but execute with real credentials.","url":"https://arxiv.org/abs/2609.11596","sourceLabel":"Read the paper","date":"2026-09-12"},{"id":"res-2609.11757","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"Whisper Attacks on AP2","headline":"Whisper Attacks on AP2","body":"Whisper attacks on AP2 show signed transactions paired with unsigned decisions steered by product text—integrity gaps between what is cryptographically signed and what the agent decided. Design protocols so decision context is covered by the same authenticity guarantees as the payment or action payload. Otherwise product copy becomes an injection path into high-value flows. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.11757","sourceLabel":"Read the paper","date":"2026-09-12"},{"id":"res-2609.11082","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"ToxicRAG","headline":"ToxicRAG","body":"ToxicRAG flips RAG answers with a single poisoned knowledge-update document, stressing how update pipelines—not only initial indexing—are attack paths. Control who can publish updates, review diffs, and monitor retrieval of newly published chunks. Core RAG-poisoning citation beside “In RAG We Trust?” for teams that continuously refresh enterprise knowledge bases. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.11082","sourceLabel":"Read the paper","date":"2026-09-12"},{"id":"res-2609.10854","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"No-Box MCP IPI","headline":"No-Box MCP IPI","body":"No-Box MCP IPI detects indirect prompt injection from MCP server descriptions alone—no tool execution required for the reconnaissance phase. Description fields are attacker-controlled strings in many registries and marketplaces. Scan and sanitize MCP descriptors before install; do not trust marketplace marketing text as safe context. Supply-chain hook for skills, plugins, and MCP training. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.10854","sourceLabel":"Read the paper","date":"2026-09-12"},{"id":"res-2609.15516","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"Misleading the Planner","headline":"Misleading the Planner","body":"Poisoned worker descriptions steer multi-agent planners even when individual workers seem sandboxed, because the planner trusts metadata cards. Planner trust in descriptions is a boundary that needs integrity checks. Authenticate worker cards, authorize planner tool use separately, and treat peer descriptions as untrusted input. Supports agent-to-agent trust-boundary training and A2ABreak themes. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.15516","sourceLabel":"Read the paper","date":"2026-09-15"},{"id":"res-2609.14987","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"ActGuard","headline":"ActGuard","body":"ActGuard audits tool calls for indirect prompt injection before execution—pre-execution policy as a gate rather than post-hoc regret. Fits queued follow-on training themes and confused-deputy controls: inspect arguments and trigger source, then allow, deny, or confirm. As paper-only work, validate latency, bypasses, and whether the auditor itself can be steered before you trust it in production.","url":"https://arxiv.org/abs/2609.14987","sourceLabel":"Read the paper","date":"2026-09-15"},{"id":"res-2609.14780","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"The Stochastic Deputy","headline":"The Stochastic Deputy","body":"The Stochastic Deputy frames tenant identifiers in MCP and tool arguments as a confused-deputy problem: probabilistic models plus ambient credentials equal cross-tenant risk when IDs are just another string in context. Enforce tenant binding in the tool runner with cryptographic or kernel-enforced isolation, not in prompt instructions the model can ignore. Queued with ActGuard for isolation-focused follow-on training.","url":"https://arxiv.org/abs/2609.14780","sourceLabel":"Read the paper","date":"2026-09-15"},{"id":"res-2609.14649","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"CIG-MIA","headline":"CIG-MIA","body":"CIG-MIA demonstrates strong membership inference against RAG systems—answers leak whether a private document was present even without an explicit tool call that dumps the file. Test your corpora with MI-style probes; minimize sensitive fields in chunks; consider access partitioning by tenant. Primary citation for membership-inference and RAG privacy leakage training. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.14649","sourceLabel":"Read the paper","date":"2026-09-15"},{"id":"res-2609.14079","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"SkillSecurer","headline":"SkillSecurer","body":"SkillSecurer scans and patches agent skill packages for prompt-injection content before install, acting as a supply-chain lint step for skill marketplaces. Useful hygiene, not a replacement for allowlists or human review of privileged skills. Combine with HookPry awareness of lifecycle hooks and least-privilege scoping of what each skill may invoke after install. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.14079","sourceLabel":"Read the paper","date":"2026-09-15"},{"id":"res-2609.13889","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"Persistent Memory Poisoning (PMPA)","headline":"Persistent Memory Poisoning (PMPA)","body":"PMPA shows malicious harness memory persisting across sessions, re-arming agents without a new user prompt or jailbreak string. Memory stores therefore need authorization on write, integrity checks, monitoring, and wipe procedures during incident response. Pair with MemSentry-style detection and with training that treats long-term notes as a writable trust boundary equal to tools. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.13889","sourceLabel":"Read the paper","date":"2026-09-15"},{"id":"res-2609.14685","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"ViTeGate","headline":"ViTeGate","body":"ViTeGate poisons image–text pairs in vision-language RAG, extending classic corpus attacks into multimodal retrieval where captions and images travel together. Vision-language RAG pipelines must treat captions and images as untrusted joint objects, not verified evidence. Include this in RAG poisoning and multimodal injection reviews for any product that retrieves screenshots, figures, or scanned pages. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.14685","sourceLabel":"Read the paper","date":"2026-09-15"},{"id":"res-2609.16098","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"Universal Defenses for tool agents","headline":"Universal Defenses for tool agents","body":"This paper studies universal defenses for tool agents combining tool filtering and original-toolset recall against direct and indirect prompt injection, memory attacks, and backdoors. It argues for defense portfolios rather than a single filter that claims to end the threat. Use it as a checklist against your least-privilege, memory, and confirm controls; validate every claim empirically on your own harness.","url":"https://arxiv.org/abs/2609.16098","sourceLabel":"Read the paper","date":"2026-09-16"},{"id":"res-2609.16193","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"Permutation stegomalware in LLM weights","headline":"Permutation stegomalware in LLM weights","body":"Permutation stegomalware hides payloads via weight permutation symmetry—supply-chain malware that may evade naive file hashes if permutations are normalized inconsistently across loaders. Pin exact artifacts, verify with robust fingerprints, and tightly control who can push weights into production. Adjacent to model supply-chain integrity training and to provenance ideas like PROSE. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.16193","sourceLabel":"Read the paper","date":"2026-09-16"},{"id":"res-2609.16681","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"MarkSec","headline":"MarkSec","body":"MarkSec evaluates watermark steal, scrub, and spoof attacks—important if you rely on watermarks for provenance of model outputs or RAG embeddings in compliance programs. Watermarks are contested controls with known failure modes. Know those modes before betting audit stories on them. Relates to Rent-a-RAG embedding watermarks and TrajMark trajectory watermarking themes. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.16681","sourceLabel":"Read the paper","date":"2026-09-16"},{"id":"res-2609.16694","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"Secure AI pentest agents","headline":"Secure AI pentest agents","body":"This paper offers a threat model and guardrails for offensive security agents used in penetration testing. Dual-use reading: useful for building safer internal red agents, dangerous if unconstrained on real networks. Apply sandboxing, scoped targets, egress deny-by-default, and human approval for exploit steps—the same harness lessons defender agents need, with even less room for ambient credentials.","url":"https://arxiv.org/abs/2609.16694","sourceLabel":"Read the paper","date":"2026-09-16"},{"id":"res-2609.16732","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"UI desynchronization in mobile agents","headline":"UI desynchronization in mobile agents","body":"UI desynchronization shows users and mobile agents can see different UI states at the same moment, enabling confusing or malicious taps the human did not intend to approve. Computer-use agents need consistent observation, confirms on irreversible actions, and warnings when UI state is uncertain or raced. Extends multimodal and UI injection risks beyond desktop browsers into mobile automation. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.16732","sourceLabel":"Read the paper","date":"2026-09-16"},{"id":"res-2609.16818","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"InceptionRAG","headline":"InceptionRAG","body":"InceptionRAG studies multi-document stealthy RAG poisoning that distributes the attack across chunks so single-document scanners miss the payload. Holistic corpus integrity, anomaly detection on retrieval sets, and strict writer controls become necessary. Advanced RAG-poisoning material for teams that already blocked naive one-doc Toxics and need the next layer of defense. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.16818","sourceLabel":"Read the paper","date":"2026-09-16"},{"id":"res-2609.16095","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"RAG-CT","headline":"RAG-CT","body":"RAG-CT demonstrates blunt retrieval-based PII extraction from RAG systems—another privacy failure mode beside membership inference, where answers reconstruct sensitive fields from chunks. Redact PII at index time, restrict retrieval scopes by role, and monitor exfiltration-shaped query patterns. Adjacent to membership-inference and RAG privacy leakage training for enterprise corpora. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.16095","sourceLabel":"Read the paper","date":"2026-09-16"},{"id":"res-openai-misalignment-reports-hub","mode":"research","day":null,"category":"Research","kind":"lab","kindLabel":"Lab / Incident","title":"OpenAI Misalignment Reports hub","headline":"OpenAI Misalignment Reports hub","body":"OpenAI’s misalignment reports hub collects cases such as Artifactory messaging, self-generated prompt injection, and leaked keys—primary lab narratives of how agents go wrong when tools and shared infra meet. Use it as a living bibliography for trust boundaries, egress, and residual secrets. Pairs with METR and OpenAI Hugging Face incident posts as the lab-primary story of eval and agent failures.","url":"https://alignment.openai.com/misalignment-reports/","sourceLabel":"Source","date":"2026-09-17"},{"id":"res-anthropic-claude-fable-mythos-5-1","mode":"research","day":null,"category":"Research","kind":"lab","kindLabel":"Lab / Incident","title":"Anthropic Claude Fable / Mythos 5.1","headline":"Anthropic Claude Fable / Mythos 5.1","body":"Anthropic’s Claude Fable / Mythos 5.1 announcement claims stronger agentic prompt-injection robustness and anti-distillation measures for frontier models. Treat it as lab product and security messaging: compare independent evaluations before you relax harness gates. Even the strongest claimed prompt-injection robustness does not retire allowlists, human confirms, or egress controls in production agents. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://www.anthropic.com/claude-fable-and-mythos-5-1","sourceLabel":"Source","date":"2026-09-17"},{"id":"res-2609.19140","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"AgentLSD","headline":"AgentLSD","body":"AgentLSD evaluates security agents under adversarial task contamination—showing defender automation can be misled by poisoned tasks just like general assistants. SOC and security-ops agents need the same indirect-injection and tool-scoping discipline as any other tool caller. Reminds teams that “defender” branding is not a trust boundary and does not justify god-mode credentials. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.19140","sourceLabel":"Read the paper","date":"2026-09-17"},{"id":"res-2609.18217","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"Implicit trust in tool-calling / MCP","headline":"Implicit trust in tool-calling / MCP","body":"This paper highlights implicit trust in tool-calling and MCP stacks: one shared context window and weak privilege separation between tools, prompts, and retrieved text. Architect explicit identity per tool, scoped tokens, and context firewalls that do not pour every string into the same bucket. Foundational reading for confused-deputy, skills/MCP supply-chain, and agent-to-agent training days.","url":"https://arxiv.org/abs/2609.18217","sourceLabel":"Read the paper","date":"2026-09-17"},{"id":"res-2609.17817","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"Trusting Trust revisited","headline":"Trusting Trust revisited","body":"Revisiting Thompson’s classic “Trusting Trust,” this work shows poisoned benchmarks can contaminate coding agents—evaluation supply chain as an attack path that quietly trains bad behavior into agents. Pin benchmarks, verify provenance, and distrust leaderboard gains without artifact integrity. Aligns with model and training-data supply-chain integrity practices when agents learn from eval suites. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.17817","sourceLabel":"Read the paper","date":"2026-09-17"},{"id":"res-2609.19100","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"Remote MCP observability","headline":"Remote MCP observability","body":"Remote MCP over streamable HTTP is framed as enterprise attack surface that needs observability—authentication, tenancy, and anomaly detection on JSON-RPC tool traffic the same way you watch API gateways. If MCP is your tool bus, SIEM it: who called which tool with which args for which tenant. Operational hook for monitoring and for skills/MCP supply-chain reviews.","url":"https://arxiv.org/abs/2609.19100","sourceLabel":"Read the paper","date":"2026-09-17"},{"id":"res-2609.19091","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"MCP NIDS evasion","headline":"MCP NIDS evasion","body":"MCP JSON-RPC traffic can resemble beaconing to network intrusion detection systems, causing blind spots or alert fatigue that attackers may abuse. Security teams must teach detections about legitimate agent protocols while still catching abuse patterns and anomalous destinations. Pair with remote MCP observability research when you design detection engineering for agent platforms. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.19091","sourceLabel":"Read the paper","date":"2026-09-17"},{"id":"res-2609.18526","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"Illusion of Local Privacy","headline":"Illusion of Local Privacy","body":"Local LLM serving still leaks prompts at software boundaries—GPU stacks, logs, debuggers, crash dumps, and side channels—so “air-gapped model” is not automatic privacy. Inventory every boundary where prompts or KV state appear on disk or on the wire inside the box. Apply the same data-handling rules you would for cloud APIs, including retention limits and access control on local logs.","url":"https://arxiv.org/abs/2609.18526","sourceLabel":"Read the paper","date":"2026-09-17"},{"id":"res-2609.18674","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"CaMeLoT","headline":"CaMeLoT","body":"CaMeLoT applies temporal-logic checks to multi-step tool-agent plans, catching policy violations across sequences rather than only on a single tool call. That direction complements pre-execution auditors that look at one call in isolation. As paper-only work, integrate carefully into your planner or runner and measure bypasses when plans are rewritten mid-flight by injected context.","url":"https://arxiv.org/abs/2609.18674","sourceLabel":"Read the paper","date":"2026-09-17"},{"id":"res-2609.18411","mode":"research","day":null,"category":"Research","kind":"paper","kindLabel":"Paper only","title":"Verifiable Action Card","headline":"Verifiable Action Card","body":"Verifiable Action Cards aim for unspoofable human-in-the-loop approvals for agentic browsers—binding what the human actually saw to what the agent may execute next. That directly supports confirmation-gate training and fights authority theater where models invent checks they also grade. Prefer cryptographic or UI-bound approvals over prompt text that says “user confirmed.”. Map the finding to one concrete harness control—allowlist, confirm, egress rule, memory wipe, or log field—before you brief stakeholders or change production policy.","url":"https://arxiv.org/abs/2609.18411","sourceLabel":"Read the paper","date":"2026-09-17"}];

const state = {
  mode: 'training',
  index: 0,
  read: {},
  animating: false,
  drawerFilter: 'all',
  touchStartY: null,
  touchStartX: null,
  reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
};

function loadRead() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    state.read = raw ? JSON.parse(raw) : {};
    if (typeof state.read !== 'object' || Array.isArray(state.read)) state.read = {};
  } catch (e) {
    state.read = {};
  }
}
function saveRead() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.read));
}
function isRead(id) { return !!(state.read[id] && state.read[id].readAt); }
function markRead(id) {
  if (!isRead(id)) {
    state.read[id] = { readAt: new Date().toISOString() };
    saveRead();
    return true;
  }
  return false;
}

/** Mode order preserved as in CARDS (backup behavior — no unread re-sort). */
function modeCards() {
  return CARDS.filter(c => c.mode === state.mode);
}

function counts() {
  const train = CARDS.filter(c => c.mode === 'training');
  const res = CARDS.filter(c => c.mode === 'research');
  const readN = CARDS.filter(c => isRead(c.id)).length;
  return {
    train: train.length,
    res: res.length,
    trainRead: train.filter(c => isRead(c.id)).length,
    resRead: res.filter(c => isRead(c.id)).length,
    total: CARDS.length,
    readN,
  };
}

function kindChipClass(kind) {
  if (kind === 'lab') return 'chip-lab';
  if (kind === 'practice') return 'chip-practice';
  return 'chip-paper';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function hostOf(url) {
  try { return new URL(url).host; } catch (e) {
    return String(url).replace(/^https?:\/\//, '').split('/')[0];
  }
}

function renderCard(card, enterClass) {
  const el = document.createElement('article');
  el.className = 'card' + (enterClass ? ' ' + enterClass : '');
  el.dataset.id = card.id;
  el.setAttribute('aria-label', card.title);

  const catClass = card.mode === 'training' ? 'chip-cat-train' : 'chip-cat-res';
  const catLabel = card.mode === 'training' ? 'Aitr' : 'Research';
  const read = isRead(card.id);
  const linkText = card.sourceLabel === 'Read the paper' ? 'Read the paper ↗' : 'Open primary source ↗';

  el.innerHTML = `
    <div class="chips">
      <span class="chip ${catClass}">${catLabel}</span>
      <span class="chip ${kindChipClass(card.kind)}">${escapeHtml(card.kindLabel)}</span>
      <span class="chip ${read ? 'chip-read' : 'chip-unread'}">${read ? 'Read' : 'Unread'}</span>
      ${card.date ? `<span class="chip chip-date">${escapeHtml(card.date)}</span>` : ''}
    </div>
    <h2>${escapeHtml(card.headline || card.title)}</h2>
    <p class="body">${escapeHtml(card.body)}</p>
    <div class="source">
      <span class="label">${escapeHtml(card.sourceLabel || 'Source')}</span>
      <a href="${escapeAttr(card.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(linkText)}</a>
      <span class="host">${escapeHtml(hostOf(card.url))}</span>
    </div>
  `;
  return el;
}

function updateChrome() {
  const list = modeCards();
  const c = counts();
  document.getElementById('trainCount').textContent = String(c.train);
  document.getElementById('resCount').textContent = String(c.res);
  document.getElementById('progressText').textContent = `${c.readN} of ${c.total} read`;
  const pct = c.total ? (c.readN / c.total) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('posText').textContent =
    `${state.mode === 'training' ? 'Training' : 'Research'} · ${list.length ? state.index + 1 : 0} of ${list.length}` +
    (list[state.index] ? (isRead(list[state.index].id) ? ' · Read' : ' · Unread') : '');
  document.getElementById('live').textContent =
    `Progress ${c.readN} of ${c.total} read. Showing card ${state.index + 1} of ${list.length} in ${state.mode}.`;
  document.getElementById('prevBtn').disabled = state.index <= 0 || state.animating;
  document.getElementById('markBtn').disabled = state.animating || list.length === 0;
  document.getElementById('nextBtn').disabled = state.animating || state.index >= list.length - 1 || list.length === 0;
  document.getElementById('modeTabs').dataset.mode = state.mode;
  document.getElementById('tabTraining').classList.toggle('active', state.mode === 'training');
  document.getElementById('tabResearch').classList.toggle('active', state.mode === 'research');
  document.getElementById('tabTraining').setAttribute('aria-selected', state.mode === 'training' ? 'true' : 'false');
  document.getElementById('tabResearch').setAttribute('aria-selected', state.mode === 'research' ? 'true' : 'false');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 1500);
}

function burstMarkBtn() {
  const btn = document.getElementById('markBtn');
  btn.classList.remove('burst');
  void btn.offsetWidth;
  btn.classList.add('burst');
  setTimeout(() => btn.classList.remove('burst'), 600);
}

function mountCard(direction) {
  const list = modeCards();
  if (!list.length) return;
  if (state.index < 0) state.index = 0;
  if (state.index >= list.length) state.index = list.length - 1;
  const card = list[state.index];
  const viewport = document.getElementById('viewport');
  const skeleton = document.getElementById('skeleton');
  if (skeleton) skeleton.remove();

  const prev = viewport.querySelector('.card:not(.skeleton)');
  let enterClass = '';
  if (!state.reducedMotion) {
    if (direction === 'next') enterClass = 'enter-next';
    else if (direction === 'prev') enterClass = 'enter-prev';
    else if (direction === 'mode') enterClass = 'enter-fade';
  }

  const nextEl = renderCard(card, enterClass);

  if (prev && direction && !state.reducedMotion) {
    state.animating = true;
    prev.classList.remove('enter-next', 'enter-prev', 'enter-fade');
    prev.classList.add(direction === 'prev' ? 'exit-prev' : 'exit-next');
    viewport.appendChild(nextEl);
    let settled = false;
    const done = () => {
      if (settled) return;
      settled = true;
      prev.remove();
      state.animating = false;
      updateChrome();
    };
    prev.addEventListener('animationend', done, { once: true });
    setTimeout(done, 450);
  } else {
    viewport.innerHTML = '';
    viewport.appendChild(nextEl);
  }
  updateChrome();
}

function goNext(mark) {
  if (state.animating) return;
  const list = modeCards();
  const cur = list[state.index];
  if (!cur) return;
  if (mark) {
    const newly = markRead(cur.id);
    if (newly) {
      showToast('Marked read');
      burstMarkBtn();
    } else {
      showToast('Already read');
    }
  }
  if (state.index < list.length - 1) {
    state.index += 1;
    mountCard('next');
  } else {
    mountCard(null);
    if (mark) showToast(isRead(cur.id) ? 'Marked read · end of list' : 'End of list');
  }
}

function goPrev() {
  if (state.animating || state.index <= 0) return;
  state.index -= 1;
  mountCard('prev');
}

function setMode(mode) {
  if (mode === state.mode) return;
  state.mode = mode;
  state.index = 0;
  mountCard('mode');
}

function openDrawer() {
  const backdrop = document.getElementById('backdrop');
  const drawer = document.getElementById('drawer');
  backdrop.hidden = false;
  drawer.hidden = false;
  requestAnimationFrame(() => {
    backdrop.classList.add('open');
    drawer.classList.add('open');
  });
  renderDrawer();
  document.getElementById('closeDrawer').focus();
}
function closeDrawer() {
  const backdrop = document.getElementById('backdrop');
  const drawer = document.getElementById('drawer');
  backdrop.classList.remove('open');
  drawer.classList.remove('open');
  setTimeout(() => {
    backdrop.hidden = true;
    drawer.hidden = true;
  }, state.reducedMotion ? 0 : 320);
}

function renderDrawer() {
  const c = counts();
  document.getElementById('drawerStats').innerHTML = `
    <div class="stat"><div class="n">${c.trainRead}/${c.train}</div><div class="l">Training read</div></div>
    <div class="stat"><div class="n">${c.resRead}/${c.res}</div><div class="l">Research read</div></div>
  `;
  const list = document.getElementById('drawerList');
  const f = state.drawerFilter;
  let items = CARDS.slice();
  if (f === 'unread') items = items.filter(c => !isRead(c.id));
  else if (f === 'read') items = items.filter(c => isRead(c.id));
  else if (f === 'training') items = items.filter(c => c.mode === 'training');
  else if (f === 'research') items = items.filter(c => c.mode === 'research');
  else if (f === 'lab' || f === 'practice' || f === 'paper') items = items.filter(c => c.kind === f);

  const cur = modeCards()[state.index];
  const curId = cur ? cur.id : null;

  list.innerHTML = items.map(card => `
    <button type="button" class="drawer-item${card.id === curId ? ' is-current' : ''}" data-id="${escapeAttr(card.id)}">
      <span class="t">${escapeHtml(card.title)}</span>
      <span class="m">
        <span>${card.mode === 'training' ? 'Training' : 'Research'}</span>
        <span>· ${escapeHtml(card.kindLabel)}</span>
        <span class="${isRead(card.id) ? 'read-dot' : 'unread-dot'}">· ${isRead(card.id) ? 'Read' : 'Unread'}</span>
      </span>
    </button>
  `).join('') || '<p style="padding:1rem;color:var(--muted)">No cards match.</p>';
}

function jumpTo(id) {
  const card = CARDS.find(c => c.id === id);
  if (!card) return;
  state.mode = card.mode;
  const list = modeCards();
  const idx = list.findIndex(c => c.id === id);
  state.index = Math.max(0, idx);
  closeDrawer();
  mountCard('mode');
}

document.getElementById('markBtn').addEventListener('click', () => goNext(true));
document.getElementById('nextBtn').addEventListener('click', () => goNext(false));
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('tabTraining').addEventListener('click', () => setMode('training'));
document.getElementById('tabResearch').addEventListener('click', () => setMode('research'));
document.getElementById('progressBtn').addEventListener('click', openDrawer);
document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
document.getElementById('backdrop').addEventListener('click', closeDrawer);

document.getElementById('drawerFilters').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-filter]');
  if (!btn) return;
  state.drawerFilter = btn.dataset.filter;
  document.querySelectorAll('#drawerFilters button').forEach(b => b.classList.toggle('active', b === btn));
  renderDrawer();
});
document.getElementById('drawerList').addEventListener('click', (e) => {
  const item = e.target.closest('[data-id]');
  if (item) jumpTo(item.dataset.id);
});

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, select, a')) return;
  const drawerOpen = document.getElementById('drawer').classList.contains('open');
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (drawerOpen) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); goNext(false); }
  else if (e.key === 'Enter' || e.key.toLowerCase() === 'm') { e.preventDefault(); goNext(true); }
  else if (e.key.toLowerCase() === 't') { e.preventDefault(); setMode('training'); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); setMode('research'); }
  else if (e.key.toLowerCase() === 'j' || e.key.toLowerCase() === 'n' || e.key === 'ArrowDown') { e.preventDefault(); goNext(true); }
  else if (e.key.toLowerCase() === 'k' || e.key.toLowerCase() === 'p' || e.key === 'ArrowUp') { e.preventDefault(); goPrev(); }
});

const viewport = document.getElementById('viewport');
const SWIPE_THRESH = 56;
viewport.addEventListener('touchstart', (e) => {
  if (!e.touches[0]) return;
  state.touchStartY = e.touches[0].clientY;
  state.touchStartX = e.touches[0].clientX;
}, { passive: true });
viewport.addEventListener('touchend', (e) => {
  if (state.touchStartX == null) return;
  const t = e.changedTouches[0];
  if (!t) return;
  const dy = t.clientY - state.touchStartY;
  const dx = t.clientX - state.touchStartX;
  state.touchStartY = null;
  state.touchStartX = null;
  // Prefer horizontal swipe for next/prev
  if (Math.abs(dx) >= SWIPE_THRESH && Math.abs(dx) > Math.abs(dy) * 1.15) {
    if (dx < 0) goNext(false);
    else goPrev();
    return;
  }
  // Vertical fallback (compat with prior habit): up = mark+next, down = prev
  if (Math.abs(dy) >= SWIPE_THRESH && Math.abs(dy) > Math.abs(dx) * 1.2) {
    if (dy < 0) goNext(true);
    else goPrev();
  }
}, { passive: true });

window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', (e) => {
  state.reducedMotion = e.matches;
});

loadRead();
updateChrome();
setTimeout(() => { mountCard(null); }, state.reducedMotion ? 0 : 220);
</script>
</body>
</html>
