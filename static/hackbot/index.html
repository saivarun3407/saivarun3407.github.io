  "headline": "Search from the goal, not from the bug list",
  "body": "ChainAgent builds on a study of 386 real-world web exploit chains. It describes vulnerabilities and 'functional gadgets' (intended behaviours that can be repurposed) by what they need and what they give. An evolving exploit graph decides what code to read next: backward from unmet needs to find what supplies them, and forward from abilities already found to find what uses them. On 15 PHP apps across three LLM backends it reached 42.02%-44.63% recall for goal-reaching components and recovered up to 4.4 times as many correct goal-reaching dependency edges as Codex. On 30 real-world PHP apps it found 20 vulnerabilities and 13 exploit chains, nine of them reaching remote code execution. This is a preprint.",

  "headline": "Same model, different harness: Snyk's vendor benchmark",
  "body": "Snyk's team compared its experimental Evo Code Scanning Agent harness with Claude Security and Codex Security, giving each pair the same off-the-shelf model and the same compute budget. On 14 applications, scored against 1,426 known vulnerabilities, Evo found 57% versus 32% against Claude Security, and 66% versus 43% against Codex Security. The lab tools were more precise: 94% versus 65% on the Claude pair and 97.5% versus 90% on the Codex pair. Each lab tool still found vulnerabilities Evo missed (111 and 84). A general coding agent with one prompt found 13%, but that comparison changes both model and harness. Caveats: it is Snyk's own internal benchmark. The answer key includes vulnerabilities confirmed from any scanner's findings, and AI reviewers labelled the findings with no human review. Snyk calls the results early.",

  "headline": "Planner vs monolith: escalation mattered more than architecture",
  "body": "Amir Amine and Samer Saab Jr. describe a planner-directed system in which a persistent planner never runs commands itself and delegates on demand to short-lived, isolated specialists. On all 200 NYU CTF Bench test challenges, it got 41 accepted flags (20.5%) and 29 leak-audited genuine solves (14.5%), against 4 and 3 for a stateful single-agent baseline. Both started from the same smaller model, but only the planner could escalate to a stronger one, which it did on 199 of 200 challenges. In a budget-matched test on a pre-registered 80-challenge subset, run in two formal passes, escalating to the stronger model had a strong effect and the architecture itself had no main effect; there was also a significant interaction. Under a 340-action ceiling, the coordination cost of delegation cancelled out any planner advantage. These figures are from the abstract: the paper is open access, but the publisher's site returned a bot-check page and the body could not be retrieved.",

  "headline": "A passing proof is not always the intended bug",
  "body": "Yule Ding and Hongzhen Wu audit all 1,507 CyberGym tasks. CyberGym treats a proof-of-concept as a pass when it crashes a vulnerable program version but not a fixed version. After a stratified blind review that corrected two labels, the authors assign inconsistency labels to 338 tasks (22.4%), mainly coverage inconsistencies (205) and descriptions and patches that jointly point to another defect (110); they call these audit outcomes, not an independently certified count. They also assessed the final proofs from one complete Level-1 GLM-5.3 run. Of 1,286 differential passes, they assign 89 non-target and 10 insufficient-evidence verdicts, which lowers the pass rate from 85.3% to 78.8%. Non-target verdicts also appear in 39 of 1,052 passes (3.7%) on tasks where the material audit found no inconsistency. The identity verdicts have no independent human validation, and the results are from one model and one run. This is a preprint.",

  "headline": "A passing exploit still needs an independent effect check",
  "body": "Aditya Oke and colleagues at Carnegie Mellon University present Ulysses, a harness that turns scanner, model or advisory findings into proofs of exploitability. A planner builds a hypothesis graph in which each node receives only the context on its incoming edges; the graph is rebuilt each round from the findings so far and a reflection step. An independent effect oracle, which the agent cannot see into, checks success against planted ground truth such as seeded files, database rows, runtime secrets and listeners, across eight effect types. On WebExploitGym, 25 real web apps in five languages and seven frameworks, Ulysses verified 10 of 25 advisories when it was given advisory-informed localization, including working proofs for four advisories that had none before. Without that localization it verified 4 of 25. This is a preprint.",

  "headline": "Grade the exploitation process, not just the flag",
  "body": "POMA, from Wuhan University and colleagues, evaluates base LLMs on exploitation under one fixed baseline: the same task inputs, tool interfaces, targets, feedback format and budget, so the model's own capability is not mixed up with the scaffold's. It measures intermediate states and transitions from runtime evidence. It tested four frontier base models (DeepSeek-v4-flash-0423, Qwen-3.6-plus, GPT-5.5 and Sonnet 5) on 55 CTF Pwn challenges and 10 real-world reproduction tasks, and reports that capability dropped at each step: from vulnerability knowledge to working code, from client-side actions to a verified target state, from locating a failure to a precise fix, and across later revisions. The catalogs, process-measurement evaluator and a sample harness are public (github.com/maple-pwn/poma-release).",

  "body": "Dan Jones, Alexandra Godoi and Grant Bourzikas describe how Cloudflare turned a one-off security-audit skill, first run on a single repository, into a continuous scanning pipeline across a fleet of repositories. This is a vendor post about Cloudflare's own work. Models are treated as interchangeable: one model does discovery (the vulnerability discovery harness) and a different model does validation (the vulnerability validation system), so findings are cross-checked by a second set of weights rather than graded by the model that found them. The authors say relying on a single model limits coverage, and that a fleet harness also has to trace dependencies across repositories, not just scan each repo in isolation. Cloudflare writes that going from the first skill to a fleet scanner covering 128 repositories took about six weeks.",

  "body": "Zachary Rossmiller's post is mainly a write-up on quantizing and serving a 4-bit build of Cantina's apex-flash-1 security model; the title's \"four sparks\" refers to the DGX Spark hardware he served it on, not to a fourth harness. He also checked whether the security training survived quantization and whether the harness mattered. He ran 40 Cybench tasks, three attempts each, through three harnesses: Codex, a minimal Pi harness, and OpenCode. Apex solved 78, 81 and 77 of 120 attempts against the base model's 76, 77 and 79. Pooled, that is 236 vs 232 of 360, +1.1 points (95% CI −3.6 to +5.6, from 10,000 task-level resamples). His logic: if a model leads under its training harness but not under a minimal one, the lead comes from knowing the harness rather than from security skill. No harness separated the two models.",

  "body": "Alessio Dalla Piazza and Giorgio Roffo describe how Equixly ranks which specialist attack agents should run on each endpoint. This is a vendor post about Equixly's own scanner. Instead of running every specialist on every operation, one small model per CWE reads the endpoint's specification and scores the weakness classes; a specialist's score is the highest probability among its CWEs. A cheap, fast LLM then gives a second opinion and adds back specialists the model dropped. Equixly says that on a full scan of a deliberately vulnerable application, this cut agent runs by 39% and tokens by 40%, and found the same vulnerabilities. They also report that the model alone, without the second opinion, kept fewer of the known cases at the same attack strength.",

const state = {
 mode: 'research',
 index: 0,
 read: {},
 animating: false,
 drawerFilter: 'all',
 levelFilter: 'all',
 topicFilter: 'all',
 touchStartX: null,
 touchStartY: null,
};

function loadRead() {
 try {
 const raw = localStorage.getItem(STORAGE_KEY);
 state.read = raw ? JSON.parse(raw) : {};
 if (typeof state.read !== 'object' || state.read === null || Array.isArray(state.read)) state.read = {};
 } catch (e) {
 state.read = {};
 }
}
function saveRead() {
 localStorage.setItem(STORAGE_KEY, JSON.stringify(state.read));
}
function isRead(id) {
 return !!(state.read[id] && state.read[id].readAt);
}
function markRead(id) {
 if (!isRead(id)) {
 state.read[id] = { readAt: new Date().toISOString() };
 saveRead();
 return true;
 }
 return false;
}

/** Unread-first within mode; stable relative order from CARDS. */
function modeCards() {
 let list = CARDS.slice();
 if (state.levelFilter && state.levelFilter !== 'all') list = list.filter(c => c.level === state.levelFilter);
 if (state.topicFilter && state.topicFilter !== 'all') list = list.filter(c => c.topic === state.topicFilter);
 const unread = list.filter(c => !isRead(c.id));
 const read = list.filter(c => isRead(c.id));
 return unread.concat(read);
}

function counts() {
 const visible = modeCards();
 return {
 train: 0,
 res: CARDS.length,
 trainRead: 0,
 resRead: CARDS.filter(c => isRead(c.id)).length,
 total: CARDS.length,
 readN: CARDS.filter(c => isRead(c.id)).length,
 visible: visible.length,
 visibleRead: visible.filter(c => isRead(c.id)).length,
 };
}

function escapeHtml(s) {
 return String(s).replace(/[&<>"']/g, c => ({
 '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
 }[c]));
}
function escapeAttr(s) {
 return escapeHtml(s).replace(/`/g, '&#96;');
}

function levelChipClass(level) {
 if (level === 'Basic') return 'chip-level-basic';
 if (level === 'Intermediate') return 'chip-level-intermediate';
 return 'chip-level-advanced';
}

function buildCardHTML(card) {
 const read = isRead(card.id);
 const citeLabel = card.sourceLabel || 'Source';
 const linkText = 'Open primary source ↗';
 return `
 <article class="card" data-id="${escapeAttr(card.id)}" aria-label="${escapeAttr(card.title)}">
 <div class="chips">
 <span class="chip ${levelChipClass(card.level)}">${escapeHtml(card.level)}</span>
 <span class="chip">${escapeHtml(card.topic)}</span>
 <span class="chip ${read ? 'chip-read' : 'chip-unread'}">${read ? 'Read' : 'Unread'}</span>
 ${card.date ? `<span class="chip">${escapeHtml(card.date)}</span>` : ''}
 </div>
 <div class="t-stagger" data-stagger>
 <h2 class="headline t-stagger-line t-stagger-line--1">${escapeHtml(card.headline || card.title)}</h2>
 <p class="lede t-stagger-line t-stagger-line--2">${escapeHtml(card.body)}</p>
 <div class="steal t-stagger-line t-stagger-line--3">
 <span class="steal-label">What to steal for our hackbot</span>
 <p>${escapeHtml(card.steal)}</p>
 </div>
 </div>
 <div class="cite">
 <span class="cite-label">${escapeHtml(citeLabel)}</span>
 <a href="${escapeAttr(card.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(linkText)}</a>
 </div>
 </article>
 `;
}

function syncTabsPill(animate) {
 return; // no mode tabs on /hackbot
}

function updateChrome() {
 const list = modeCards();
 const c = counts();
 const modeRead = c.visibleRead;
 const modeTotal = c.visible || c.total;
 document.getElementById('metricRead').textContent = String(modeRead);
 document.getElementById('metricRest').textContent =
 `/ ${modeTotal} cards`;

 const markBtn = document.getElementById('markBtn');
 const cur = list[state.index];
 if (cur && isRead(cur.id)) {
 markBtn.textContent = 'Already read';
 markBtn.disabled = true;
 } else {
 markBtn.innerHTML = `<span class="btn-check" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 48 48" fill="none"><path d="M10 24.5L20 34.5L38 14" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span> Mark as read`;
 markBtn.disabled = state.animating || !cur;
 }
 document.getElementById('prevBtn').disabled = state.animating || state.index <= 0;
 document.getElementById('nextBtn').disabled = state.animating || !cur || state.index >= list.length - 1;


 document.getElementById('live').textContent =
 `${modeRead} of ${modeTotal} ${state.mode} read. Showing card ${state.index + 1} of ${list.length}.`;
}

function setSlotHeight(el) {
 const slot = document.getElementById('cardSlot');
 if (!el) { slot.style.height = 'auto'; return; }
 const h = el.offsetHeight;
 slot.style.height = h + 'px';
}

function revealStagger(root) {
 const block = root.querySelector('[data-stagger]');
 if (!block) return;
 block.classList.remove('is-hiding', 'is-shown');
 void block.offsetHeight;
 block.classList.add('is-shown');
}

function showToast(msg) {
 const t = document.getElementById('toast');
 const check = document.getElementById('toastCheck');
 document.getElementById('toastText').textContent = msg;
 check.setAttribute('data-state', 'out');
 void check.offsetWidth;
 check.setAttribute('data-state', 'in');
 t.classList.add('is-open');
 clearTimeout(showToast._timer);
 showToast._timer = setTimeout(() => {
 t.classList.remove('is-open');
 setTimeout(() => check.setAttribute('data-state', 'out'), 280);
 }, 1600);
}

function mountCard(direction) {
 const list = modeCards();
 if (!list.length) return;
 if (state.index < 0) state.index = 0;
 if (state.index >= list.length) state.index = list.length - 1;
 const card = list[state.index];
 const slot = document.getElementById('cardSlot');

 const pane = document.createElement('div');
 pane.className = 'card-pane';
 pane.innerHTML = buildCardHTML(card);

 const prev = slot.querySelector('.card-pane:not(.is-exit-next):not(.is-exit-prev)');

 if (prev && direction) {
 state.animating = true;
 updateChrome();
 const exitClass = direction === 'prev' ? 'is-exit-prev' : 'is-exit-next';
 const enterClass = direction === 'prev' ? 'is-enter-prev' : 'is-enter-next';
 prev.classList.add(exitClass);
 pane.classList.add(enterClass);
 slot.appendChild(pane);

 // Measure incoming content for height morph
 requestAnimationFrame(() => {
 setSlotHeight(pane);
 revealStagger(pane);
 });

 const done = () => {
 prev.remove();
 pane.classList.remove(enterClass);
 state.animating = false;
 updateChrome();
 setSlotHeight(pane);
 };
 prev.addEventListener('animationend', done, { once: true });
 setTimeout(done, 320);
 } else {
 slot.innerHTML = '';
 slot.appendChild(pane);
 // First paint: set height without fighting layout
 slot.style.height = 'auto';
 requestAnimationFrame(() => {
 setSlotHeight(pane);
 revealStagger(pane);
 });
 updateChrome();
 }
}

function goNext(mark) {
 if (state.animating) return;
 const list = modeCards();
 const cur = list[state.index];
 if (!cur) return;

 // Enter / Mark on an already-read card just advances (no toast)
 if (mark && isRead(cur.id)) {
 if (state.index < list.length - 1) {
 state.index += 1;
 mountCard('next');
 }
 return;
 }

 if (mark) {
 const newly = markRead(cur.id);
 if (newly) showToast('Marked read');
 const nextList = modeCards();
 // Current card just moved into the read section; land on first unread
 const nextUnread = nextList.findIndex(c => !isRead(c.id));
 if (nextUnread >= 0) {
 state.index = nextUnread;
 mountCard('next');
 } else {
 state.index = Math.max(0, nextList.length - 1);
 mountCard(null);
 if (newly) showToast('Marked read · end of list');
 }
 return;
 }

 if (state.index < list.length - 1) {
 state.index += 1;
 mountCard('next');
 }
}

function goPrev() {
 if (state.animating || state.index <= 0) return;
 state.index -= 1;
 mountCard('prev');
}

function setMode(mode) {
 if (mode === state.mode) return;
 state.mode = mode;
 state.index = 0;
 syncTabsPill(true);
 mountCard('next');
}

function openSheet() {
 const backdrop = document.getElementById('backdrop');
 const sheet = document.getElementById('sheet');
 backdrop.hidden = false;
 sheet.hidden = false;
 requestAnimationFrame(() => {
 backdrop.classList.add('open');
 sheet.classList.add('open');
 });
 renderSheet();
}
function closeSheet() {
 const backdrop = document.getElementById('backdrop');
 const sheet = document.getElementById('sheet');
 backdrop.classList.remove('open');
 sheet.classList.remove('open');
 setTimeout(() => {
 backdrop.hidden = true;
 sheet.hidden = true;
 }, 300);
}

function renderSheet() {
 const list = document.getElementById('sheetList');
 const f = state.drawerFilter;
 let items = CARDS.slice();
 if (f === 'unread') items = items.filter(c => !isRead(c.id));
 else if (f === 'read') items = items.filter(c => isRead(c.id));
 else if (f === 'Basic' || f === 'Intermediate' || f === 'Advanced') items = items.filter(c => c.level === f);

 const cur = modeCards()[state.index];
 list.innerHTML = items.map(c => `
 <button type="button" class="sheet-item${cur && cur.id === c.id ? ' is-current' : ''}" data-id="${escapeAttr(c.id)}">
 <span class="t">${escapeHtml(c.title)}</span>
 <span class="m">
 <span>${escapeHtml(c.level)}</span>
 <span>· ${escapeHtml(c.topic)}</span>
 <span class="${isRead(c.id) ? '' : 'dot-unread'}">· ${isRead(c.id) ? 'Read' : 'Unread'}</span>
 </span>
 </button>
 `).join('') || '<p style="padding:1rem;color:rgba(255,255,255,0.45)">No cards match.</p>';
}

function jumpTo(id) {
 const card = CARDS.find(c => c.id === id);
 if (!card) return;
 state.mode = card.mode;
 syncTabsPill(true);
 const list = modeCards();
 const idx = list.findIndex(c => c.id === id);
 state.index = Math.max(0, idx);
 closeSheet();
 mountCard('next');
}

/* Events */
document.getElementById('markBtn').addEventListener('click', () => goNext(true));
document.getElementById('nextBtn').addEventListener('click', () => goNext(false));
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('tabTraining')?.addEventListener('click', () => setMode('training'));
document.getElementById('tabResearch')?.addEventListener('click', () => setMode('research'));
document.getElementById('openSheet').addEventListener('click', openSheet);
document.getElementById('closeSheet').addEventListener('click', closeSheet);
document.getElementById('backdrop').addEventListener('click', closeSheet);

document.getElementById('sheetFilters').addEventListener('click', (e) => {
 const btn = e.target.closest('button[data-filter]');
 if (!btn) return;
 state.drawerFilter = btn.dataset.filter;
 document.querySelectorAll('#sheetFilters button').forEach(b =>
 b.setAttribute('aria-pressed', b === btn ? 'true' : 'false')
 );
 renderSheet();
});
document.getElementById('sheetList').addEventListener('click', (e) => {
 const item = e.target.closest('[data-id]');
 if (item) jumpTo(item.dataset.id);
});

document.addEventListener('keydown', (e) => {
 if (e.target.matches('input, textarea, select')) return;
 if (e.key === 'ArrowRight') { e.preventDefault(); goNext(false); }
 else if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
 else if (e.key === 'Enter') { e.preventDefault(); goNext(true); }
 else if (e.key === 'Escape') closeSheet();
});

/* Optional swipe: left = next, right = prev */
const slot = document.getElementById('cardSlot');
slot.addEventListener('touchstart', (e) => {
 if (!e.touches[0]) return;
 state.touchStartX = e.touches[0].clientX;
 state.touchStartY = e.touches[0].clientY;
}, { passive: true });
slot.addEventListener('touchend', (e) => {
 if (state.touchStartX == null) return;
 const t = e.changedTouches[0];
 if (!t) return;
 const dx = t.clientX - state.touchStartX;
 const dy = t.clientY - state.touchStartY;
 state.touchStartX = null;
 state.touchStartY = null;
 if (Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
 if (dx < 0) goNext(false);
 else goPrev();
}, { passive: true });

window.addEventListener('resize', () => {
 syncTabsPill(false);
 const pane = document.querySelector('#cardSlot .card-pane');
 if (pane) setSlotHeight(pane);
});

loadRead();

document.getElementById('filterBar').addEventListener('click', (e) => {
 const btn = e.target.closest('.filter-chip');
 if (!btn) return;
 if (btn.dataset.level) {
  state.levelFilter = btn.dataset.level;
  document.querySelectorAll('#filterBar [data-level]').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
 }
 if (btn.dataset.topic) {
  state.topicFilter = btn.dataset.topic;
  document.querySelectorAll('#filterBar [data-topic]').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
 }
 state.index = 0;
 renderCard(true);
 renderSheet();
});

requestAnimationFrame(() => {
 syncTabsPill(false);
 mountCard(null);
 updateChrome();
});
</script>
</body>
</html>
