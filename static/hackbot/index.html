<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>secnotes - Hackbot</title>
<meta name="description" content="How people are building hackbots: architecture, tooling, verification, and evaluation." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
 :root {
 --bg: #000000;
 --fg: #ffffff;
 --muted: rgba(255, 255, 255, 0.55);
 --muted-2: rgba(255, 255, 255, 0.50);
 --faint: rgba(255, 255, 255, 0.08);
 --faint-2: rgba(255, 255, 255, 0.14);
 --card: #0a0a0a;
 --cyan: #ff2a2a;
 --acid: #ff2a2a;
 --ink: #000;
 --radius: 28px;
 --shell: 40rem;
 --ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - card-resize */
 --resize-dur: 300ms;
 --resize-ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - tabs-sliding (secnotes dark) */
 --tabs-dur: 250ms;
 --tabs-ease: cubic-bezier(0.22, 1, 0.36, 1);
 --tabs-text-muted: rgba(255, 255, 255, 0.55);
 --tabs-text-active: #000000;
 --tabs-bar-bg: rgba(255, 255, 255, 0.08);
 --tabs-pill-bg: #ffffff;

 /* transitions.dev - toast */
 --toast-open: 350ms;
 --toast-close: 250ms;
 --toast-distance: 16px;
 --toast-blur: 2px;
 --toast-scale: 0.97;
 --toast-ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - success-check */
 --check-opacity-dur: 500ms;
 --check-rotate-dur: 500ms;
 --check-rotate-from: 80deg;
 --check-bob-dur: 500ms;
 --check-y-amount: 40px;
 --check-blur-dur: 500ms;
 --check-blur-from: 10px;
 --check-path-dur: 500ms;
 --check-path-delay: 80ms;
 --check-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
 --check-ease-opacity: cubic-bezier(0.22, 1, 0.36, 1);
 --check-ease-rotate: cubic-bezier(0.22, 1, 0.36, 1);
 --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
 --check-ease-path: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - page-side-by-side (adapted for card enter/exit) */
 --page-slide-dur: 420ms;
 --page-fade-dur: 420ms;
 --page-slide-distance: 42%;
 --page-blur: 6px;
 --page-stagger: 0ms;
 --page-exit-enabled: 1;
 --page-slide-ease: cubic-bezier(0.22, 1, 0.36, 1);
 --page-fade-ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - texts-reveal */
 --stagger-dur: 500ms;
 --stagger-distance: 12px;
 --stagger-stagger: 40ms;
 --stagger-blur: 3px;
 --stagger-ease: cubic-bezier(0.22, 1, 0.36, 1);
 }

 *, *::before, *::after { box-sizing: border-box; }
 html, body { height: 100%; }
 body {
 margin: 0;
 background: var(--bg);
 color: var(--fg);
 font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 -webkit-font-smoothing: antialiased;
 text-rendering: optimizeLegibility;
 line-height: 1.5;
 }
 ::selection { background: rgba(0, 174, 239, 0.4); color: #fff; }
 button { font: inherit; color: inherit; }
 a { color: var(--cyan); text-decoration: none; }
 a:hover { text-decoration: underline; text-underline-offset: 3px; }

 .app {
 min-height: 100%;
 display: flex;
 flex-direction: column;
 padding:
 max(1.25rem, env(safe-area-inset-top))
 max(1.25rem, env(safe-area-inset-right))
 max(1.25rem, env(safe-area-inset-bottom))
 max(1.25rem, env(safe-area-inset-left));
 }
 .shell {
 width: 100%;
 max-width: var(--shell);
 margin: 0 auto;
 }

 /* - Header - */
 .top {
 display: flex;
 align-items: flex-start;
 justify-content: space-between;
 gap: 1rem;
 padding-top: 0.5rem;
 }
 .brand { display: flex; flex-direction: column; gap: 0.35rem; }
 .wordmark {
 font-size: 1.05rem;
 font-weight: 600;
 letter-spacing: -0.03em;
 color: #fff;
 }
 .eyebrow {
 margin: 0;
 font-size: 11px;
 font-weight: 500;
 text-transform: uppercase;
 letter-spacing: 0.28em;
 color: rgba(255, 255, 255, 0.5);
 }
 .ghost-link {
 appearance: none;
 border: 0;
 background: transparent;
 color: rgba(255,255,255,0.55);
 font-size: 0.875rem;
 font-weight: 500;
 cursor: pointer;
 padding: 0.5rem 0.25rem;
 transition: color 200ms var(--ease);
 }
 .ghost-link:hover { color: var(--cyan); }
 .ghost-link:focus-visible {
 outline: 2px solid var(--cyan);
 outline-offset: 3px;
 border-radius: 6px;
 }

 /* - Mode tabs (transitions.dev tabs-sliding) - */
 .mode-row {
 display: flex;
 flex-wrap: wrap;
 align-items: center;
 justify-content: space-between;
 gap: 1.25rem;
 margin-top: 2.25rem;
 }
 .t-tabs {
 position: relative;
 display: inline-flex;
 align-items: center;
 gap: 3px;
 padding: 3px;
 border-radius: 48px;
 background: var(--tabs-bar-bg);
 }
 .t-tab {
 position: relative;
 appearance: none;
 border: 0;
 background: transparent;
 height: 34px;
 padding: 4px 16px;
 color: var(--tabs-text-muted);
 cursor: pointer;
 border-radius: 48px;
 z-index: 1;
 font-size: 0.875rem;
 font-weight: 500;
 transition: color var(--tabs-dur) var(--tabs-ease);
 }
 .t-tab:not([aria-selected="true"]):hover,
 .t-tab[aria-selected="true"] {
 color: var(--tabs-text-active);
 }
 .t-tab[aria-selected="true"] { color: var(--tabs-text-active); }
 .t-tabs-pill {
 position: absolute;
 top: 3px;
 left: 0;
 height: 34px;
 width: 0;
 background: var(--tabs-pill-bg);
 border-radius: 48px;
 transform: translateX(0);
 transition:
 transform var(--tabs-dur) var(--tabs-ease),
 width var(--tabs-dur) var(--tabs-ease);
 will-change: transform, width;
 z-index: 0;
 pointer-events: none;
 }
 /* Active tab sits on white pill → black text; inactive stay muted.
 When pill is white, selected should be black - already set.
 Cyan accent variant: when research active we can tint pill via JS? Keep white like secnotes primary. */

 /* - Progress metric (secnotes GiantMetric craft) - */
 .metric {
 display: flex;
 align-items: baseline;
 gap: 0.45rem;
 flex-wrap: wrap;
 }
 .metric-num {
 font-size: clamp(2.5rem, 8vw, 3.75rem);
 font-weight: 500;
 letter-spacing: -0.04em;
 line-height: 1;
 color: var(--cyan);
 }
 .metric-rest {
 font-size: 0.95rem;
 font-weight: 500;
 color: rgba(255,255,255,0.5);
 letter-spacing: -0.01em;
 }

 /* - Main stage - */
 .stage {
 flex: 1;
 display: flex;
 flex-direction: column;
 margin-top: 2rem;
 }
 .card-slot {
 position: relative;
 width: 100%;
 perspective: 1400px;
 perspective-origin: 50% 45%;
 transform-style: flat;
 overflow: hidden;
 }
 .card-pane {
 transform-style: preserve-3d;
 backface-visibility: hidden;
 will-change: transform, opacity, filter;
 }

 /* card-resize */
 .t-resize {
 transition:
 width var(--resize-dur) var(--resize-ease),
 height var(--resize-dur) var(--resize-ease);
 will-change: width, height;
 overflow: hidden;
 }

 .card {
 position: relative;
 border-radius: var(--radius);
 border: 1px solid var(--faint);
 background: var(--card);
 padding: 1.75rem 1.5rem 1.5rem;
 }
 @media (min-width: 640px) {
 .card { padding: 2.25rem 2rem 1.75rem; }
 }

 .chips {
 display: flex;
 flex-wrap: wrap;
 gap: 0.5rem;
 margin-bottom: 1.25rem;
 }
 .chip {
 display: inline-flex;
 align-items: center;
 height: 26px;
 padding: 0 0.7rem;
 border-radius: 999px;
 font-size: 11px;
 font-weight: 500;
 letter-spacing: 0.04em;
 border: 1px solid var(--faint);
 color: rgba(255,255,255,0.65);
 background: transparent;
 }
 .chip-kind-practice { color: rgba(255,255,255,0.75); }
 .chip-kind-lab { color: rgba(255,255,255,0.75); }
 .chip-kind-paper { color: rgba(255,255,255,0.75); }
 .chip-unread {
 border-color: rgba(0, 174, 239, 0.35);
 color: var(--cyan);
 background: rgba(0, 174, 239, 0.08);
 }
 .chip-read {
 color: rgba(255,255,255,0.45);
 }
 .chip-acid {
 border-color: rgba(200, 245, 66, 0.35);
 color: var(--acid);
 }

 /* texts-reveal */
 .t-stagger-line {
 display: block;
 opacity: 0;
 transform: translateY(var(--stagger-distance));
 filter: blur(var(--stagger-blur));
 transition:
 opacity var(--stagger-dur) var(--stagger-ease),
 transform var(--stagger-dur) var(--stagger-ease),
 filter var(--stagger-dur) var(--stagger-ease);
 will-change: transform, opacity, filter;
 }
 .t-stagger-line--2 { transition-delay: var(--stagger-stagger); }
 .t-stagger.is-shown .t-stagger-line {
 opacity: 1;
 transform: translateY(0);
 filter: blur(0);
 }
 .t-stagger.is-hiding .t-stagger-line {
 opacity: 0;
 transform: translateY(0);
 filter: blur(0);
 transition:
 opacity 200ms ease,
 transform 0s linear,
 filter 0s linear;
 transition-delay: 0s;
 }

 .headline {
 margin: 0;
 font-size: clamp(1.65rem, 4.2vw, 2.35rem);
 font-weight: 500;
 letter-spacing: -0.03em;
 line-height: 1.12;
 text-wrap: balance;
 color: #fff;
 }
 .lede {
 margin: 1.25rem 0 0;
 max-width: 38rem;
 font-size: 1.05rem;
 line-height: 1.7;
 color: var(--muted);
 }
 .cite {
 margin-top: 1.75rem;
 padding-top: 1.25rem;
 border-top: 1px solid var(--faint);
 display: flex;
 flex-direction: column;
 gap: 0.35rem;
 }
 .cite-label {
 font-size: 11px;
 font-weight: 500;
 text-transform: uppercase;
 letter-spacing: 0.28em;
 color: rgba(255,255,255,0.45);
 }
 .cite a {
 font-size: 0.95rem;
 font-weight: 500;
 color: var(--cyan);
 }

 /* Card roll — transitions.dev page-slide + 3D roll for Inshorts-like deck feel */
 .card-pane {
 width: 100%;
 }
 .card-pane.is-enter-next {
 animation: card-roll-in-next var(--page-slide-dur) var(--page-slide-ease) both;
 }
 .card-pane.is-enter-prev {
 animation: card-roll-in-prev var(--page-slide-dur) var(--page-slide-ease) both;
 }
 .card-pane.is-exit-next {
 position: absolute;
 inset: 0;
 width: 100%;
 animation: card-roll-out-next var(--page-slide-dur) var(--page-slide-ease) both;
 pointer-events: none;
 }
 .card-pane.is-exit-prev {
 position: absolute;
 inset: 0;
 width: 100%;
 animation: card-roll-out-prev var(--page-slide-dur) var(--page-slide-ease) both;
 pointer-events: none;
 }
 @keyframes card-roll-in-next {
 from {
   opacity: 0;
   transform: translateX(28%) rotateY(-28deg) scale(0.94);
   filter: blur(var(--page-blur));
 }
 55% { opacity: 1; filter: blur(1px); }
 to {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 }
 @keyframes card-roll-in-prev {
 from {
   opacity: 0;
   transform: translateX(-28%) rotateY(28deg) scale(0.94);
   filter: blur(var(--page-blur));
 }
 55% { opacity: 1; filter: blur(1px); }
 to {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 }
 @keyframes card-roll-out-next {
 from {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 to {
   opacity: 0;
   transform: translateX(-32%) rotateY(32deg) scale(0.92);
   filter: blur(var(--page-blur));
 }
 }
 @keyframes card-roll-out-prev {
 from {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 to {
   opacity: 0;
   transform: translateX(32%) rotateY(-32deg) scale(0.92);
   filter: blur(var(--page-blur));
 }
 }

 /* - Actions - */
 .actions {
 display: flex;
 flex-wrap: wrap;
 gap: 0.75rem;
 margin-top: 1.75rem;
 align-items: center;
 }
 .btn-primary {
 appearance: none;
 display: inline-flex;
 align-items: center;
 justify-content: center;
 gap: 0.5rem;
 border: 0;
 border-radius: 999px;
 background: #fff;
 color: #000;
 padding: 0.9rem 1.65rem;
 font-size: 0.9rem;
 font-weight: 600;
 cursor: pointer;
 transition: background 300ms var(--ease), color 300ms var(--ease), transform 200ms var(--ease);
 }
 .btn-primary:hover { background: var(--cyan); color: #000; }
 .btn-primary:active { transform: scale(0.98); }
 .btn-primary:disabled {
 opacity: 0.4;
 cursor: not-allowed;
 transform: none;
 }
 .btn-primary:focus-visible {
 outline: 2px solid var(--cyan);
 outline-offset: 3px;
 }
 .btn-secondary {
 appearance: none;
 display: inline-flex;
 align-items: center;
 justify-content: center;
 gap: 0.4rem;
 border-radius: 999px;
 border: 1px solid rgba(255,255,255,0.25);
 background: transparent;
 color: #fff;
 padding: 0.9rem 1.35rem;
 font-size: 0.9rem;
 font-weight: 600;
 cursor: pointer;
 transition: border-color 300ms var(--ease), background 300ms var(--ease);
 }
 .btn-secondary:hover {
 border-color: rgba(255,255,255,0.5);
 background: rgba(255,255,255,0.06);
 }
 .btn-secondary:disabled {
 opacity: 0.35;
 cursor: not-allowed;
 }
 .btn-secondary:focus-visible {
 outline: 2px solid var(--cyan);
 outline-offset: 3px;
 }
 .btn-check {
 display: inline-flex;
 width: 1.1rem;
 height: 1.1rem;
 align-items: center;
 justify-content: center;
 }

 .hint {
 margin-top: 1.25rem;
 font-size: 0.8rem;
 color: rgba(255,255,255,0.35);
 }
 .hint kbd {
 font: inherit;
 font-size: 0.75rem;
 padding: 0.1rem 0.35rem;
 border-radius: 6px;
 border: 1px solid rgba(255,255,255,0.12);
 color: rgba(255,255,255,0.5);
 }

 /* - Toast (transitions.dev) - */
 .toast-wrap {
 position: fixed;
 left: 50%;
 bottom: max(1.5rem, env(safe-area-inset-bottom));
 transform: translateX(-50%);
 z-index: 60;
 pointer-events: none;
 }
 .t-toast {
 display: inline-flex;
 align-items: center;
 gap: 0.65rem;
 padding: 0.85rem 1.15rem;
 border-radius: 999px;
 background: #0a0a0a;
 border: 1px solid var(--faint-2);
 color: #fff;
 font-size: 0.9rem;
 font-weight: 500;
 opacity: 0;
 transform: translateY(var(--toast-distance)) scale(var(--toast-scale));
 filter: blur(var(--toast-blur));
 will-change: transform, opacity, filter;
 transition:
 opacity var(--toast-close) var(--toast-ease),
 transform var(--toast-close) var(--toast-ease),
 filter var(--toast-close) var(--toast-ease);
 }
 .t-toast.is-open {
 opacity: 1;
 transform: translateY(0) scale(1);
 filter: blur(0);
 transition:
 opacity var(--toast-open) var(--toast-ease),
 transform var(--toast-open) var(--toast-ease),
 filter var(--toast-open) var(--toast-ease);
 }

 /* success-check */
 .t-success-check {
 display: inline-block;
 transform-origin: center;
 opacity: 0;
 will-change: transform, opacity, filter;
 width: 1.35rem;
 height: 1.35rem;
 }
 .t-success-check svg { display: block; overflow: visible; width: 100%; height: 100%; }
 .t-success-check svg path {
 stroke-dasharray: 24;
 stroke-dashoffset: 24;
 }
 .t-success-check[data-state="in"] {
 animation:
 t-check-fade var(--check-opacity-dur) var(--check-ease-opacity) forwards,
 t-check-rotate var(--check-rotate-dur) var(--check-ease-rotate) forwards,
 t-check-blur var(--check-blur-dur) var(--check-ease-out) forwards,
 t-check-bob var(--check-bob-dur) var(--check-ease-bob) forwards;
 }
 .t-success-check[data-state="in"] svg path {
 animation: t-check-draw var(--check-path-dur) var(--check-ease-path) var(--check-path-delay, 0ms) forwards;
 }
 @keyframes t-check-fade { from { opacity: 0; } to { opacity: 1; } }
 @keyframes t-check-rotate {
 from { transform: rotate(var(--check-rotate-from)); }
 to { transform: rotate(0deg); }
 }
 @keyframes t-check-blur {
 from { filter: blur(var(--check-blur-from)); }
 to { filter: blur(0); }
 }
 @keyframes t-check-bob {
 from { translate: 0 var(--check-y-amount); }
 to { translate: 0 0; }
 }
 @keyframes t-check-draw { to { stroke-dashoffset: 0; } }

 /* - Drawer / progress sheet - */
 .backdrop {
 position: fixed;
 inset: 0;
 background: rgba(0,0,0,0.55);
 opacity: 0;
 pointer-events: none;
 transition: opacity 280ms var(--ease);
 z-index: 40;
 }
 .backdrop.open { opacity: 1; pointer-events: auto; }
 .sheet {
 position: fixed;
 top: 0;
 right: 0;
 height: 100%;
 width: min(26rem, 100%);
 background: #050505;
 border-left: 1px solid var(--faint);
 transform: translateX(100%);
 transition: transform 320ms var(--ease);
 z-index: 50;
 display: flex;
 flex-direction: column;
 padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
 }
 .sheet.open { transform: translateX(0); }
 .sheet-head {
 display: flex;
 align-items: flex-start;
 justify-content: space-between;
 gap: 1rem;
 margin-bottom: 1.25rem;
 }
 .sheet-title {
 margin: 0.35rem 0 0;
 font-size: 1.5rem;
 font-weight: 500;
 letter-spacing: -0.03em;
 }
 .sheet-filters {
 display: flex;
 flex-wrap: wrap;
 gap: 0.4rem;
 margin-bottom: 1rem;
 }
 .sheet-filters button {
 appearance: none;
 border: 1px solid var(--faint);
 background: transparent;
 color: rgba(255,255,255,0.55);
 border-radius: 999px;
 padding: 0.35rem 0.75rem;
 font-size: 0.75rem;
 font-weight: 500;
 cursor: pointer;
 }
 .sheet-filters button[aria-pressed="true"] {
 background: #fff;
 color: #000;
 border-color: #fff;
 }
 .sheet-list {
 overflow: auto;
 flex: 1;
 display: flex;
 flex-direction: column;
 gap: 0.35rem;
 padding-right: 0.25rem;
 }
 .sheet-item {
 appearance: none;
 width: 100%;
 text-align: left;
 border: 1px solid transparent;
 background: transparent;
 border-radius: 16px;
 padding: 0.85rem 0.9rem;
 cursor: pointer;
 transition: background 200ms var(--ease), border-color 200ms var(--ease);
 }
 .sheet-item:hover {
 background: rgba(255,255,255,0.04);
 border-color: var(--faint);
 }
 .sheet-item.is-current {
 border-color: rgba(0,174,239,0.35);
 background: rgba(0,174,239,0.07);
 }
 .sheet-item .t {
 display: block;
 font-size: 0.92rem;
 font-weight: 500;
 letter-spacing: -0.015em;
 color: #fff;
 }
 .sheet-item .m {
 display: flex;
 flex-wrap: wrap;
 gap: 0.35rem;
 margin-top: 0.35rem;
 font-size: 0.75rem;
 color: rgba(255,255,255,0.45);
 }
 .sheet-item .m .dot-unread { color: var(--cyan); }

 .sr-only {
 position: absolute;
 width: 1px; height: 1px;
 padding: 0; margin: -1px;
 overflow: hidden; clip: rect(0,0,0,0);
 white-space: nowrap; border: 0;
 }

 @media (prefers-reduced-motion: reduce) {
 .t-resize { transition: none !important; }
 .t-tabs-pill, .t-tab { transition: none !important; }
 .t-toast { transition: none !important; }
 .t-success-check { animation: none !important; opacity: 1; }
 .t-success-check svg path { animation: none !important; stroke-dashoffset: 0 !important; }
 .t-stagger-line { transition: none !important; opacity: 1; transform: none; filter: none; }
 .card-pane.is-enter-next,
 .card-pane.is-enter-prev,
 .card-pane.is-exit-next,
 .card-pane.is-exit-prev { animation: none !important; transform: none !important; filter: none !important; }
 .sheet, .backdrop { transition: none !important; }
 }



/* —— Responsive (phones / small tablets) —— */
html, body {
  min-height: 100%;
  min-height: 100dvh;
  overflow-x: hidden;
}
.app {
  min-height: 100dvh;
  box-sizing: border-box;
}
.shell { max-width: min(var(--shell), 100%); }
img, svg, video { max-width: 100%; height: auto; }
.card, .card-pane, .body, .lede, .title { word-wrap: break-word; overflow-wrap: anywhere; }

@media (max-width: 720px) {
  .app {
    padding:
      max(0.85rem, env(safe-area-inset-top))
      max(0.85rem, env(safe-area-inset-right))
      max(0.85rem, env(safe-area-inset-bottom))
      max(0.85rem, env(safe-area-inset-left));
  }
  .top {
    flex-direction: column;
    align-items: stretch;
    gap: 0.75rem;
  }
  .top .ghost-link { align-self: flex-start; min-height: 44px; }
  .brand-logo { width: 32px; height: 32px; }
  .logo-word { font-size: 1.05rem !important; }
  .eyebrow { letter-spacing: 0.18em !important; font-size: 10px !important; }
  .mode-row {
    flex-direction: column;
    align-items: stretch;
    gap: 0.85rem;
    margin-top: 1.25rem;
  }
  .t-tabs { width: 100%; display: flex !important; }
  .t-tab {
    flex: 1;
    height: 44px;
    padding: 4px 12px;
    font-size: 0.8rem;
    text-align: center;
  }
  .metrics { width: 100%; justify-content: space-between; }
  .metric-num { font-size: clamp(1.75rem, 12vw, 2.5rem) !important; }
  .stage { margin-top: 1rem; }
  .card {
    padding: 1.15rem 1rem 1.1rem !important;

<script>
const STORAGE_KEY = 'secnotes-hackbot-read-v1';
const CARDS = [{"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Concepts", "headline": "The known playbook is finite", "id": "hackbot-s1-rez0-finite-playbook", "title": "The known playbook is finite", "body": "In 2023, Joseph Thacker (rez0) argued that AI agents would eventually outhack humans because the set of known attack vectors is finite and most bugs come from methodology and context, not rare flashes of creativity. An agent can be given a tight brief for one bug class, draw on the strategies top hunters already write down, and then be scaled out with compute. He is careful about the caveat: humans keep the edge on novel attacks against new or existing technology until models catch up.", "steal": "Encode one bug class as a reusable brief, and treat unknown or novel techniques as a human-led layer rather than something the bot is assumed to invent.", "url": "https://josephthacker.com/ai/2023/11/08/ai-hacking-agents.html", "sourceLabel": "Joseph Thacker (rez0)", "date": "2023-11-08", "level": "Basic", "topic": "Concepts"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Tooling", "headline": "Put the model where the traffic already is", "id": "hackbot-s2-caido-workflow", "title": "Put the model where the traffic already is", "body": "Andrew Pratt's practitioner guide treats AI as a collaborator in the toolkit you already use, not a fixed scanner. Chat interfaces help with code reading and hypothesis-forming, but the more useful step is wiring models into the proxy workflow. Caido's official Shift plugin adds a floating prompt, agentic capabilities, and skills inside the tool where the requests already are.", "steal": "Start by giving the model access to the traffic and one repeating chore in your existing proxy, rather than standing up a separate autonomous stack.", "url": "https://www.caido.io/blog/2026-03-24-ai-enhanced-hacking/", "sourceLabel": "Andrew Pratt, Caido", "date": "2026-03-24", "level": "Basic", "topic": "Tooling"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Cost", "headline": "A heavy harness can get in the way", "id": "hackbot-s3-hakluke-cooked", "title": "A heavy harness can get in the way", "body": "Luke Stephens (hakluke) says his older bug-finding setup needed a complex harness to stay on track, but frontier models now work better with less of that scaffolding because they can follow a lead the way a human hunter would. They still need validation, and they do better with guidance from someone who knows the work. The cost is real: most of the top hunters he knows spend hundreds to thousands of US dollars a month on tokens.", "steal": "Default to a lighter harness as models improve, keep a human in the validation loop, and budget for token spend as a cost of competing.", "url": "https://hakluke.com/are-bug-bounties-cooked", "sourceLabel": "Luke Stephens (hakluke)", "date": "2026-06-16", "level": "Basic", "topic": "Cost"}, {"id": "hackbot-h1-hakluke-build-tools", "mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Concepts", "title": "Point the model, then make it build tools", "headline": "Point the model, then make it build tools", "body": "Top hunters now treat AI like Burp or a recon pipeline: it's essential, but a skilled person still has to aim it. Pasting a program's scope into a coding agent and saying \"find vulns\" does find real bugs, but everyone runs that prompt, so the easy findings are already duplicates. Point the model at an unmapped endpoint, a second-order interaction, or a feature that just shipped. When the model keeps repeating the same chore, have it write a fast deterministic tool instead of spending tokens to redo the work.", "steal": "Keep a library of deterministic tools for repeatable recon and checks, and save the model for aiming those tools at unusual surfaces.", "url": "https://hakluke.com/how-to-start-or-come-back-to-bug-bounties-in-2026", "sourceLabel": "Luke Stephens (hakluke)", "date": "2026-08-07", "level": "Basic", "topic": "Concepts"}, {"id": "hackbot-h2-xbow-four-stages", "mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Architecture", "title": "An AI pentest still has the same four stages", "headline": "An AI pentest still has the same four stages", "body": "An AI pentest follows the same stages as a human one: discovery, exploitation, validation, and reporting, just faster and with more overlap. In discovery the agent maps endpoints, inputs, and surfaces, then forms hypotheses. In exploitation, narrow agents chase a specific outcome with ordinary pentest tools and adapt when a test fails. A separate validation step reproduces the issue in a controlled setting before anything is reported. After a fix ships, the same loop can re-test it.", "steal": "Split the bot into four stages, and never let the agent that found an issue be the one that marks it confirmed.", "url": "https://xbow.com/blog/core-components-ai-pentesting-framework", "sourceLabel": "XBOW Team", "date": "2026-03-18", "level": "Basic", "topic": "Architecture"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Architecture", "headline": "Mix the models in one conversation", "id": "hackbot-s4-xbow-alloys", "title": "Mix the models in one conversation", "body": "Albert Ziegler describes XBOW “alloys”: in a single agent loop, the next model call is chosen from more than one model, sometimes at random, while the conversation is shared. The models are not told they are taking turns; each treats prior steps as its own. The point is to keep the same number of model calls while letting different strengths show up. On fixed benchmarks, this raised success rates from 25% to 40%, and then to 55%.", "steal": "Try alternating models inside one shared thread, without adding extra calls, and measure whether the mix beats any single model.", "url": "https://xbow.com/blog/alloy-agents", "sourceLabel": "Albert Ziegler, XBOW", "date": "2025-07-17", "level": "Intermediate", "topic": "Architecture"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Architecture", "headline": "The harness sets the ceiling", "id": "hackbot-s5-ethiack-harness", "title": "The harness sets the ceiling", "body": "Pedro Conde argues that a capable model can still fall flat if the harness is wrong. The harness sets roles, communication, context, tools, verification, and safety. Ethiack’s Hackian 1.2 scored about the same on their private EthiBench with newer post-June 2026 models as with older ones (around 64–67% F1). Hackian 2.0, rewritten around how current coding-agent workflows operate, reached 79.1% F1 with the latest models. They also say performance more than doubled from 33.45% at the start of the year, and that the jump was not only from stronger models.", "steal": "When a new model disappoints, change how agents coordinate and share context before you assume the model is the limit.", "url": "https://ethiack.com/info-hub/blog/ai-pentesting-harness-matters", "sourceLabel": "Pedro Conde, Ethiack", "date": "2026-11-10", "level": "Intermediate", "topic": "Architecture"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Verification", "headline": "Only keep findings you would actually review", "id": "hackbot-s6-casa-guardrails", "title": "Only keep findings you would actually review", "body": "Jameson Lopp describes a regularly running AI pentest harness on Casa’s own codebase, inspired by Nicholas Carlini’s public techniques, that files evidence-backed findings for humans to triage. False positives and accepted risks go into an ignore ledger that needs a written reason and an expiry date, so ignored items come back for review instead of disappearing. Critical findings alert the on-call team; everything else waits in normal triage.", "steal": "Require evidence before a finding is filed, and make every ignore decision expire so it has to be revisited.", "url": "https://blog.casa.io/how-built-reliable-ai-pentest/", "sourceLabel": "Jameson Lopp, Casa", "date": "2026-08-11", "level": "Intermediate", "topic": "Verification"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Architecture", "headline": "Shrink the maze the agent walks", "id": "hackbot-s7-theori-design", "title": "Shrink the maze the agent walks", "body": "Theori’s AIxCC write-up treats agent design as maze-shrinking: break the main job into simpler sub-tasks, and expose a repeated sub-task as its own sub-agent so the parent only sees a short input and output. Curate tools so they are powerful enough to finish but narrow enough to avoid dead ends; a source-question agent did better with targeted read and search tools than with open-ended shell access, which overflowed context and wasted steps.", "steal": "Split the job into sub-agents, and replace a generic shell with a small set of tools that match the sub-task.", "url": "https://theori.io/blog/building-effective-llm-agents-63446", "sourceLabel": "Xint, Theori", "date": "2025-08-08", "level": "Intermediate", "topic": "Architecture"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Verification", "headline": "Debug the bot by reading its traces", "id": "hackbot-s8-theori-traces", "title": "Debug the bot by reading its traces", "body": "A companion Theori post argues that LLM agents are unusually easy to inspect compared with fuzzers or formal methods: you can just read the trajectory logs. They walk through selected traces from a fully autonomous run whose only input was a code repository, with no human choosing or prioritizing bugs and no fuzzer supplying proofs. The practical habit is to study those logs for where the agent stalls, not only for whether it finished.", "steal": "Keep full agent traces and regularly read a sample, looking for loops, dead ends, and invented observations.", "url": "https://theori.io/blog/exploring-traces-63950", "sourceLabel": "Xint, Theori", "date": "2025-08-08", "level": "Intermediate", "topic": "Verification"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Tooling", "headline": "The agent needs tools it can stay inside", "id": "hackbot-s9-enigma-interactive", "title": "The agent needs tools it can stay inside", "body": "EnIGMA, from Talor Abramovich and colleagues, extends an LM agent with Interactive Agent Tools so it can run interactive utilities such as a debugger or a server-connection tool instead of one-shot commands. They evaluate on 390 CTF challenges across four benchmarks and report state-of-the-art results on NYU CTF, InterCode-CTF, and CyBench. They also flag “soliloquizing,” where a model invents observations instead of actually using a tool.", "steal": "Give the bot a real interactive debugger and connection tool, and log whether a tool was actually called before you trust what it claims to have seen.", "url": "https://arxiv.org/abs/2409.16165", "sourceLabel": "Talor Abramovich et al.", "date": "2024-09-24", "level": "Intermediate", "topic": "Tooling"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Architecture", "headline": "Security work is not a short coding loop", "id": "hackbot-s10-pd-neo", "title": "Security work is not a short coding loop", "body": "Rachel Benson introduces ProjectDiscovery’s Neo as a framework, not a black box: model reasoning plus purpose-built execution tools, isolated sandboxes, a memory layer that learns a team’s code and naming, and controls for what the system can touch. She contrasts this with coding assistants built for a short, single-file loop. Security work, she writes, is long-running, often parallel, and has to pause and resume without losing state.", "steal": "Persist state across long, pauseable tasks, and run tool use in an isolated sandbox with an explicit allow-list of what the bot can touch.", "url": "https://projectdiscovery.io/blog/introducing-neo", "sourceLabel": "Rachel Benson, ProjectDiscovery", "date": "2025-12-03", "level": "Intermediate", "topic": "Architecture"}, {"id": "hackbot-h3-pentestgpt-pipeline", "mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Open-source agent", "title": "A staged pipeline that hands work to the next stage", "headline": "A staged pipeline that hands work to the next stage", "body": "PentestGPT is an open-source agent (MIT license, USENIX Security 2024) for pentests and CTFs. The current agentic version runs a multi-stage pipeline: reconnaissance, then exploitation, then a walkthrough for CTF work; or asset discovery, vulnerability identification, and a report for pentests. Each stage's findings feed the next. The autonomous path drives Claude Code or Codex to run tools and reason without a human in the loop, and sessions can be saved and resumed. An older interactive mode still works with a wider range of model providers.", "steal": "Give the bot explicit phases that hand structured findings to the next one, and let it save and resume a session.", "url": "https://github.com/GreyDGL/PentestGPT", "sourceLabel": "Gelei Deng et al.", "date": null, "level": "Intermediate", "topic": "Open-source agent"}, {"id": "hackbot-h4-shannon-live-proof", "mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Open-source agent", "title": "No finding without a live proof", "headline": "No finding without a live proof", "body": "Shannon is an open-source white-box pentester for web applications. It mounts the target's source code read-only in a temporary Docker worker and also tests the running app. One path does live recon; another maps trust boundaries and data flows in the code. Their findings are merged and deduplicated, then agents must prove each item live. Anything unproven is dropped: \"No exploit, no report.\" Rules of engagement live in configuration, not in the prompt.", "steal": "Keep two streams of candidates (code review and live recon), merge them, and only promote a finding after a live, reproducible proof. Put scope and login rules in config.", "url": "https://github.com/KeygraphHQ/shannon", "sourceLabel": "Keygraph", "date": null, "level": "Intermediate", "topic": "Open-source agent"}, {"id": "hackbot-h5-strix-sandbox-team", "mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Open-source agent", "title": "A team of agents inside a sandbox", "headline": "A team of agents inside a sandbox", "body": "Strix is an open-source pentest agent (Apache-2.0) that runs inside a Docker sandbox and uses your own model key. It can review a local codebase, a GitHub repository, or a running web app, and it can take an OpenAPI or Postman description of an API so it knows where to send traffic. A coordinator runs a team of agents that work together on reconnaissance, exploitation, and validation. Findings are meant to ship with working proofs and fix notes, not scanner-style guesses. On pull requests in CI, it narrows the review to the changed files.", "steal": "Run the agents in an isolated sandbox, let them share work as a team, and limit CI scans to the changed files.", "url": "https://github.com/usestrix/strix", "sourceLabel": "Strix", "date": null, "level": "Intermediate", "topic": "Open-source agent"}, {"id": "hackbot-h6-ethiack-roles", "mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Architecture", "title": "Put the right model in the right role", "headline": "Put the right model in the right role", "body": "A pentest harness doesn't have to use one model for every job. Split planning and orchestration (the Strategizer) from reconnaissance and exploitation (the Executor), with separate pieces for validation and guardrails. In tests of seven frontier models over three runs, a model that looked weak doing both jobs improved sharply with a strong Strategizer in front of it. No pairing beat the best model in both roles, but a strong Strategizer with a cheaper Executor reached over 95% of the top F1 score (a combined precision-and-recall measure) at roughly half the cost.", "steal": "Give planning and execution to different models, and track cost alongside accuracy so a cheaper model can do the hands-on work.", "url": "https://ethiack.com/info-hub/research/strategy-is-key-evaluating-the-pentesting-skills-of-frontier-LLMs", "sourceLabel": "Pedro Conde, Ethiack", "date": "2026-08-19", "level": "Intermediate", "topic": "Architecture"}, {"id": "hackbot-h7-cybench-subtasks", "mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Evaluation", "title": "Grade the steps, not just the flag", "headline": "Grade the steps, not just the flag", "body": "Cybench is a public benchmark of 40 professional CTF tasks from four competitions. Each task comes with a description, starter files, and an evaluator. The agent works in a Kali Linux container, runs shell commands or talks to a task server, and then submits an answer. Many full tasks are still too hard, so the authors added subtasks that score the steps along the way and show where an agent stalls. In the original paper, the strongest setups without subtask hints solved full tasks that took human teams up to 11 minutes.", "steal": "Test the bot on a fixed set of tasks with step-by-step subgoals, not only on whether it finished the whole chain.", "url": "https://cybench.github.io/", "sourceLabel": "Andy K. Zhang et al.", "date": "2024-08-15", "level": "Intermediate", "topic": "Evaluation"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Case study", "headline": "Teach the bot skepticism, and watch the token bill", "id": "hackbot-s11-rez0-hackbot", "title": "Teach the bot skepticism, and watch the token bill", "body": "Joseph Thacker and JD (xssdoctor) built a cloud hackbot that loaded different skills as it moved through a target list. Early on, roughly 80% of findings were false positives: the bot could hack, but it had no skepticism and would write a polished report once it believed a bug existed. Their first rule was to keep logs of every command, request, and conclusion, streamed so they could watch it think. At one point 80% of tokens were going to authentication rather than hacking or validation, until they split session-keeping off the hacking loop. Over five months it found 126 bugs; 112 of 126 (89%) were later confirmed real, and 88 of 126 were rated high or critical.", "steal": "Log the full session, require a second look before a report is filed, and measure how much of the token budget is spent on login and other overhead.", "url": "https://josephthacker.com/hacking/2026/07/01/we-built-a-hackbot.html", "sourceLabel": "Joseph Thacker (rez0) and JD (xssdoctor)", "date": "2026-07-01", "level": "Advanced", "topic": "Case study"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Architecture", "headline": "Fuzz to crash, then let agents patch", "id": "hackbot-s12-buttercup", "title": "Fuzz to crash, then let agents patch", "body": "Trail of Bits open-sourced Buttercup after taking second place in DARPA’s AIxCC. The system splits the work: an orchestrator, AI-augmented mutational fuzzing on OSS-Fuzz with libFuzzer and Jazzer, static program models built with tree-sitter and CodeQuery, and a seven-agent patcher. Crashes are recorded as proofs of vulnerability, deduplicated, and only then sent for patching; a patch has to stop the proof and its duplicates without breaking other tests.", "steal": "Use fuzzing plus sanitizers for proofs, and keep patch generation on a separate multi-agent loop that must pass the original crash and the existing tests.", "url": "https://blog.trailofbits.com/2025/08/08/buttercup-is-now-open-source/", "sourceLabel": "Michael Brown, Trail of Bits", "date": "2025-08-08", "level": "Advanced", "topic": "Architecture"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Architecture", "headline": "A full pipeline that does not start with a fuzzer", "id": "hackbot-s13-theori-roboduck", "title": "A full pipeline that does not start with a fuzzer", "body": "Theori’s RoboDuck, which placed third in AIxCC, is unusual among the finalists for building proofs of vulnerability with an LLM-first pipeline rather than fuzzing or symbolic execution. The write-up walks through bug finding, bug filtering, proof generation, patch generation, and the scaffolding that glues those stages together. The system was built to take large C or Java codebases and return proofs and patches, including on tasks limited to a single code diff.", "steal": "If you go LLM-first, still insert an explicit filter and a proof-generation stage before anyone tries to write a patch.", "url": "https://theori.io/blog/aixcc-and-roboduck-63447", "sourceLabel": "Xint, Theori", "date": "2025-08-08", "level": "Advanced", "topic": "Architecture"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Verification", "headline": "Finding it is easy, proving it is the product", "id": "hackbot-s14-pd-prove", "title": "Finding it is easy, proving it is the product", "body": "Andy Cao and Prince Chaddha say the practical problem for teams using LLMs is not a shortage of hypotheses but a flood of unproven ones. They built Neo to close the gap between finding a vulnerability and proving it, and they report that in a benchmark against Claude Code and traditional SAST/DAST on AI-generated applications, Neo found 60% more vulnerabilities with 80% fewer false positives because it deploys the app, tests it at runtime, and produces evidence. They also describe putting Neo to the test on popular software, where it hunted, exploited, and proved 22 zero-days.", "steal": "Do not count a finding until the bot has demonstrated it against a running target and attached evidence a human can replay.", "url": "https://projectdiscovery.io/blog/everyone-is-finding-vulns-the-hard-part-is-proving-them", "sourceLabel": "Andy Cao & Prince Chaddha, ProjectDiscovery", "date": "2026-03-20", "level": "Advanced", "topic": "Verification"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Verification", "headline": "Every finding starts as a hallucination", "id": "hackbot-s15-andy-gill-bin", "title": "Every finding starts as a hallucination", "body": "Andy Gill’s autonomous hunting setup, built around Claude Code and MCP, treats new findings as hallucinations until they pass promotion gates: a proof of concept has to exist and compile, and it has to reproduce the crash in a clean virtual-machine snapshot, among other checks. Work is organized into campaigns so later runs can reuse what already failed. He also built TokenBurn to compare the cost of a Claude subscription plus hardware against equivalent API spend.", "steal": "Start every finding in a holding bin, promote it only after a clean-environment replay, and keep a running cost dashboard next to the campaign log.", "url": "https://blog.zsec.uk/bullyingllms/", "sourceLabel": "Andy Gill", "date": "2026-04-04", "level": "Advanced", "topic": "Verification"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Architecture", "headline": "Do not bet on a single cyber reasoning system", "id": "hackbot-s16-atlanta-atlantis", "title": "Do not bet on a single cyber reasoning system", "body": "Team Atlanta won DARPA’s AIxCC final with Atlantis. Taesoo Kim writes that Atlantis is not one system: it is a group of independent cyber reasoning systems, built by specialized teams for C, Java, multilingual analysis, patching, and SARIF assessment, that deliberately used orthogonal strategies. The idea was to raise both coverage and reliability by not depending on a single approach.", "steal": "Run more than one independent strategy in parallel, and score them separately so a failure in one path does not stall the rest.", "url": "https://team-atlanta.github.io/blog/post-afc/", "sourceLabel": "Taesoo Kim, Team Atlanta", "date": "2025-08-12", "level": "Advanced", "topic": "Architecture"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Architecture", "headline": "The unattended bot is an operations problem", "id": "hackbot-s17-atlanta-infra", "title": "The unattended bot is an operations problem", "body": "HyungSeok Han’s follow-up is about the infrastructure that let Atlantis run without a human in the loop: Kubernetes services for ingesting challenges and logs, LiteLLM to keep model use inside budget and to log requests, and a per-challenge manager that starts the right language-specific modules and allocates cloud and model budget when a new target arrives. They treat reliable submission of proofs, patches, and assessments as part of the design, not an afterthought.", "steal": "Give each target its own budgeted worker, and log every model call so you can cap spend while the system is running unattended.", "url": "https://team-atlanta.github.io/blog/post-atl-infra/", "sourceLabel": "HyungSeok Han, Team Atlanta", "date": "2025-08-13", "level": "Advanced", "topic": "Architecture"}, {"mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Case study", "headline": "The postmortem is the real write-up", "id": "hackbot-s18-shellphish", "title": "The postmortem is the real write-up", "body": "Shellphish’s ARTIPHISHELL placed fifth in the AIxCC final after a $2 million semifinal finish. Their postmortem describes a four-phase pipeline — static analysis, dynamic analysis, triage, and patching — where later phases depend on earlier ones, with redundancy so the system can still submit something if a component fails. The post is mainly a technical account of the bugs and issues in their own system that kept it from doing better, which is the useful part for anyone building a similar bot.", "steal": "Assume pipeline stages will fail, build a degraded path that can still submit a result, and write down the failures in your own orchestrator with the same care you give target bugs.", "url": "https://support.shellphish.net/blog/2025/08/22/shellphish-x-aixcc-pm/", "sourceLabel": "degrigis & Clasm, Shellphish", "date": "2025-08-22", "level": "Advanced", "topic": "Case study"}, {"id": "hackbot-h8-cve-bench", "mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Evaluation", "title": "Test on real CVEs, not only CTFs", "headline": "Test on real CVEs, not only CTFs", "body": "CVE-Bench is a sandboxed benchmark of 40 critical-severity web CVEs. In the zero-day setting, the agent gets only a task description and has to find and trigger the issue on its own. In the one-day setting, it also gets a high-level description of the vulnerability. Graders score concrete outcomes, such as a file being read or an unauthorized admin login, not the model's write-up. In the paper, the best agents exploited up to 10% of the vulnerabilities in the zero-day setting and 13% in the one-day setting.", "steal": "Score the bot on outcomes you can measure in a sandbox, and report zero-day and one-day results separately so a hint doesn't hide a weak discoverer.", "url": "https://github.com/uiuc-kang-lab/cve-bench", "sourceLabel": "Yuxuan Zhu et al.", "date": "2025-03-21", "level": "Advanced", "topic": "Evaluation"}, {"id": "hackbot-h9-xbow-coordinator", "mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Architecture", "title": "Short-lived workers under a persistent coordinator", "headline": "Short-lived workers under a persistent coordinator", "body": "This purpose-built offensive system runs thousands of short-lived agents, each with one narrow objective and a fresh context, directed by a coordinator that stays running. If one agent dies on step four, another can start clean and try a different path. Discovery and confirmation are separate: creative agents surface candidates, and deterministic checks decide what is real. A safety checker reviews every action before it runs and enforces scope at the network layer. The authors report more than 1,060 HackerOne submissions, with humans reviewing reports for compliance rather than doing the discovery.", "steal": "Use a long-running coordinator that hands out one-shot tasks, plus a validator that isn't a model and a hard scope check in front of every tool call.", "url": "https://xbow.com/blog/we-ran-1060-autonomous-attacks", "sourceLabel": "Albert Ziegler, XBOW", "date": "2026-03-02", "level": "Advanced", "topic": "Architecture"}, {"id": "hackbot-h10-naptime-tools", "mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Vuln research", "title": "Give the agent a researcher's tools, and verify automatically", "headline": "Give the agent a researcher's tools, and verify automatically", "body": "Project Zero's Naptime sets up vulnerability research the way a human researcher works: room to reason, an interactive environment, specialized tools, automatic checking, and several independent attempts instead of one long, muddled thread. The agent gets a code browser, a sandboxed Python tool, a debugger, and a reporting tool it uses to claim success or give up. A controller checks the claim, usually by confirming a crash, instead of trusting the model's confidence. On the CyberSecEval2 benchmark, buffer overflow scores rose from 0.05 to 1.00 and advanced memory corruption from 0.24 to 0.76.", "steal": "Give the bot a code browser, a debugger, and a sandboxed script runner. Accept a finding only when a controller can reproduce a hard success condition, and run several short attempts instead of one long one.", "url": "https://projectzero.google/2024/06/project-naptime.html", "sourceLabel": "Sergei Glazunov & Mark Brand, Project Zero", "date": "2024-06-20", "level": "Advanced", "topic": "Vuln research"}, {"id": "hackbot-h11-big-sleep-variants", "mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Vuln research", "title": "Start from a known fix and look for the cousin bug", "headline": "Start from a known fix and look for the cousin bug", "body": "Naptime later became Big Sleep, a collaboration between Project Zero and DeepMind. The team argues that variant analysis is a better first task for today's models than open-ended bug hunting: start from a past fix and ask whether a similar issue is still there. In their first large experiment, they gave the agent recent SQLite commits and diffs and asked it to look for related bugs that were still unfixed. It found an exploitable stack buffer underflow, which was reported in early October 2024 and fixed the same day, before it reached an official release.", "steal": "When hunting memory-safety bugs, give the agent a past patch and ask it for leftover variants, then use a fuzzer or a human reviewer as a second opinion.", "url": "https://projectzero.google/2024/10/from-naptime-to-big-sleep.html", "sourceLabel": "The Big Sleep team, Project Zero", "date": "2024-11-01", "level": "Advanced", "topic": "Vuln research"}, {"id": "hackbot-h12-fuzzing-vs-agents", "mode": "research", "day": null, "category": "Hackbot", "kind": "post", "kindLabel": "Evaluation", "title": "Fuzzing and agents catch different bugs", "headline": "Fuzzing and agents catch different bugs", "body": "Over six months on Chrome's V8 JavaScript engine, Big Sleep found 45 vulnerabilities and the specialized fuzzer Fuzzilli found 37, with 25% overlap between the bugs each reported. That method tends to undercount overlap, so the team also ran dedicated experiments on bugs reported since 2023 and estimated the true overlap at about 60%. Either way, a large share of bugs was found by only one of the two. Fuzzilli ran continuously and usually saw new code within hours, while Big Sleep ran daily over new commits. Their recommendation is to run both.", "steal": "Don't treat the bot as a replacement for fuzzing. Run both, and track which bugs only one of them catches.", "url": "https://projectzero.google/2026/10/fuzzing-v-AI.html", "sourceLabel": "Samuel Groß, Project Zero", "date": "2026-10-27", "level": "Advanced", "topic": "Evaluation"}];

const state = {
 mode: 'research',
 index: 0,
 read: {},
 animating: false,
 drawerFilter: 'all',
 levelFilter: 'all',
 topicFilter: 'all',
 touchStartX: null,
 touchStartY: null,
};

function loadRead() {
 try {
 const raw = localStorage.getItem(STORAGE_KEY);
 state.read = raw ? JSON.parse(raw) : {};
 if (typeof state.read !== 'object' || state.read === null || Array.isArray(state.read)) state.read = {};
 } catch (e) {
 state.read = {};
 }
}
function saveRead() {
 localStorage.setItem(STORAGE_KEY, JSON.stringify(state.read));
}
function isRead(id) {
 return !!(state.read[id] && state.read[id].readAt);
}
function markRead(id) {
 if (!isRead(id)) {
 state.read[id] = { readAt: new Date().toISOString() };
 saveRead();
 return true;
 }
 return false;
}

/** Unread-first within mode; stable relative order from CARDS. */
function modeCards() {
 let list = CARDS.slice();
 if (state.levelFilter && state.levelFilter !== 'all') list = list.filter(c => c.level === state.levelFilter);
 if (state.topicFilter && state.topicFilter !== 'all') list = list.filter(c => c.topic === state.topicFilter);
 const unread = list.filter(c => !isRead(c.id));
 const read = list.filter(c => isRead(c.id));
 return unread.concat(read);
}

function counts() {
 const visible = modeCards();
 return {
 train: 0,
 res: CARDS.length,
 trainRead: 0,
 resRead: CARDS.filter(c => isRead(c.id)).length,
 total: CARDS.length,
 readN: CARDS.filter(c => isRead(c.id)).length,
 visible: visible.length,
 visibleRead: visible.filter(c => isRead(c.id)).length,
 };
}

function escapeHtml(s) {
 return String(s).replace(/[&<>"']/g, c => ({
 '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
 }[c]));
}
function escapeAttr(s) {
 return escapeHtml(s).replace(/`/g, '&#96;');
}

function levelChipClass(level) {
 if (level === 'Basic') return 'chip-level-basic';
 if (level === 'Intermediate') return 'chip-level-intermediate';
 return 'chip-level-advanced';
}

function buildCardHTML(card) {
 const read = isRead(card.id);
 const citeLabel = card.sourceLabel || 'Source';
 const linkText = 'Open primary source ↗';
 return `
 <article class="card" data-id="${escapeAttr(card.id)}" aria-label="${escapeAttr(card.title)}">
 <div class="chips">
 <span class="chip ${levelChipClass(card.level)}">${escapeHtml(card.level)}</span>
 <span class="chip">${escapeHtml(card.topic)}</span>
 <span class="chip ${read ? 'chip-read' : 'chip-unread'}">${read ? 'Read' : 'Unread'}</span>
 ${card.date ? `<span class="chip">${escapeHtml(card.date)}</span>` : ''}
 </div>
 <div class="t-stagger" data-stagger>
 <h2 class="headline t-stagger-line t-stagger-line--1">${escapeHtml(card.headline || card.title)}</h2>
 <p class="lede t-stagger-line t-stagger-line--2">${escapeHtml(card.body)}</p>
 <div class="steal t-stagger-line t-stagger-line--3">
 <span class="steal-label">What to steal for our hackbot</span>
 <p>${escapeHtml(card.steal)}</p>
 </div>
 </div>
 <div class="cite">
 <span class="cite-label">${escapeHtml(citeLabel)}</span>
 <a href="${escapeAttr(card.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(linkText)}</a>
 </div>
 </article>
 `;
}

function syncTabsPill(animate) {
 return; // no mode tabs on /hackbot
}

function updateChrome() {
 const list = modeCards();
 const c = counts();
 const modeRead = c.visibleRead;
 const modeTotal = c.visible || c.total;
 document.getElementById('metricRead').textContent = String(modeRead);
 document.getElementById('metricRest').textContent =
 `/ ${modeTotal} cards`;

 const markBtn = document.getElementById('markBtn');
 const cur = list[state.index];
 if (cur && isRead(cur.id)) {
 markBtn.textContent = 'Already read';
 markBtn.disabled = true;
 } else {
 markBtn.innerHTML = `<span class="btn-check" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 48 48" fill="none"><path d="M10 24.5L20 34.5L38 14" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span> Mark as read`;
 markBtn.disabled = state.animating || !cur;
 }
 document.getElementById('prevBtn').disabled = state.animating || state.index <= 0;
 document.getElementById('nextBtn').disabled = state.animating || !cur || state.index >= list.length - 1;


 document.getElementById('live').textContent =
 `${modeRead} of ${modeTotal} ${state.mode} read. Showing card ${state.index + 1} of ${list.length}.`;
}

function setSlotHeight(el) {
 const slot = document.getElementById('cardSlot');
 if (!el) { slot.style.height = 'auto'; return; }
 const h = el.offsetHeight;
 slot.style.height = h + 'px';
}

function revealStagger(root) {
 const block = root.querySelector('[data-stagger]');
 if (!block) return;
 block.classList.remove('is-hiding', 'is-shown');
 void block.offsetHeight;
 block.classList.add('is-shown');
}

function showToast(msg) {
 const t = document.getElementById('toast');
 const check = document.getElementById('toastCheck');
 document.getElementById('toastText').textContent = msg;
 check.setAttribute('data-state', 'out');
 void check.offsetWidth;
 check.setAttribute('data-state', 'in');
 t.classList.add('is-open');
 clearTimeout(showToast._timer);
 showToast._timer = setTimeout(() => {
 t.classList.remove('is-open');
 setTimeout(() => check.setAttribute('data-state', 'out'), 280);
 }, 1600);
}

function mountCard(direction) {
 const list = modeCards();
 if (!list.length) return;
 if (state.index < 0) state.index = 0;
 if (state.index >= list.length) state.index = list.length - 1;
 const card = list[state.index];
 const slot = document.getElementById('cardSlot');

 const pane = document.createElement('div');
 pane.className = 'card-pane';
 pane.innerHTML = buildCardHTML(card);

 const prev = slot.querySelector('.card-pane:not(.is-exit-next):not(.is-exit-prev)');

 if (prev && direction) {
 state.animating = true;
 updateChrome();
 const exitClass = direction === 'prev' ? 'is-exit-prev' : 'is-exit-next';
 const enterClass = direction === 'prev' ? 'is-enter-prev' : 'is-enter-next';
 prev.classList.add(exitClass);
 pane.classList.add(enterClass);
 slot.appendChild(pane);

 // Measure incoming content for height morph
 requestAnimationFrame(() => {
 setSlotHeight(pane);
 revealStagger(pane);
 });

 const done = () => {
 prev.remove();
 pane.classList.remove(enterClass);
 state.animating = false;
 updateChrome();
 setSlotHeight(pane);
 };
 prev.addEventListener('animationend', done, { once: true });
 setTimeout(done, 320);
 } else {
 slot.innerHTML = '';
 slot.appendChild(pane);
 // First paint: set height without fighting layout
 slot.style.height = 'auto';
 requestAnimationFrame(() => {
 setSlotHeight(pane);
 revealStagger(pane);
 });
 updateChrome();
 }
}

function goNext(mark) {
 if (state.animating) return;
 const list = modeCards();
 const cur = list[state.index];
 if (!cur) return;

 // Enter / Mark on an already-read card just advances (no toast)
 if (mark && isRead(cur.id)) {
 if (state.index < list.length - 1) {
 state.index += 1;
 mountCard('next');
 }
 return;
 }

 if (mark) {
 const newly = markRead(cur.id);
 if (newly) showToast('Marked read');
 const nextList = modeCards();
 // Current card just moved into the read section; land on first unread
 const nextUnread = nextList.findIndex(c => !isRead(c.id));
 if (nextUnread >= 0) {
 state.index = nextUnread;
 mountCard('next');
 } else {
 state.index = Math.max(0, nextList.length - 1);
 mountCard(null);
 if (newly) showToast('Marked read · end of list');
 }
 return;
 }

 if (state.index < list.length - 1) {
 state.index += 1;
 mountCard('next');
 }
}

function goPrev() {
 if (state.animating || state.index <= 0) return;
 state.index -= 1;
 mountCard('prev');
}

function setMode(mode) {
 if (mode === state.mode) return;
 state.mode = mode;
 state.index = 0;
 syncTabsPill(true);
 mountCard('next');
}

function openSheet() {
 const backdrop = document.getElementById('backdrop');
 const sheet = document.getElementById('sheet');
 backdrop.hidden = false;
 sheet.hidden = false;
 requestAnimationFrame(() => {
 backdrop.classList.add('open');
 sheet.classList.add('open');
 });
 renderSheet();
}
function closeSheet() {
 const backdrop = document.getElementById('backdrop');
 const sheet = document.getElementById('sheet');
 backdrop.classList.remove('open');
 sheet.classList.remove('open');
 setTimeout(() => {
 backdrop.hidden = true;
 sheet.hidden = true;
 }, 300);
}

function renderSheet() {
 const list = document.getElementById('sheetList');
 const f = state.drawerFilter;
 let items = CARDS.slice();
 if (f === 'unread') items = items.filter(c => !isRead(c.id));
 else if (f === 'read') items = items.filter(c => isRead(c.id));
 else if (f === 'Basic' || f === 'Intermediate' || f === 'Advanced') items = items.filter(c => c.level === f);

 const cur = modeCards()[state.index];
 list.innerHTML = items.map(c => `
 <button type="button" class="sheet-item${cur && cur.id === c.id ? ' is-current' : ''}" data-id="${escapeAttr(c.id)}">
 <span class="t">${escapeHtml(c.title)}</span>
 <span class="m">
 <span>${escapeHtml(c.level)}</span>
 <span>· ${escapeHtml(c.topic)}</span>
 <span class="${isRead(c.id) ? '' : 'dot-unread'}">· ${isRead(c.id) ? 'Read' : 'Unread'}</span>
 </span>
 </button>
 `).join('') || '<p style="padding:1rem;color:rgba(255,255,255,0.45)">No cards match.</p>';
}

function jumpTo(id) {
 const card = CARDS.find(c => c.id === id);
 if (!card) return;
 state.mode = card.mode;
 syncTabsPill(true);
 const list = modeCards();
 const idx = list.findIndex(c => c.id === id);
 state.index = Math.max(0, idx);
 closeSheet();
 mountCard('next');
}

/* Events */
document.getElementById('markBtn').addEventListener('click', () => goNext(true));
document.getElementById('nextBtn').addEventListener('click', () => goNext(false));
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('tabTraining').addEventListener('click', () => setMode('training'));
document.getElementById('tabResearch').addEventListener('click', () => setMode('research'));
document.getElementById('openSheet').addEventListener('click', openSheet);
document.getElementById('closeSheet').addEventListener('click', closeSheet);
document.getElementById('backdrop').addEventListener('click', closeSheet);

document.getElementById('sheetFilters').addEventListener('click', (e) => {
 const btn = e.target.closest('button[data-filter]');
 if (!btn) return;
 state.drawerFilter = btn.dataset.filter;
 document.querySelectorAll('#sheetFilters button').forEach(b =>
 b.setAttribute('aria-pressed', b === btn ? 'true' : 'false')
 );
 renderSheet();
});
document.getElementById('sheetList').addEventListener('click', (e) => {
 const item = e.target.closest('[data-id]');
 if (item) jumpTo(item.dataset.id);
});

document.addEventListener('keydown', (e) => {
 if (e.target.matches('input, textarea, select')) return;
 if (e.key === 'ArrowRight') { e.preventDefault(); goNext(false); }
 else if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
 else if (e.key === 'Enter') { e.preventDefault(); goNext(true); }
 else if (e.key === 'Escape') closeSheet();
});

/* Optional swipe: left = next, right = prev */
const slot = document.getElementById('cardSlot');
slot.addEventListener('touchstart', (e) => {
 if (!e.touches[0]) return;
 state.touchStartX = e.touches[0].clientX;
 state.touchStartY = e.touches[0].clientY;
}, { passive: true });
slot.addEventListener('touchend', (e) => {
 if (state.touchStartX == null) return;
 const t = e.changedTouches[0];
 if (!t) return;
 const dx = t.clientX - state.touchStartX;
 const dy = t.clientY - state.touchStartY;
 state.touchStartX = null;
 state.touchStartY = null;
 if (Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
 if (dx < 0) goNext(false);
 else goPrev();
}, { passive: true });

window.addEventListener('resize', () => {
 syncTabsPill(false);
 const pane = document.querySelector('#cardSlot .card-pane');
 if (pane) setSlotHeight(pane);
});

loadRead();

document.getElementById('filterBar').addEventListener('click', (e) => {
 const btn = e.target.closest('.filter-chip');
 if (!btn) return;
 if (btn.dataset.level) {
  state.levelFilter = btn.dataset.level;
  document.querySelectorAll('#filterBar [data-level]').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
 }
 if (btn.dataset.topic) {
  state.topicFilter = btn.dataset.topic;
  document.querySelectorAll('#filterBar [data-topic]').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
 }
 state.index = 0;
 renderCard(true);
 renderSheet();
});

requestAnimationFrame(() => {
 syncTabsPill(false);
 mountCard(null);
 updateChrome();
});
</script>
</body>
</html>
