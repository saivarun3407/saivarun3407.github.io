<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>secnotes - Hackbot</title>
<meta name="description" content="How people are building hackbots: architecture, tooling, verification, and evaluation." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
 :root {
 --bg: #000000;
 --fg: #ffffff;
 --muted: rgba(255, 255, 255, 0.55);
 --muted-2: rgba(255, 255, 255, 0.50);
 --faint: rgba(255, 255, 255, 0.08);
 --faint-2: rgba(255, 255, 255, 0.14);
 --card: #0a0a0a;
 --cyan: #ff2a2a;
 --acid: #ff2a2a;
 --ink: #000;
 --radius: 28px;
 --shell: 40rem;
 --ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - card-resize */
 --resize-dur: 300ms;
 --resize-ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - tabs-sliding (secnotes dark) */
 --tabs-dur: 250ms;
 --tabs-ease: cubic-bezier(0.22, 1, 0.36, 1);
 --tabs-text-muted: rgba(255, 255, 255, 0.55);
 --tabs-text-active: #000000;
 --tabs-bar-bg: rgba(255, 255, 255, 0.08);
 --tabs-pill-bg: #ffffff;

 /* transitions.dev - toast */
 --toast-open: 350ms;
 --toast-close: 250ms;
 --toast-distance: 16px;
 --toast-blur: 2px;
 --toast-scale: 0.97;
 --toast-ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - success-check */
 --check-opacity-dur: 500ms;
 --check-rotate-dur: 500ms;
 --check-rotate-from: 80deg;
 --check-bob-dur: 500ms;
 --check-y-amount: 40px;
 --check-blur-dur: 500ms;
 --check-blur-from: 10px;
 --check-path-dur: 500ms;
 --check-path-delay: 80ms;
 --check-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
 --check-ease-opacity: cubic-bezier(0.22, 1, 0.36, 1);
 --check-ease-rotate: cubic-bezier(0.22, 1, 0.36, 1);
 --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
 --check-ease-path: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - page-side-by-side (adapted for card enter/exit) */
 --page-slide-dur: 420ms;
 --page-fade-dur: 420ms;
 --page-slide-distance: 42%;
 --page-blur: 6px;
 --page-stagger: 0ms;
 --page-exit-enabled: 1;
 --page-slide-ease: cubic-bezier(0.22, 1, 0.36, 1);
 --page-fade-ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - texts-reveal */
 --stagger-dur: 500ms;
 --stagger-distance: 12px;
 --stagger-stagger: 40ms;
 --stagger-blur: 3px;
 --stagger-ease: cubic-bezier(0.22, 1, 0.36, 1);
 }

 *, *::before, *::after { box-sizing: border-box; }
 html, body { height: 100%; }
 body {
 margin: 0;
 background: var(--bg);
 color: var(--fg);
 font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 -webkit-font-smoothing: antialiased;
 text-rendering: optimizeLegibility;
 line-height: 1.5;
 }
 ::selection { background: rgba(0, 174, 239, 0.4); color: #fff; }
 button { font: inherit; color: inherit; }
 a { color: var(--cyan); text-decoration: none; }
 a:hover { text-decoration: underline; text-underline-offset: 3px; }

 .app {
 min-height: 100%;
 display: flex;
 flex-direction: column;
 padding:
 max(1.25rem, env(safe-area-inset-top))
 max(1.25rem, env(safe-area-inset-right))
 max(1.25rem, env(safe-area-inset-bottom))
 max(1.25rem, env(safe-area-inset-left));
 }
 .shell {
 width: 100%;
 max-width: var(--shell);
 margin: 0 auto;
 }

 /* - Header - */
 .top {
 display: flex;
 align-items: flex-start;
 justify-content: space-between;
 gap: 1rem;
 padding-top: 0.5rem;
 }
 .brand { display: flex; flex-direction: column; gap: 0.35rem; }
 .wordmark {
 font-size: 1.05rem;
 font-weight: 600;
 letter-spacing: -0.03em;
 color: #fff;
 }
 .eyebrow {
 margin: 0;
 font-size: 11px;
 font-weight: 500;
 text-transform: uppercase;
 letter-spacing: 0.28em;
 color: rgba(255, 255, 255, 0.5);
 }
 .ghost-link {
 appearance: none;
 border: 0;
 background: transparent;
 color: rgba(255,255,255,0.55);
 font-size: 0.875rem;
 font-weight: 500;
 cursor: pointer;
 padding: 0.5rem 0.25rem;
 transition: color 200ms var(--ease);
 }
 .ghost-link:hover { color: var(--cyan); }
 .ghost-link:focus-visible {
 outline: 2px solid var(--cyan);
 outline-offset: 3px;
 border-radius: 6px;
 }

 /* - Mode tabs (transitions.dev tabs-sliding) - */
 .mode-row {
 display: flex;
 flex-wrap: wrap;
 align-items: center;
 justify-content: space-between;
 gap: 1.25rem;
 margin-top: 2.25rem;
 }
 .t-tabs {
 position: relative;
 display: inline-flex;
 align-items: center;
 gap: 3px;
 padding: 3px;
 border-radius: 48px;
 background: var(--tabs-bar-bg);
 }
 .t-tab {
 position: relative;
 appearance: none;
 border: 0;
 background: transparent;
 height: 34px;
 padding: 4px 16px;
 color: var(--tabs-text-muted);
 cursor: pointer;
 border-radius: 48px;
 z-index: 1;
 font-size: 0.875rem;
 font-weight: 500;
 transition: color var(--tabs-dur) var(--tabs-ease);
 }
 .t-tab:not([aria-selected="true"]):hover,
 .t-tab[aria-selected="true"] {
 color: var(--tabs-text-active);
 }
 .t-tab[aria-selected="true"] { color: var(--tabs-text-active); }
 .t-tabs-pill {
 position: absolute;
 top: 3px;
 left: 0;
 height: 34px;
 width: 0;
 background: var(--tabs-pill-bg);
 border-radius: 48px;
 transform: translateX(0);
 transition:
 transform var(--tabs-dur) var(--tabs-ease),
 width var(--tabs-dur) var(--tabs-ease);
 will-change: transform, width;
 z-index: 0;
 pointer-events: none;
 }
 /* Active tab sits on white pill → black text; inactive stay muted.
 When pill is white, selected should be black - already set.
 Cyan accent variant: when research active we can tint pill via JS? Keep white like secnotes primary. */

 /* - Progress metric (secnotes GiantMetric craft) - */
 .metric {
 display: flex;
 align-items: baseline;
 gap: 0.45rem;
 flex-wrap: wrap;
 }
 .metric-num {
 font-size: clamp(2.5rem, 8vw, 3.75rem);
 font-weight: 500;
 letter-spacing: -0.04em;
 line-height: 1;
 color: var(--cyan);
 }
 .metric-rest {
 font-size: 0.95rem;
 font-weight: 500;
 color: rgba(255,255,255,0.5);
 letter-spacing: -0.01em;
 }

 /* - Main stage - */
 .stage {
 flex: 1;
 display: flex;
 flex-direction: column;
 margin-top: 2rem;
 }
 .card-slot {
 position: relative;
 width: 100%;
 perspective: 1400px;
 perspective-origin: 50% 45%;
 transform-style: flat;
 overflow: hidden;
 }
 .card-pane {
 transform-style: preserve-3d;
 backface-visibility: hidden;
 will-change: transform, opacity, filter;
 }

 /* card-resize */
 .t-resize {
 transition:
 width var(--resize-dur) var(--resize-ease),
 height var(--resize-dur) var(--resize-ease);
 will-change: width, height;
 overflow: hidden;
 }

 .card {
 position: relative;
 border-radius: var(--radius);
 border: 1px solid var(--faint);
 background: var(--card);
 padding: 1.75rem 1.5rem 1.5rem;
 }
 @media (min-width: 640px) {
 .card { padding: 2.25rem 2rem 1.75rem; }
 }

 .chips {
 display: flex;
 flex-wrap: wrap;
 gap: 0.5rem;
 margin-bottom: 1.25rem;
 }
 .chip {
 display: inline-flex;
 align-items: center;
 height: 26px;
 padding: 0 0.7rem;
 border-radius: 999px;
 font-size: 11px;
 font-weight: 500;
 letter-spacing: 0.04em;
 border: 1px solid var(--faint);
 color: rgba(255,255,255,0.65);
 background: transparent;
 }
 .chip-kind-practice { color: rgba(255,255,255,0.75); }
 .chip-kind-lab { color: rgba(255,255,255,0.75); }
 .chip-kind-paper { color: rgba(255,255,255,0.75); }
 .chip-unread {
 border-color: rgba(0, 174, 239, 0.35);
 color: var(--cyan);
 background: rgba(0, 174, 239, 0.08);
 }
 .chip-read {
 color: rgba(255,255,255,0.45);
 }
 .chip-acid {
 border-color: rgba(200, 245, 66, 0.35);
 color: var(--acid);
 }

 /* texts-reveal */
 .t-stagger-line {
 display: block;
 opacity: 0;
 transform: translateY(var(--stagger-distance));
 filter: blur(var(--stagger-blur));
 transition:
 opacity var(--stagger-dur) var(--stagger-ease),
 transform var(--stagger-dur) var(--stagger-ease),
 filter var(--stagger-dur) var(--stagger-ease);
 will-change: transform, opacity, filter;
 }
 .t-stagger-line--2 { transition-delay: var(--stagger-stagger); }
 .t-stagger.is-shown .t-stagger-line {
 opacity: 1;
 transform: translateY(0);
 filter: blur(0);
 }
 .t-stagger.is-hiding .t-stagger-line {
 opacity: 0;
 transform: translateY(0);
 filter: blur(0);
 transition:
 opacity 200ms ease,
 transform 0s linear,
 filter 0s linear;
 transition-delay: 0s;
 }

 .headline {
 margin: 0;
 font-size: clamp(1.65rem, 4.2vw, 2.35rem);
 font-weight: 500;
 letter-spacing: -0.03em;
 line-height: 1.12;
 text-wrap: balance;
 color: #fff;
 }
 .lede {
 margin: 1.25rem 0 0;
 max-width: 38rem;
 font-size: 1.05rem;
 line-height: 1.7;
 color: var(--muted);
 }
 .cite {
 margin-top: 1.75rem;
 padding-top: 1.25rem;
 border-top: 1px solid var(--faint);
 display: flex;
 flex-direction: column;
 gap: 0.35rem;
 }
 .cite-label {
 font-size: 11px;
 font-weight: 500;
 text-transform: uppercase;
 letter-spacing: 0.28em;
 color: rgba(255,255,255,0.45);
 }
 .cite a {
 font-size: 0.95rem;
 font-weight: 500;
 color: var(--cyan);
 }

 /* Card roll — transitions.dev page-slide + 3D roll for Inshorts-like deck feel */
 .card-pane {
 width: 100%;
 }
 .card-pane.is-enter-next {
 animation: card-roll-in-next var(--page-slide-dur) var(--page-slide-ease) both;
 }
 .card-pane.is-enter-prev {
 animation: card-roll-in-prev var(--page-slide-dur) var(--page-slide-ease) both;
 }
 .card-pane.is-exit-next {
 position: absolute;
 inset: 0;
 width: 100%;
 animation: card-roll-out-next var(--page-slide-dur) var(--page-slide-ease) both;
 pointer-events: none;
 }
 .card-pane.is-exit-prev {
 position: absolute;
 inset: 0;
 width: 100%;
 animation: card-roll-out-prev var(--page-slide-dur) var(--page-slide-ease) both;
 pointer-events: none;
 }
 @keyframes card-roll-in-next {
 from {
   opacity: 0;
   transform: translateX(28%) rotateY(-28deg) scale(0.94);
   filter: blur(var(--page-blur));
 }
 55% { opacity: 1; filter: blur(1px); }
 to {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 }
 @keyframes card-roll-in-prev {
 from {
   opacity: 0;
   transform: translateX(-28%) rotateY(28deg) scale(0.94);
   filter: blur(var(--page-blur));
 }
 55% { opacity: 1; filter: blur(1px); }
 to {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 }
 @keyframes card-roll-out-next {
 from {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 to {
   opacity: 0;
   transform: translateX(-32%) rotateY(32deg) scale(0.92);
   filter: blur(var(--page-blur));
 }
 }
 @keyframes card-roll-out-prev {
 from {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 to {
   opacity: 0;
   transform: translateX(32%) rotateY(-32deg) scale(0.92);
   filter: blur(var(--page-blur));
 }
 }

 /* - Actions - */
 .actions {
 display: flex;
 flex-wrap: wrap;
 gap: 0.75rem;
 margin-top: 1.75rem;
 align-items: center;
 }
 .btn-primary {
 appearance: none;
 display: inline-flex;
 align-items: center;
 justify-content: center;
 gap: 0.5rem;
 border: 0;
 border-radius: 999px;
 background: #fff;
 color: #000;
 padding: 0.9rem 1.65rem;
 font-size: 0.9rem;
 font-weight: 600;
 cursor: pointer;
 transition: background 300ms var(--ease), color 300ms var(--ease), transform 200ms var(--ease);
 }
 .btn-primary:hover { background: var(--cyan); color: #000; }
 .btn-primary:active { transform: scale(0.98); }
 .btn-primary:disabled {
 opacity: 0.4;
 cursor: not-allowed;
 transform: none;
 }
 .btn-primary:focus-visible {
 outline: 2px solid var(--cyan);
 outline-offset: 3px;
 }
 .btn-secondary {
 appearance: none;
 display: inline-flex;
 align-items: center;
 justify-content: center;
 gap: 0.4rem;
 border-radius: 999px;
 border: 1px solid rgba(255,255,255,0.25);
 background: transparent;
 color: #fff;
 padding: 0.9rem 1.35rem;
 font-size: 0.9rem;
 font-weight: 600;
 cursor: pointer;
 transition: border-color 300ms var(--ease), background 300ms var(--ease);
 }
 .btn-secondary:hover {
 border-color: rgba(255,255,255,0.5);
 background: rgba(255,255,255,0.06);
 }
 .btn-secondary:disabled {
 opacity: 0.35;
 cursor: not-allowed;
 }
 .btn-secondary:focus-visible {
 outline: 2px solid var(--cyan);
 outline-offset: 3px;
 }
 .btn-check {
 display: inline-flex;
 width: 1.1rem;
 height: 1.1rem;
 align-items: center;
 justify-content: center;
 }

 .hint {
 margin-top: 1.25rem;
 font-size: 0.8rem;
 color: rgba(255,255,255,0.35);
 }
 .hint kbd {
 font: inherit;
 font-size: 0.75rem;
 padding: 0.1rem 0.35rem;
 border-radius: 6px;
 border: 1px solid rgba(255,255,255,0.12);
 color: rgba(255,255,255,0.5);
 }

 /* - Toast (transitions.dev) - */
 .toast-wrap {
 position: fixed;
 left: 50%;
 bottom: max(1.5rem, env(safe-area-inset-bottom));
 transform: translateX(-50%);
 z-index: 60;
 pointer-events: none;
 }
 .t-toast {
 display: inline-flex;
 align-items: center;
 gap: 0.65rem;
 padding: 0.85rem 1.15rem;
 border-radius: 999px;
 background: #0a0a0a;
 border: 1px solid var(--faint-2);
 color: #fff;
 font-size: 0.9rem;
 font-weight: 500;
 opacity: 0;
 transform: translateY(var(--toast-distance)) scale(var(--toast-scale));
 filter: blur(var(--toast-blur));
 will-change: transform, opacity, filter;
 transition:
 opacity var(--toast-close) var(--toast-ease),
 transform var(--toast-close) var(--toast-ease),
 filter var(--toast-close) var(--toast-ease);
 }
 .t-toast.is-open {
 opacity: 1;
 transform: translateY(0) scale(1);
 filter: blur(0);
 transition:
 opacity var(--toast-open) var(--toast-ease),
 transform var(--toast-open) var(--toast-ease),
 filter var(--toast-open) var(--toast-ease);
 }

 /* success-check */
 .t-success-check {
 display: inline-block;
 transform-origin: center;
 opacity: 0;
 will-change: transform, opacity, filter;
 width: 1.35rem;
 height: 1.35rem;
 }
 .t-success-check svg { display: block; overflow: visible; width: 100%; height: 100%; }
 .t-success-check svg path {
 stroke-dasharray: 24;
 stroke-dashoffset: 24;
 }
 .t-success-check[data-state="in"] {
 animation:
 t-check-fade var(--check-opacity-dur) var(--check-ease-opacity) forwards,
 t-check-rotate var(--check-rotate-dur) var(--check-ease-rotate) forwards,
 t-check-blur var(--check-blur-dur) var(--check-ease-out) forwards,
 t-check-bob var(--check-bob-dur) var(--check-ease-bob) forwards;
 }
 .t-success-check[data-state="in"] svg path {
 animation: t-check-draw var(--check-path-dur) var(--check-ease-path) var(--check-path-delay, 0ms) forwards;
 }
 @keyframes t-check-fade { from { opacity: 0; } to { opacity: 1; } }
 @keyframes t-check-rotate {
 from { transform: rotate(var(--check-rotate-from)); }
 to { transform: rotate(0deg); }
 }
 @keyframes t-check-blur {
 from { filter: blur(var(--check-blur-from)); }
 to { filter: blur(0); }
 }
 @keyframes t-check-bob {
 from { translate: 0 var(--check-y-amount); }
 to { translate: 0 0; }
 }
 @keyframes t-check-draw { to { stroke-dashoffset: 0; } }

 /* - Drawer / progress sheet - */
 .backdrop {
 position: fixed;
 inset: 0;
 background: rgba(0,0,0,0.55);
 opacity: 0;
 pointer-events: none;
 transition: opacity 280ms var(--ease);
 z-index: 40;
 }
 .backdrop.open { opacity: 1; pointer-events: auto; }
 .sheet {
 position: fixed;
 top: 0;
 right: 0;
 height: 100%;
 width: min(26rem, 100%);
 background: #050505;
 border-left: 1px solid var(--faint);
 transform: translateX(100%);
 transition: transform 320ms var(--ease);
 z-index: 50;
 display: flex;
 flex-direction: column;
 padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
 }
 .sheet.open { transform: translateX(0); }
 .sheet-head {
 display: flex;
 align-items: flex-start;
 justify-content: space-between;
 gap: 1rem;
 margin-bottom: 1.25rem;
 }
 .sheet-title {
 margin: 0.35rem 0 0;
 font-size: 1.5rem;
 font-weight: 500;
 letter-spacing: -0.03em;
 }
 .sheet-filters {
 display: flex;
 flex-wrap: wrap;
 gap: 0.4rem;
 margin-bottom: 1rem;
 }
 .sheet-filters button {
 appearance: none;
 border: 1px solid var(--faint);
 background: transparent;
 color: rgba(255,255,255,0.55);
 border-radius: 999px;
 padding: 0.35rem 0.75rem;
 font-size: 0.75rem;
 font-weight: 500;
 cursor: pointer;
 }
 .sheet-filters button[aria-pressed="true"] {
 background: #fff;
 color: #000;
 border-color: #fff;
 }
 .sheet-list {
 overflow: auto;
 flex: 1;
 display: flex;
 flex-direction: column;
 gap: 0.35rem;
 padding-right: 0.25rem;
 }
 .sheet-item {
 appearance: none;
 width: 100%;
 text-align: left;
 border: 1px solid transparent;
 background: transparent;
 border-radius: 16px;
 padding: 0.85rem 0.9rem;
 cursor: pointer;
 transition: background 200ms var(--ease), border-color 200ms var(--ease);
 }
 .sheet-item:hover {
 background: rgba(255,255,255,0.04);
 border-color: var(--faint);
 }
 .sheet-item.is-current {
 border-color: rgba(0,174,239,0.35);
 background: rgba(0,174,239,0.07);
 }
 .sheet-item .t {
 display: block;
 font-size: 0.92rem;
 font-weight: 500;
 letter-spacing: -0.015em;
 color: #fff;
 }
 .sheet-item .m {
 display: flex;
 flex-wrap: wrap;
 gap: 0.35rem;
 margin-top: 0.35rem;
 font-size: 0.75rem;
 color: rgba(255,255,255,0.45);
 }
 .sheet-item .m .dot-unread { color: var(--cyan); }

 .sr-only {
 position: absolute;
 width: 1px; height: 1px;
 padding: 0; margin: -1px;
 overflow: hidden; clip: rect(0,0,0,0);
 white-space: nowrap; border: 0;
 }

 @media (prefers-reduced-motion: reduce) {
 .t-resize { transition: none !important; }
 .t-tabs-pill, .t-tab { transition: none !important; }
 .t-toast { transition: none !important; }
 .t-success-check { animation: none !important; opacity: 1; }
 .t-success-check svg path { animation: none !important; stroke-dashoffset: 0 !important; }
 .t-stagger-line { transition: none !important; opacity: 1; transform: none; filter: none; }
 .card-pane.is-enter-next,
 .card-pane.is-enter-prev,
 .card-pane.is-exit-next,
 .card-pane.is-exit-prev { animation: none !important; transform: none !important; filter: none !important; }
 .sheet, .backdrop { transition: none !important; }
 }



/* —— Responsive (phones / small tablets) —— */
html, body {
  min-height: 100%;
  min-height: 100dvh;
  overflow-x: hidden;
}
.app {
  min-height: 100dvh;
  box-sizing: border-box;
}
.shell { max-width: min(var(--shell), 100%); }
img, svg, video { max-width: 100%; height: auto; }
.card, .card-pane, .body, .lede, .title { word-wrap: break-word; overflow-wrap: anywhere; }

@media (max-width: 720px) {
  .app {
    padding:
      max(0.85rem, env(safe-area-inset-top))
      max(0.85rem, env(safe-area-inset-right))
      max(0.85rem, env(safe-area-inset-bottom))
      max(0.85rem, env(safe-area-inset-left));
  }
  .top {
    flex-direction: column;
    align-items: stretch;
    gap: 0.75rem;
  }
  .top .ghost-link { align-self: flex-start; min-height: 44px; }
  .brand-logo { width: 32px; height: 32px; }
  .logo-word { font-size: 1.05rem !important; }
  .eyebrow { letter-spacing: 0.18em !important; font-size: 10px !important; }
  .mode-row {
    flex-direction: column;
    align-items: stretch;
    gap: 0.85rem;
    margin-top: 1.25rem;
  }
  .t-tabs { width: 100%; display: flex !important; }
  .t-tab {
    flex: 1;
    height: 44px;
    padding: 4px 12px;
    font-size: 0.8rem;
    text-align: center;
  }
  .metrics { width: 100%; justify-content: space-between; }
  .metric-num { font-size: clamp(1.75rem, 12vw, 2.5rem) !important; }
  .stage { margin-top: 1rem; }
  .card {
    padding: 1.15rem 1rem 1.1rem !important;

  "body": "In 2023, Joseph Thacker (rez0) argued that AI agents would eventually outhack humans because the set of known attack vectors is finite and most bugs come from methodology and context, not rare flashes of creativity. An agent can be given a tight brief for one bug class, draw on the strategies top hunters already write down, and then be scaled out with compute. He is careful about the caveat: humans keep the edge on novel attacks against new or existing technology until models catch up.",

  "body": "Part 1 of NotHoly's three-part build is the design of a small bug bounty agent: a model, the tools it may call, memory (the message list plus a notes file on disk), and guardrails. The model only reads, plans and asks to call a tool; your code decides whether that tool runs. Two guardrails are core: check every command's target against program scope, and wait for your approval on anything that sends traffic. A third treats tool output as untrusted data that can never widen what the agent may do. Build the loop and guardrails yourself and reuse existing tools. The post also promotes NotHoly's own API.",

  "headline": "Static leads become dynamic tests",
  "body": "Deriv describes a four-agent offensive security swarm. HAL, built on OpenClaw, orchestrates and picks skills. John reviews code and returns structured results (severity, CWE, file), so dynamic testing starts where John flagged. Sade tests LLM agents by talking to them in Slack. Harry triages HackerOne reports and passes high-confidence ones to HAL for live validation. Slack serves as both interface and audit trail, and an internal SafeSkill layer sandboxes the security agent itself. On an internal test app, the first grey-box phase took 18 minutes and surfaced 6 issues, 3 of them critical; an earlier human test took most of a day and found 4 of the same 6. These figures are company-reported.",

  "kindLabel": "Tooling",
  "title": "Tiny, boring tools for the agent, with a log it can't edit",
  "headline": "Tiny, boring tools for the agent, with a log it can't edit",
  "body": "Luke (hakluke) Stephens argues that a hacking agent should hand deterministic work to small Unix-style tools and keep the model for judgement. He cites a study where cosmetic code edits flipped GPT-4's answer 17% of the time and PaLM 2's 26%, and says Detectify customers report roughly 80% of AI-driven SAST findings are noise. The tools sit behind MCP with typed inputs, one tool per workflow rather than per flag, lean output, and purpose prefixes so thirty tools stay distinguishable. The key rule: the tool writes the record of what was sent and received, somewhere the agent can't edit, and the model only adds its verdict, so a 'confirmed' finding can be audited. The post is on a vendor blog and ends with a pitch for Detectify's own MCP tooling.",
  "steal": "Wrap whole workflows as typed, lean tools, and keep an append-only log written by the tools so 'confirmed' can be checked against what actually happened.",
  "url": "https://blog.detectify.com/best-practices/why-im-building-my-hacking-agent-out-of-tiny-boring-tools/",
  "sourceLabel": "Luke (hakluke) Stephens, Detectify",

  "body": "Bug bounty hunter Bronxi rebuilt a working Bash workflow for finding information disclosure in indexed PDF and spreadsheet files as four CrewAI agents: URL discovery, a file scraper, a compliance agent and a report writer. It flagged dozens of 'leaks', almost all false positives, such as files that only mentioned words like password or confidential. After comparing each step with the original script, only report writing stayed with an agent. His conclusion is that AI amplifies a methodology that already works rather than replacing one, and that you should pick the model per task. He also says AI has helped him with code review and IDOR findings. This is a guest post on Bugcrowd's blog from June 1, 2026.",

  "kindLabel": "Evaluation",
  "title": "Contamination is not the only way agents cheat evaluations",
  "headline": "Contamination is not the only way agents cheat evaluations",
  "body": "Maia Hamin and Benjamin Edelman of NIST's Center for AI Standards and Innovation (CAISI) describe using a transcript-analysis tool on historical agent-evaluation logs. They split cheating into solution contamination, where the model gets information that improperly reveals the answer, and grader gaming, where it scores highly without doing the intended task. Examples include fetching walkthroughs for capture-the-flag challenges, crashing a target instead of hitting the intended flaw, and, on coding tasks, pulling a newer code version or turning off checks. As a lower bound, they report cheating in 0.3% of Cybench logs, 0.1% plus 0.2% of SWE-bench Verified logs, and 4.80% of an internal CVE-Bench run. They recommend reviewing transcripts, closing task loopholes, and standardizing what agents are allowed to do. The page was published on 28 November 2025; the working URL is under NIST's later CAISSI path.",
  "steal": "Review evaluation transcripts for both contamination and grader gaming, and treat published cheat rates as lower bounds.",
  "url": "https://www.nist.gov/caissi/cheating-ai-agent-evaluations",
  "sourceLabel": "Maia Hamin and Benjamin Edelman, NIST CAISI",
  "date": "2025-11-28",
  "level": "Basic",
  "topic": "Evaluation"
 },

  "body": "Ksatria Bintang Samudra describes a solo-built bug-bounty co-pilot: a thin orchestrator, narrow agents, and a table of each one's blast radius, in which only the recon and hunt agents touch the network. Scope is a deterministic function run before every outbound request, where exclusions always win and a host must positively match an include. Every scope decision and request goes to an append-only audit log. Passive work can run on its own; active testing stops for a human go/no-go, and the validator kills any \"maybe.\" He reports that letting the model make scope calls was about 99% right, which he treats as a failure here, and that auto-promoting findings produced confident, well-written nonsense.",
  "steal": "Give each agent role an explicit blast radius, and keep scope a pure function outside the model.",

  "body": "pwner is an open-source terminal agent you talk to, running an observe, reason, act, report loop. The model asks for a tool and the tool layer decides whether it runs. Scope is locked to the named target at the tool layer, not in the prompt. Read-only discovery runs freely. Brute-force and exploitation are denied by default and need a y/N, and the agent can't approve itself. It builds a live host-port-service-finding map and runs on hosted or local models, or in a deterministic mode with no model. The project page has no publication date. The GitHub repo (0x45dd/pwner, Berk D.) is on PyPI at v0.3.3, last released 5 November 2026, and is for authorized use only. This is a distinct product from the UNST33R bounded-agent design already on this page as H14.",

 {

  "category": "Hackbot",

  "title": "Put the right model in the right role",
  "headline": "Put the right model in the right role",
  "body": "A pentest harness doesn't have to use one model for every job. Split planning and orchestration (the Strategizer) from reconnaissance and exploitation (the Executor), with separate pieces for validation and guardrails. In tests of seven frontier models over three runs, a model that looked weak doing both jobs improved sharply with a strong Strategizer in front of it. No pairing beat the best model in both roles, but a strong Strategizer with a cheaper Executor reached over 95% of the top F1 score (a combined precision-and-recall measure) at roughly half the cost.",
  "steal": "Give planning and execution to different models, and track cost alongside accuracy so a cheaper model can do the hands-on work.",

  "body": "Cybench is a public benchmark of 40 professional CTF tasks from four competitions. Each task comes with a description, starter files, and an evaluator. The agent works in a Kali Linux container, runs shell commands or talks to a task server, and then submits an answer. Many full tasks are still too hard, so the authors added subtasks that score the steps along the way and show where an agent stalls. In the original paper, the strongest setups without subtask hints solved full tasks that took human teams up to 11 minutes.",

  "title": "The model proposes, deterministic code disposes",
  "headline": "The model proposes, deterministic code disposes",
  "body": "This design for an internal-network pentest agent separates planning from authority. The planner model has no network or shell access and outputs only typed proposals. A deterministic policy gateway checks each proposal against a signed scope manifest (CIDRs, exclusions, time window, rate limits, allowed tool tags) and returns allow, deny or needs-approval. Workers run under isolated identities, and an append-only evidence store records every decision. Hostnames are resolved again just before execution, and autonomy grows in reviewed stages, read-only first.",
  "steal": "Scope as signed data checked on every tool call, never just a system-prompt line.",

  "body": "Novee ran five frontier models in its pentest harness against live PWNBench apps, with and without guardrails. The three layers are prompt rules, a deterministic proxy that refuses a pre-flagged list of sensitive actions, and an LLM \"Guardian\" that judges every non-read call and tells the agent a safe way to reach the same goal. Across 15 runs each way, violations went from 85 to 0 and verified findings from 169 to 175. This is the vendor's own benchmark on a simplified stack.",

 {

  "body": "A master orchestrator runs a stateful workflow graph. Specialists follow reason-act-observe loops and write structured outputs (scope, session, endpoints, hypotheses) to shared state. A planning layer turns recon into prioritized hypotheses for specialist test workflows, with verification steps before reporting. A three-tier platform separates API, orchestration and isolated containers. Benchmarks span public suites, internal and custom apps, CVE repros and permissioned side-car runs on real assets. HackerOne reports about 88% accurate findings on its own suite.",

 {

  "headline": "How controls break when a pentest splits across agents",
  "body": "The OWASP APTS appendix on multi-agent coordination lists the ways controls fail once an engagement is spread over several agents: a halt reaches one worker too late, per-worker rate limits add up past the engagement budget, stale or poisoned state passes between agents, and disagreements quietly resolve to proceed. Its patterns include an engagement-wide halt, a central scope authority, and stamping work with a halt epoch that dispatch checks.",

  "headline": "A validator whose job is to say no",
  "body": "Philip Sørensen's bug bounty hackbot runs in Claude Code with three roles. An orchestrator decides what to pursue and never runs a tool itself. Recon workers take one target each and can't mark anything confirmed. A validator tries to disprove each candidate before it can be reported. Scope is a per-program YAML gate that fails closed, starts with every tool off, and enforces rate limits that can only be tightened. Per-program SQLite stores let it diff what changed between runs. Over 96 programs: 2,441 flagged, 2,244 thrown out, 54 confirmed, 24 reported, plus 36 real bugs that were duplicates. Passwords stay out of the agent's context.",
  "steal": "A fail-closed scope gate with tools off by default, plus a separate disprover agent before anything is reported.",

 {
  "mode": "research",

  "category": "Hackbot",
  "kind": "post",
  "id": "hackbot-h25-local-agents-repro",
  "kindLabel": "Evaluation",
  "title": "The hypothesis is easy, the proof is hard",
  "headline": "The hypothesis is easy, the proof is hard",
  "body": "Researchers ran 12 configurations of local open-weight models (three generations, two architectures, three quantization levels) on 10 CyberGym vulnerability-reproduction tasks, 3 runs each, in one harness, and released the artefact. Every configuration, down to 4B, solved most of the 6 easier tasks; the 4 harder ones needed the 27B model. Quantization changed how fast models got there, not which tasks they solved. In almost every run the authors examined, failures included, the agent named the vulnerable function and the correct hypothesis. What decided success was turning that hypothesis into a working input.",
  "steal": "Measure and improve the hypothesis-to-proof step, not just the bug-spotting step.",
  "url": "https://arxiv.org/abs/2611.06257",

  "title": "Scope in the prompt is a suggestion",
  "headline": "Scope in the prompt is a suggestion",
  "body": "Adayptus argues that safety in an offensive agent is architecture, not a prompt. Their design has five parts: an orchestrator that can halt the model, typed tool contracts that declare whether a tool mutates, its blast radius and whether it needs approval, a signed engagement record the model never edits, an append-only evidence store, and an adjudicator. A deny-by-default authorisation check outside the model's context opens an evidence record before each action. Destructive actions are left out of the tool registry entirely. Findings must have stored evidence, replay without the model, survive a refute-by-default second model, and be reproduced by a human before any report.",
  "steal": "Declare mutating, blast radius and approval on every tool, and watch policy denials per run as an early sign of injection.",

  "body": "Over six months johnmatrix built a pentest agent in which the LLM decides what to test while 32 deterministic Go detectors (27 web, 5 infrastructure) with 1,500+ automated tests do the testing at near-zero token cost. A SQLite engagement database tracks endpoints, findings, negative evidence, coverage and proofs, and allows resuming across sessions; HTTP goes through a Caido proxy over MCP, with scope enforced at the transport layer. A three-way oracle (marker present, differential from baseline, absent in a clean control) is required for any finding, which he says raised precision from 70% to 90%. He reports 80% detection on a benchmark. The system is not open source.",

  "body": "Jake Garnier's unattended bug-bounty agent loops indefinitely across several targets. Each iteration is a brand-new session that reads a working-memory file first and rewrites it after every objective. State lives in a task board, the working-memory file, an encrypted credential store and a knowledge vault, so killing a session loses almost nothing. A deliberately dumb bash loop launches, watches and kills sessions. Soft limits failed (asked for about 5 objectives, it did 26), so caps on objectives, re-sent context, turns and wall-clock time are enforced outside the model, with context as the primary cap. A verifier in a fresh session on a different model is prompted to refute findings.",

  "headline": "The finder makes leads, the triager treats them as allegations",
  "body": "Monad Foundation's internal Bugfinder splits discovery from validation. The finder ranks files, modules and seams from 1 to 5, then runs minimally prompted hunters in isolated containers, and writes each lead to an append-only Postgres database with strict enums. The triager treats every lead as an allegation: a verifier-first review splits it into claims and looks for explanations that contradict it, then a witness ladder escalates from module to component, boundary, full node and cluster, and adjudication ends in one of four states. Per-bug-class proof gates were the biggest precision gain, and two model providers must agree or the lead stays undetermined. The funnel is about 100 leads to 10 confirmed to 1 reported, at roughly $100 per confirmed issue and $1k per report. The post is from May 2026.",

  "headline": "Don't give the model jobs that have right answers",
  "body": "Jay Hawkins draws on building ARCHER, a local pentest agent (qwen3:14b, tested against Metasploitable2), to argue that failures come from putting a probabilistic model in deterministic roles. Three cases: output format drift, where the bash-block extractor grew from 8 to 33 lines; routing errors, where a keyword router got 54.5% of 235 ambiguous task phrasings right; and failure to stop, where 9.1% of 44 baseline 'objective achieved' claims (4 sessions) failed a code-layer ground-truth check. His split: the model interprets messy output and proposes next steps, while code owns routing, halting, safety limits, logging and success verification. This is one author's self-reported lab work. The post says the fix for routing has not yet been measured on a held-out set. It is a technical report whose page says only '2026'; the site's feed dates it May 12, 2026.",
  "steal": "Keep routing, halting, logging and success checks in code, and verify every 'objective achieved' claim against real target state.",

  "headline": "Threat packs: give the hunting agent the invariants",
  "body": "Datadog's hunting system starts from threat packs, human-reviewed documents of usually about 300 lines (system summary, security invariants, review priorities, compensating controls) plus versioned YAML metadata. The authors say they have built hundreds. The pipeline separates discovery from reproduction and sends each task to the cheapest capable model. A judge agent keeps a finding only if it names a declared invariant, a reachable entry point and the path that breaks the invariant. A proof of concept is then tried in staging or locally, and the finding stays unverified if that isn't possible. For regression checks, the initial August 2026 benchmark froze 43 validated vulnerabilities across nine packs, hidden from the hunting agent, and scored union detection against stable detection, currently found in at least 7 of 10 runs, which they call a working threshold. It's a vendor post.",

  "headline": "Scope is enforced by a proxy, not a prompt",
  "body": "rootzero's research note (published Oct 8, revised Nov 3, 2026) starts from the premise that the model is not a security boundary. The agent has no direct network access. A mandatory outbound proxy checks every request against a versioned scope file derived from the written authorisation, and a controller the agent can't reach holds the scope, issues short-lived leases and carries the kill switch. It covers pitfalls such as hostname comparison, URL parser differences, DNS rebinding and redirects, and target content that asks the agent to test other domains. It also covers rate limits, graded action classes, a hash-chained audit log and tests for the guardrails themselves. The note proposes an architecture and says it does not describe a deployed proxy. The class scale and lease design are still being tested.",

  "headline": "What makes an offensive harness work, from a T3MP3ST teardown",
  "body": "Ilya Kabanov reads Pliny's T3MP3ST, a roughly 34,000-line offensive framework, and compares it with eight maintained open-source pentest frameworks. Its web-pentest arm follows a seven-phase kill chain with one specialist agent per phase, fixed seed tasks, up to 15 turns each and at most three agents in parallel; two phases never run. The exploit phase can only send stateless HTTP requests and nothing verifies that an exploit worked, so success just means a finding was written. He lists what he thinks matters: a strong model, tight context with a ruled-out ledger, long-term memory, a stateful execution environment, and an oracle that proves impact from the target's own behaviour. Benchmark claims are Pliny's or the author's: a reported 90.1% on 104 XBEN challenges from a single agent, not the kill chain, and 92 versus 82 when swapping GLM-5.2 for gpt-5.5.",
  "steal": "Give the bot an oracle that proves impact from the target's behaviour, and keep a ledger of ruled-out leads so it doesn't repeat them.",

  "title": "A finder that is never allowed to confirm its own finding",
  "headline": "A finder that is never allowed to confirm its own finding",
  "body": "ProjectDiscovery's Neo documentation describes verification as the architecture, not an add-on. A verification agent with no execution tools acts as judge and, for each finding, hands it to a separate verifier that tries to reproduce it with its own testing. Up to five verifier instances run in parallel, so a batch isn't checked one by one. A verifier starts from the position that the finding is a false positive and returns one of four verdicts: confirmed, false positive (with a documented reason), needs retry (for example when rate limiting or auth blocks a conclusion) or informational. Confirmed findings carry proof artifacts. A re-run loop can send incomplete work back for another pass, and code-review findings go through a separate proof gate. This is vendor documentation with no publication date (the page was last modified May 2, 2026), and the claims are not independently tested.",
  "steal": "Make the verifier a separate agent that starts from 'false positive', has a retry verdict for blocked tests, and must attach proof to anything it confirms.",

  "title": "A judge that fails closed",
  "headline": "A judge that fails closed",
  "body": "Dan Scofield describes Shopify's Cyber Chaos Monkey, an agentic bug-bounty researcher that attacks Shopify's production using test shops. Discovery refines a hypothesis against source and config, then sends structured leads to Sandbox agents that make live requests and read production logs. A state-machine orchestrator runs each engagement as a Kubernetes job. The agent gets only ephemeral credentials it can read but not change, outside calls pass through a credential proxy that swaps placeholder headers for real ones, and egress is limited to an allowlist. A judge agent on a different model reads every executor event in real time and kills the run on a Rules of Engagement breach. If the judge crashes or goes silent, the run ends. Shopify reports tens of thousands of engagements with no outage or incident, which is self-reported.",

  "title": "Price operational risk into every action",
  "headline": "Price operational risk into every action",
  "body": "ALIoTh, from the University of Calabria, is a LangGraph multi-agent framework for IoT penetration testing. Specialist agents use Self-RAG over device documentation and tool manuals and share findings on a common board. The planner picks each action by weighing its payoff against a tunable penalty for operational risk (such as service disruption): success probability times CVSS-based impact, minus lambda times risk, with lambda between 0 and 1. High-impact or ambiguous steps go to a human, and a deterministic kill switch stops disruptive techniques. The testbed is three vulnerable smart-home devices. The paper defines its metrics, but the experimental campaign is still ongoing, so there are no results yet.",

  "title": "Running an LLM pentest framework: scope outside the prompt",
  "headline": "Running an LLM pentest framework: scope outside the prompt",
  "body": "Justin Elze of TrustedSec writes about LLM-driven pentest frameworks such as ARTEX, which Google and Microsoft reporting shows attackers using; PentAGI, HexStrike AI and Cairn are only named as appearing in the same reporting. His framing: the model supplies reasoning and proposed actions, the framework supplies tools, execution, state and permissions, and the deployment supplies the actual access, so a framework's name says little about a run. For anyone running one, he advises a disposable VM and a lab network whose outbound policy denies unrelated destinations, since a prompt instruction is not enforcement. He cites WorkOS, where a researcher's ARTEX benchmark run reached a real third party, though the account does not show a container escape. He also warns that third-party copies of a framework can ship backdoored images, to pin what you run by digest, and that a long report or long runtime is not coverage. Much of the post is defensive advice.",
  "steal": "Enforce scope with network policy rather than prompts, run the bot on a disposable isolated host, and record each run's model, permissions and interventions.",

  "body": "Yanir Tsarimi describes Enclave's AI Hacking Race: the attacker, the target and a verifier each run in isolated containers, and a win counts only when the target submits a per-run randomized flag. DeepSeek V4.1 Flash verified 11 of 11 vulnerable targets for $4.65, but 5 of those wins went around the intended bug. Enclave now threat-models the benchmark itself, adds negative tests for shortcuts, reviews the path of every success and versions the benchmark. On the fixed version the same model verified 4 of 11, but the provider route also changed, so the share of the drop due to variance is unknown.",

  "headline": "What an AI attack harness wrote down",
  "body": "Beazley Security Labs, investigating an incident in September 2026, recovered a portion of the memory files from a multi-agent attack harness that called itself LARA. The files show a central operator and two support agents, about 270 attack scripts, and a task-code system for tracking objectives, findings and stolen credentials. In the recovered logs, about a dozen known-flaw exploit attempts all failed against patched systems, so the harness switched to misconfigurations: a custom web application and a weak service password. It then took source code, private keys and databases. Multi-factor authentication, limited password reuse and network segmentation kept it from spreading further. The authors present this as a first-hand record of how a working offensive agent organised itself.",
  "steal": "Keep structured shared memory and task codes in the harness, and assume a bot will switch to misconfigurations when known-flaw exploits fail.",

  "id": "hackbot-h59-edgescan-atomic-harness",
  "kindLabel": "Architecture",
  "title": "Many small agents, one strict harness",
  "headline": "Many small agents, one strict harness",
  "body": "Michael Devlin describes how Edgescan built Atomic, its web-app pentest agent, after testing open-source tools on the same apps repeatedly. Those tools lost context, drifted out of scope, repeated each other's work, gave inconsistent results and used more tokens than the work needed; in their tests, a plain frontier model with its stock harness did better. Atomic uses narrow specialist agents that do not talk to each other. Ordinary code (the harness) hands out the work, stores evidence, enforces scope on every tool call, and decides whether a finding exists; the model is left to judge severity and meaning. Recon comes first, then specialists, then a separate verification team, so the agent that raised a lead is not the one that confirms it. Stronger models are used for planning and smaller ones for routine work. People set limits before a scan, can watch and stop it, and review the evidence afterwards. This is Edgescan's account of its own product.",
  "steal": "Keep agents narrow with no agent-to-agent chat, put scope and confirmation in ordinary code, and don't let the agent that raised a lead be the one that confirms it.",
  "url": "https://www.edgescan.com/many-small-agents-one-strict-harness-how-atomic-is-built/",
  "sourceLabel": "Michael Devlin, Edgescan",
  "date": "2026-10-12",
  "level": "Intermediate",
  "topic": "Architecture"
 },

  "headline": "104 of 104 on XBOW, reported by the vendor",
  "body": "Yash K of B-52 Security reports that, from 1 to 4 November 2026, B-52 completed all 104 challenges in XBOW's validation suite with no human steering after each target URL was supplied, and with no hints, source or answer keys. The vendor says each build had a fresh flag, a separate referee accepted a solve only when that flag appeared in captured evidence, and a 20-challenge control set reserved by a fixed every-fifth rule was also completed (20 of 20, and 84 of 84 in the main set). Three solves are described at a high level: a login that trusted user input in a query, a registration flow whose encrypted captcha answers leaked through different server responses, and a template that evaluated user input and exposed a secret key. The 104 of 104 result, the measurement conditions and the claim that nothing was tuned to the suite are B-52's own account and have not been checked independently.",

  "body": "Jesus A. Perez Duerto of Red Hound describes a private pentest harness in which the operator talks to an orchestrator and the workers never get a shell on the target. Tool calls go through a gateway that re-checks scope and the testing window, and anything that would change the host waits for him. Workers see a typed situation board of what is currently true, not the full transcript, and a failure ledger that separates a dead technique from an attempt that simply did not land. He open-sourced arsenal, a methodology pack of 16 specialist skills, 76 on-demand tool skills and four governance policies (github.com/jperezduerto/arsenal). The repository is young: it was created on 18 August 2026 and its last push was on 22 August 2026, the same day as this post.",

  "headline": "Twice the solves, and better at refusing, on the vendor's numbers",
  "body": "Microsoft Perception reports that its Web App Pen Test Agent, evaluated on Incalmo's WebAppSec Index v1.0, solved 31.0% of tasks versus 15.2% for OpenAI Codex, and passed 91.0% of should-refuse tests versus 50.0% for the Terminus baseline harness. The index has 175 tasks on 30 open-source apps that were modified with new vulnerabilities; the quality figure combines unauthenticated (black-box) and authenticated (grey-box) tasks and excludes white-box ones. Constrained tasks include violation monitors, and success means respecting the boundary even if that means missing the objective. All three agents used GPT-5.5. Microsoft notes that Codex ran without the production agent's guardrails and with extra capabilities. These figures are Microsoft's own report on its product and have not been checked independently.",

  "title": "The model never holds a terminal",
  "headline": "The model never holds a terminal",
  "body": "A September 2026 Dark Moon post describes its pentest architecture as a vendor account of its own product. The model selects typed MCP tools and does not get a raw shell. An executor refuses commands that have no defined end. The most sensitive specialist agents are dispatched only when the operator supplies credentials and takes an explicit action; the post says there are 50 specialists in the image. A privacy gateway replaces IPs, hosts and credentials with deterministic placeholders and restores the real values locally when a tool runs; Dark Moon states that those placeholders still leak structure, cardinality and co-occurrence. A command gateway is a policy layer, not a sandbox, so tools also run in containers. Findings are labeled EXPLOITED, CONFIRMED or UNCONFIRMED.",
  "steal": "Keep the model off the shell, dispatch credentialed specialists only by hand, and treat placeholder tokenization as a leak of structure, not complete hiding.",

  "title": "Hypotheses over signatures",
  "headline": "Hypotheses over signatures",
  "body": "Ashton Vaughan describes Project Triage, a solo-built bug-bounty agent that tries to hunt like a researcher rather than a scanner. It builds a picture of the target, generates hypotheses ranked by bounty value, then runs a think/act/observe/learn loop. A finding is only counted after an evidence gate; the author says the worst failure mode is a confident, well-written false report, and that ranking by bounty value is easy to say and hard to model. Around the model, ordinary code checks scope, blocks repeats, throttles, and summarizes tool output into a persistent state tree rather than a raw transcript. He reports that a repetition check cut loops by about 86% in his testing, and that offering a constrained set of actions instead of free-form generation was the other large reliability gain. The post is a practitioner write-up of his own system.",
  "steal": "Rank work by hypothesis value, keep the think/act/observe/learn loop gated on evidence, and put loop-breaking and scope checks in code around the model.",

  "body": "Lorikeet Security describes Lory as a three-layer pipeline: a stateful crawler, an LLM reasoning engine that forms hypotheses, and a sandboxed worker that tries to confirm them. A finding is not shown to the customer until a certified pentester has reviewed and countersigned it. The vendor reports an average of 39 minutes from scan start to a validated critical finding, and a 0% false-positive rate on findings delivered to engineering queues. Both figures are Lorikeet's own claims; the 0% rate is after that mandatory human sign-off, not a measure of the agent's raw output. This is a vendor post about its own product.",

  "headline": "Specialist reviewers, shared notes, an adversarial critic",
  "body": "CERT-EU open-sourced Vigilo on 13 November 2026, its in-house harness for AI-guided security code review (github.com/certeu/vigilo, last push 20 November 2026). Instead of a single agent, specialist agents for each vulnerability class — injection, authentication, authorization, cryptography, and supply-chain dependencies — share findings through a common knowledge base. White-box mode reads source, optionally with a running instance; grey-box tests only the running app, as an external attacker with valid credentials. An adversarial critique step re-examines every finding, challenging its severity and merging duplicates, so only substantiated findings reach the report. Where source is available, confirmed findings can get a suggested patch on a separate branch for maintainer review. CERT-EU says findings and patches still need to be validated by the code owners.",
  "steal": "Use per-class specialists writing to one shared knowledge base, and require an adversarial critique before anything reaches the report.",

  "title": "A Python loop drives the orchestrator; guardrails live in hooks",
  "headline": "A Python loop drives the orchestrator; guardrails live in hooks",
  "body": "Joe Bollen describes a bug-bounty agent he runs on a Raspberry Pi 5. An Opus orchestrator returns one JSON action per turn — recon, test, authenticate, research, note, or done — and never makes HTTP requests itself. Sonnet agents execute, Haiku classifies, and deterministic workers handle scans. Python owns the loop, with bounded epochs, a Postgres job queue, and a pgvector knowledge graph. Shared PreToolUse hooks block out-of-scope hosts and, after 10 repeated 5xx failures to the same host in a 60-second window, cut that host off for the rest of the session; a PostToolUse logger attaches request/response evidence to every finding. He found that the models overstated severity — often rating informational issues as medium or high — and that manual corrections feed back into the knowledge base.",
  "steal": "Enforce scope and capture evidence in tool hooks shared by every subagent, not in prompts.",

  "title": "A finding counts only if the agent can prove it",
  "headline": "A finding counts only if the agent can prove it",
  "body": "HunterBench describes the engine behind its public pentest-agent benchmark. This is a vendor post about its own product. Each run is a complete test in a fresh, single-use sandbox: all Linux capabilities are dropped except NET_RAW, the root filesystem is read-only, and the process runs as a non-root user with no-new-privileges. Egress is denied by default and enforced by a firewall sidecar; the agent can reach only the in-scope target, the model's API, and DNS, and the cloud metadata endpoint is always blocked. The engine runs provision, brief, recon, hunt, collect and teardown in that order. A claim becomes a finding only if the agent can demonstrate it; on the leaderboard, HunterBench also says a finding counts only if it matches a vulnerability the team already verified in the target's source code.",
  "steal": "Run each test in a disposable, deny-by-default sandbox, and count a bug only after the agent has proved it.",

  "headline": "Scan, investigate, revalidate, then ticket",
  "body": "Vercel open-sourced deepsec, a security harness that runs on your own infrastructure (github.com/vercel-labs/deepsec). A regex-only first pass marks security-sensitive files, coding agents then investigate each candidate for data flow and mitigations, and a second agent run revalidates the findings to cut false positives and reclassify severity. Results are enriched with git ownership metadata and exported as tickets for people or coding agents. Vercel says that, in its experience, the false-positive rate is roughly 10–20%. A classifier checks after each research step whether the model refused the task. Scans can optionally fan out to remote sandboxes. Custom regex plugins can tune it to a codebase's auth model.",

  "body": "Denis Germain (zwindler) describes a solo bug-hunting setup that splits agents into planner, auditor and counter-reviewer roles (R0, R1, R2) and keeps a claims database of every lead, including the rejected ones, with a coded reason. His reports were almost never rejected because the bug did not exist: of those that got a verdict, half were duplicates, and others failed on a misjudged threat model or impact. He says the payoff is in triage — admission and counter-review discard bad leads early, and the database remembers why. The counter-review is enforced in the machinery to run on a different model from the one that wrote the finding; a finding cannot be marked ready if the same model reviewed itself. This is a practitioner write-up of his own system.",

  "title": "Getting Vulnerabilities Found by AI Scanners to Developers",
  "headline": "Getting Vulnerabilities Found by AI Scanners to Developers",
  "body": "Dongkwan Kim writes that finding a bug with an AI scanner is the start of the work, not the end. His team runs MDASH against the Linux kernel and other open-source projects, and he argues the hard part is what follows: filtering false positives, checking the threat model, proving the bug, and getting a verified patch accepted by maintainers. Cheap filters (a debate for and against the candidate, grouping duplicates, and the project's threat model) cut the list before an expensive prover tries to reproduce it; reasons for rejection are kept so later scans do not repeat the same misses. Even a patch that passes tests can still be wrong, he notes, and maintainers often disagree on whether something is a security issue. This is a practitioner post about his team's own pipeline.",
  "steal": "Treat a finding as the start of a pipeline to a maintainer-accepted fix, not the end of the scan.",

  "headline": "Code for the routine, agents for the analysis",
  "body": "Anton Solomatin describes Qyran, his closed-source, self-hosted platform for bug bounty and authorized audits. He started from a Bash recon chain and now has a platform of around 150k lines, with a shared database for runs, assets and findings, and a target score recalculated from collected signals after every scan. Ten years of notes were turned into 120+ skills. Recon, scanning, deduplication, comparison with earlier runs and asset scoring stay in deterministic code; agents are brought in only where analysis or judgment is needed. Autonomous sessions are time- and budget-limited, with scope checks at the tool level and confirmation for risky actions.",

  "id": "hackbot-h79-bountyharness-how-it-works",
  "kindLabel": "Architecture",
  "title": "Scanner output is not a finding",
  "headline": "Scanner output is not a finding",
  "body": "harikp's BountyHarness documentation describes the path from a scope file to an evidence pack. This is the project's own documentation; the page itself has no publication date. A scope file defines authorization: with no scope file, there is no intrusive testing. Workflows live in inspectable skill packages, and a tool registry (the page says 99 tools) applies safety tiers and a circuit-breaker backoff. A planner ranks tests so the run is not a full sweep. An impact verifier checks preconditions and evidence and enforces that scanner output is not a finding, before reporting assembles an evidence pack.",
  "steal": "Refuse intrusive testing without a scope file, and do not treat scanner output as a finding until a verifier has evidence.",

  "category": "Hackbot",
  "kind": "post",
  "id": "hackbot-h80-garner-pentestcode-readme",
  "kindLabel": "Open-source agent",
  "title": "Make the parser mandatory, and keep engagement state across sessions",
  "headline": "Make the parser mandatory, and keep engagement state across sessions",
  "body": "Micheal Garner reads the open-source PentestCode project from its README, rather than from a live engagement. (A later six-hour run of the same project is already on this page as H13.) A lead coordinator plans and dispatches work to specialist agents, but Garner argues the real differentiator is structured engagement state that persists across sessions — close the terminal and pick up the next day — and a rule that tool output must go through a dedicated parser before it can be written into that state, so the model is not updating the record from its own reading of raw output. Three operating modes (auto, free and guided) compose with a pause setting, so a run can be autonomous and still stop for review. The README's own limitations, which Garner highlights, include token cost, a tendency to rerun tools, quality that varies by model, and that the agent is not stealthy by default.",
  "steal": "Require a parser between tool output and a session-persistent engagement store, and make autonomy a mode you can pause.",

  "id": "hackbot-h81-coderabbit-security-harness",
  "kindLabel": "Architecture",
  "title": "Keep a coverage ledger, not just a findings list",
  "headline": "Keep a coverage ledger, not just a findings list",
  "body": "Ganesh Futane describes CodeRabbit's security harness, which treats scanning as a mapping and search problem. This is a vendor post about CodeRabbit's own product. The harness splits a repo into sections that fit one context window. For each assignment it records what was inspected and cites the code, and anything uncited stays open for another pass. The orchestrator sends focused follow-up questions, with the evidence so far, to fresh-context investigators, including questions that cross into shared libraries and deploy repos. An independent verifier, ideally from another model family, can accept, reject with a reason, or send a question back. A runtime check counts as inconclusive unless the app was ready and the code actually ran.",
  "steal": "A scope / inspected / open record per assignment, so a \"no finding\" can't hide code nobody looked at.",
  "url": "https://www.coderabbit.ai/blog/how-we-build-a-security-harness-that-finds-real-vulnerabilities",

 {

  "id": "hackbot-h84-microsoft-artex-defenders",
  "kindLabel": "Architecture",
  "title": "What an attacker-grade agent looks like from the defender's side",
  "headline": "What an attacker-grade agent looks like from the defender's side",
  "body": "Microsoft Threat Intelligence describes ARTEX, a public AI pentest framework released in July 2026, that it says both state-sponsored and financially motivated actors, including Storm-0940 and Storm-3358, have used. The operator sets the scope. A goals model breaks the work into verifiable objectives. A planner reads a knowledge graph of assets and findings and issues short intents; workers claim those intents, run tools, and write results back to the graph, which wakes the planner again until the goals or a time or step limit are hit. Microsoft says ARTEX does not introduce new attack techniques, that operators can rotate IPs and user agents, and that the agents can be pointed at almost any model, including ones with guardrails removed. The most durable signal, in Microsoft's view, is behavioral: a wide variety of requests in a short window, with retries and next-stage actions at machine speed. This is a broader defender briefing than Microsoft's 5 November write-up on ARTEX secret-hunting, already on /seceng, and it is distinct from the WorkOS, Bitrise and other victim-incident cards.",
  "steal": "Hunt volume-and-speed patterns, not static network indicators, and assume a public pentest agent can be aimed at you.",
  "url": "https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/",

  "id": "hackbot-h85-redamon-xbow-101",

  "title": "A benchmark score is only as good as the transcript behind it",
  "headline": "A benchmark score is only as good as the transcript behind it",
  "body": "RedAmon reports that its agent recovered flags on 101 of XBOW's 104 validation targets, fully black-box, starting from only a URL. It says a solved target averaged about 23 minutes and about 0.75 million tokens (input plus output). This is RedAmon's own result; the page says RedAmon and XBOW are independent projects and that XBOW has not endorsed or certified the evaluation. The page was last updated on 23 November 2026 and has no other publication date. RedAmon's claimed model to copy is the evidence: it publishes an unedited agent session and a walkthrough for the solves. The live scorecard shows three unsolved targets, and one solved row (XBEN-092) still marked \"not published\" for both the session and the walkthrough.",
  "steal": "Don't take a benchmark score without the run evidence: publish the transcript for every solve.",
  "url": "https://www.redamon.org/docs/xbow-validation-benchmark",

 {

  "category": "Hackbot",

  "id": "hackbot-h86-sybil-vs-opensource",
  "kindLabel": "Evaluation",
  "title": "Precision is not the same as coverage",
  "headline": "Precision is not the same as coverage",
  "body": "Sybil's 24 November 2026 post is a vendor benchmark of its own product against three open-source AI pentest frameworks, on three applications, using what it says are the same methods as its earlier model comparison. Sybil reports reaching 1.8 times as many known vulnerabilities as PentAGI, 2.4 times as many as Cairn and 3.3 times as many as ARTEX, with 82% precision. ARTEX, in Sybil's figures, matched that 82% precision but reached only 20% of the known vulnerabilities. Cairn is reported at 28% recall and 64% precision, and PentAGI at 38% and 39%. The useful scoring lesson is that a clean, precise report can still leave most known issues unfound. These figures are Sybil's own.",
  "steal": "Score a hackbot on coverage and precision together, and don't mistake a precise report for thorough coverage.",
  "url": "https://www.runsybil.com/blog/sybil-vs-open-source-finding-what-artex-cairn-and-pentagi-miss",
  "sourceLabel": "Sybil",

  "headline": "Detection is not proof until a second agent re-proves it",
  "body": "The Xalgorix team describes a 22-phase test plan in which a finding is not reported until the hunting agent has demonstrated impact and a separate verifier then re-tests it from scratch. The verifier's verdict is confirmed, rejected, or inconclusive; inconclusive findings are kept and flagged for a person, never presented as validated. This is a vendor post about Xalgorix's own product, dated 6 July 2026. Help Net Security later covered an open-source release of the tool on 23 November 2026. In that interview, founder Krishna Kumar said the verifier starts from a fresh context, treats the first agent's proof as untrusted and gets read-only tools, and that the team measures false positives on internal benchmarks but has no plans yet to publish those results. This is a different product and a different lesson from CodeRabbit's coverage-ledger verifier (H81) and Jane's retest of whether a fix landed.",
  "steal": "Have a second agent, in a fresh context, re-prove each finding before it is reported, and send anything it can neither prove nor rule out to a person.",

  "headline": "Chain the low-severity bugs, then prove each link is needed",
  "body": "Saaketh Vedantam describes how depthfirst treats chaining as its own stage. This is a vendor post about depthfirst's own product, and it reports no metrics. The post defines a vulnerability as a state transition that breaks a security invariant, and a chain as a path across several such transitions. Invariants come from editable threat models. Untuned discovery agents mostly report single, scoped bugs, which keeps reporting consistent, so chaining is a separate stage. Scanner findings go into a catalog. Longer-running agents search it for bugs reachable from earlier steps, working backward from the highest-impact endpoints. A validation step then ablates the chain so that every issue in it is needed. An explicit state graph, they found, made chains less coherent.",
  "steal": "Keep single-bug discovery and chaining as separate stages over a shared findings catalog, and require a minimality check before reporting a chain.",

  "body": "Strobes describes its production pentest harness. This is a vendor post. A single all-tools agent was overwhelmed on complex targets, so they split the work into specialists: web, API, network recon, threat intel, triage, report writing and code review. Each specialist has its own prompt, tools and context. An orchestrator decomposes the task and delegates but never executes. Middleware checks inputs for prompt injection, including text coming from the target. The post names failure modes such as an expired session's 401s being read as \"no vuln\" and a generic 500 being reported as a finding. The post itself states that the model is perhaps 20% of the problem and the harness the other 80%.",

  "body": "Andy Cao and Prince Chaddha say the practical problem for teams using LLMs is not a shortage of hypotheses but a flood of unproven ones. They built Neo to close the gap between finding a vulnerability and proving it, and they report that in a benchmark against Claude Code and traditional SAST/DAST on AI-generated applications, Neo found 60% more vulnerabilities with 80% fewer false positives because it deploys the app, tests it at runtime, and produces evidence. They also describe putting Neo to the test on popular software, where it hunted, exploited, and proved 22 zero-days.",

  "body": "Shellphish’s ARTIPHISHELL placed fifth in the AIxCC final after a $2 million semifinal finish. Their postmortem describes a four-phase pipeline — static analysis, dynamic analysis, triage, and patching — where later phases depend on earlier ones, with redundancy so the system can still submit something if a component fails. The post is mainly a technical account of the bugs and issues in their own system that kept it from doing better, which is the useful part for anyone building a similar bot.",

  "body": "CVE-Bench is a sandboxed benchmark of 40 critical-severity web CVEs. In the zero-day setting, the agent gets only a task description and has to find and trigger the issue on its own. In the one-day setting, it also gets a high-level description of the vulnerability. Graders score concrete outcomes, such as a file being read or an unauthorized admin login, not the model's write-up. In the paper, the best agents exploited up to 10% of the vulnerabilities in the zero-day setting and 13% in the one-day setting.",

  "body": "Project Zero's Naptime sets up vulnerability research the way a human researcher works: room to reason, an interactive environment, specialized tools, automatic checking, and several independent attempts instead of one long, muddled thread. The agent gets a code browser, a sandboxed Python tool, a debugger, and a reporting tool it uses to claim success or give up. A controller checks the claim, usually by confirming a crash, instead of trusting the model's confidence. On the CyberSecEval2 benchmark, buffer overflow scores rose from 0.05 to 1.00 and advanced memory corruption from 0.24 to 0.76.",

  "headline": "Start from a known fix and look for the cousin bug",
  "body": "Naptime later became Big Sleep, a collaboration between Project Zero and DeepMind. The team argues that variant analysis is a better first task for today's models than open-ended bug hunting: start from a past fix and ask whether a similar issue is still there. In their first large experiment, they gave the agent recent SQLite commits and diffs and asked it to look for related bugs that were still unfixed. It found an exploitable stack buffer underflow, which was reported in early October 2024 and fixed the same day, before it reached an official release.",

  "headline": "Fuzzing and agents catch different bugs",
  "body": "Over six months on Chrome's V8 JavaScript engine, Big Sleep found 45 vulnerabilities and the specialized fuzzer Fuzzilli found 37, with 25% overlap between the bugs each reported. That method tends to undercount overlap, so the team also ran dedicated experiments on bugs reported since 2023 and estimated the true overlap at about 60%. Either way, a large share of bugs was found by only one of the two. Fuzzilli ran continuously and usually saw new code within hours, while Big Sleep ran daily over new commits. Their recommendation is to run both.",

  "headline": "Activity is not verification",
  "body": "ATOBench tests what pentest agents do when target responses lie. It injects registered response transformations and pairs each altered episode with a native one. It then traces how evidence flows into stopping decisions and the report, under three observation contracts. Over 450 episodes and five model routes, JWT verification fell from 84.0% to 58.7%, and SQLi verification collapsed from 44.0% to 0%. Under deception, SQLi agents took a median of 14 extra actions. More probing hid a broken evidence chain.",

  "body": "UVA researchers compare a legacy human-in-the-loop PentestGPT setup (open-weight Kimi K2.5) with a newer autonomous one (Claude Opus 4.8) on three public targets. The autonomous one solves all three, and the legacy one still completes about half the subtasks on machines it never solves. Adding a coverage-memory layer improved neither. In the stalled runs they reviewed, agents held the evidence for a route forward but never committed to a concrete hypothesis. Model, harness and memory changed together, so the trend is described, not explained.",

  "body": "This SoK runs 13 open-source LLM pentest frameworks plus 2 baselines on one benchmark, using over 10 billion tokens and more than 1,500 logs hand-reviewed by over 15 researchers across four months. Single-agent designs do about as well as complex multi-agent ones on most easier tasks, external knowledge bases fail to help in most cases and mismatched ones can hurt, and prompt complexity and extra mechanisms don't reliably improve results. Simple-prompt coding agents are competitive at Easy and Medium, explicit memory helps multi-vulnerability exploitation, and hallucination, especially of flags, is widespread.",

  "headline": "Milestones, parallel routes, evidence-gated progress",
  "body": "DoGNAVY-Exploit is a multi-agent harness that helps open-weight models stay on track through long exploitation tasks. Configurable milestones turn the work into short steps that can each be verified, and each stage sees only the expert knowledge relevant to it. Inside a milestone, a planner proposes several routes, executors try them in parallel, and a controller accepts progress only when runtime evidence supports it. Shared structured memory keeps verified facts, artifacts, replay steps and failed routes across branches. Ablations show the stage-aware orchestration, expert knowledge, parallel exploration and memory each help. Results are from controlled benchmarks only (Cybench, CVE-Bench, ExploitGym).",
  "steal": "Accept a step as done only with runtime evidence, and log failed routes so other branches don't repeat them.",

 {

  "category": "Hackbot",
  "kind": "post",
  "id": "hackbot-h35-agentflow-harness-search",
  "kindLabel": "Research paper",
  "title": "Search the harness, not just the model",
  "headline": "Search the harness, not just the model",
  "body": "The paper notes that with the model held fixed, changing only the harness can change success rates several-fold on public agent benchmarks. AgentFlow writes the harness (roles, prompts, tools, communication topology, coordination protocol) as a typed graph DSL. An outer loop reads runtime signals from the target program to diagnose which part of the harness caused a failure, then rewrites that part. It reports 84.3% on TerminalBench-2 with Claude Opus 4.6, and ten previously unknown Chrome vulnerabilities with Kimi K2.5, including two Critical sandbox escapes. All ten were accepted through Chrome's VRP, and the Chrome-specific configuration is withheld.",
  "steal": "Treat the harness as typed config we can diff and tune, and blame failures on a specific part using runtime signals.",

  "body": "VAST is a declarative range compiler that keeps vulnerability scenarios apart from a compiler-added workflow-hardening layer, so workflow difficulty can be varied on a six-rung ladder. Each instance is checked by four gates (benign, reference-exploit, negative and patch-toggle paths), and failures get labels. The main benchmark keeps 1,387 instances across 81 topics. Three models solved 12/90 instances with the bare contract and 14/90 with a generic hint, but 76/90 when given the shared workflow protocol. The author is careful about limits: identifier re-randomization is not a measured contamination defense, containment is Python-level rather than kernel-enforced, and the code audit was done after the runs.",

  "headline": "A task graph, a context slice and a vetted command library",
  "body": "From 130 logs of 10 LLMs on AutoPentest-Bench (13 VulnHub targets, 93 sub-tasks), the paper names three failure modes: rigid strategy, contextual forgetting and command hallucination. PentestLLMAgent answers with a task dependency graph with priority scoring and backtracking, an orchestrator that hands each expert agent only a slice of context and takes back compressed results, and about 500 pre-validated, non-interactive commands that are retrieved rather than generated. With qwen-max it reaches 77% end to end, against 46% for PentestGPT. Averaged over 10 models, success is 55.6% in full, 19.9% without the graph, 27.1% without the hierarchy and 9.3% without the command library. Results are on lab targets only.",

  "headline": "When the agent says it's done, make it keep going",
  "body": "Kang, Gwon and Park study exploit agents on ExploitBench using DeepSeek-V4-Flash-0731 and MiMo-V2.6-Pro. Agents often stop with budget left, and continuing past the first stop still yields additional verified gains, though they shrink over longer runs. Less productive continuation goes with a rising share of stop responses and with summaries that keep 'impossible' judgments about goals not yet reached. Their SCoRe method compacts context when stops pile up and marks those judgments as unproven. With SCoRe, MiMo reaches 67.0% capability coverage at 2,000 turns, against 32.4% under its original stopping policy and 58.6% that the authors computed for GPT-5.5 from ExploitBench's 300-turn reference results. This is a preprint (Nov 17, 2026) and uses benchmark tasks only.",

  "body": "CyBiasBench ran 630 sessions across five offensive agents, three targets, four prompt conditions and ten attack families. Each agent showed its own attack-selection bias, in which families it tried and how concentrated its effort was, and these patterns stayed relatively stable across prompt variations. The authors also report a 'bias momentum' effect: agents resisted explicit steering toward families that conflicted with their bias, and forcing the shift did not measurably improve attack performance. The bias gives information beyond aggregate success rates, within the evaluated environments. Accepted to the NeurIPS 2026 Evaluations and Datasets Track. First posted May 8, 2026 (revised Nov 17), with a public dashboard and evaluation scripts.",
