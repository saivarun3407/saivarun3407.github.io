<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>secnotes - Security engineering</title>
<meta name="description" content="One-card-at-a-time reader: how security teams use AI in practice." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
 :root {
 --bg: #000000;
 --fg: #ffffff;
 --muted: rgba(255, 255, 255, 0.55);
 --muted-2: rgba(255, 255, 255, 0.50);
 --faint: rgba(255, 255, 255, 0.08);
 --faint-2: rgba(255, 255, 255, 0.14);
 --card: #0a0a0a;
 --cyan: #ff2a2a;
 --acid: #ff2a2a;
 --ink: #000;
 --radius: 28px;
 --shell: 40rem;
 --ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - card-resize */
 --resize-dur: 300ms;
 --resize-ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - tabs-sliding (secnotes dark) */
 --tabs-dur: 250ms;
 --tabs-ease: cubic-bezier(0.22, 1, 0.36, 1);
 --tabs-text-muted: rgba(255, 255, 255, 0.55);
 --tabs-text-active: #000000;
 --tabs-bar-bg: rgba(255, 255, 255, 0.08);
 --tabs-pill-bg: #ffffff;

 /* transitions.dev - toast */
 --toast-open: 350ms;
 --toast-close: 250ms;
 --toast-distance: 16px;
 --toast-blur: 2px;
 --toast-scale: 0.97;
 --toast-ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - success-check */
 --check-opacity-dur: 500ms;
 --check-rotate-dur: 500ms;
 --check-rotate-from: 80deg;
 --check-bob-dur: 500ms;
 --check-y-amount: 40px;
 --check-blur-dur: 500ms;
 --check-blur-from: 10px;
 --check-path-dur: 500ms;
 --check-path-delay: 80ms;
 --check-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
 --check-ease-opacity: cubic-bezier(0.22, 1, 0.36, 1);
 --check-ease-rotate: cubic-bezier(0.22, 1, 0.36, 1);
 --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
 --check-ease-path: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - page-side-by-side (adapted for card enter/exit) */
 --page-slide-dur: 420ms;
 --page-fade-dur: 420ms;
 --page-slide-distance: 42%;
 --page-blur: 6px;
 --page-stagger: 0ms;
 --page-exit-enabled: 1;
 --page-slide-ease: cubic-bezier(0.22, 1, 0.36, 1);
 --page-fade-ease: cubic-bezier(0.22, 1, 0.36, 1);

 /* transitions.dev - texts-reveal */
 --stagger-dur: 500ms;
 --stagger-distance: 12px;
 --stagger-stagger: 40ms;
 --stagger-blur: 3px;
 --stagger-ease: cubic-bezier(0.22, 1, 0.36, 1);
 }

 *, *::before, *::after { box-sizing: border-box; }
 html, body { height: 100%; }
 body {
 margin: 0;
 background: var(--bg);
 color: var(--fg);
 font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 -webkit-font-smoothing: antialiased;
 text-rendering: optimizeLegibility;
 line-height: 1.5;
 }
 ::selection { background: rgba(0, 174, 239, 0.4); color: #fff; }
 button { font: inherit; color: inherit; }
 a { color: var(--cyan); text-decoration: none; }
 a:hover { text-decoration: underline; text-underline-offset: 3px; }

 .app {
 min-height: 100%;
 display: flex;
 flex-direction: column;
 padding:
 max(1.25rem, env(safe-area-inset-top))
 max(1.25rem, env(safe-area-inset-right))
 max(1.25rem, env(safe-area-inset-bottom))
 max(1.25rem, env(safe-area-inset-left));
 }
 .shell {
 width: 100%;
 max-width: var(--shell);
 margin: 0 auto;
 }

 /* - Header - */
 .top {
 display: flex;
 align-items: flex-start;
 justify-content: space-between;
 gap: 1rem;
 padding-top: 0.5rem;
 }
 .brand { display: flex; flex-direction: column; gap: 0.35rem; }
 .wordmark {
 font-size: 1.05rem;
 font-weight: 600;
 letter-spacing: -0.03em;
 color: #fff;
 }
 .eyebrow {
 margin: 0;
 font-size: 11px;
 font-weight: 500;
 text-transform: uppercase;
 letter-spacing: 0.28em;
 color: rgba(255, 255, 255, 0.5);
 }
 .ghost-link {
 appearance: none;
 border: 0;
 background: transparent;
 color: rgba(255,255,255,0.55);
 font-size: 0.875rem;
 font-weight: 500;
 cursor: pointer;
 padding: 0.5rem 0.25rem;
 transition: color 200ms var(--ease);
 }
 .ghost-link:hover { color: var(--cyan); }
 .ghost-link:focus-visible {
 outline: 2px solid var(--cyan);
 outline-offset: 3px;
 border-radius: 6px;
 }

 /* - Mode tabs (transitions.dev tabs-sliding) - */
 .mode-row {
 display: flex;
 flex-wrap: wrap;
 align-items: center;
 justify-content: space-between;
 gap: 1.25rem;
 margin-top: 2.25rem;
 }
 .t-tabs {
 position: relative;
 display: inline-flex;
 align-items: center;
 gap: 3px;
 padding: 3px;
 border-radius: 48px;
 background: var(--tabs-bar-bg);
 }
 .t-tab {
 position: relative;
 appearance: none;
 border: 0;
 background: transparent;
 height: 34px;
 padding: 4px 16px;
 color: var(--tabs-text-muted);
 cursor: pointer;
 border-radius: 48px;
 z-index: 1;
 font-size: 0.875rem;
 font-weight: 500;
 transition: color var(--tabs-dur) var(--tabs-ease);
 }
 .t-tab:not([aria-selected="true"]):hover,
 .t-tab[aria-selected="true"] {
 color: var(--tabs-text-active);
 }
 .t-tab[aria-selected="true"] { color: var(--tabs-text-active); }
 .t-tabs-pill {
 position: absolute;
 top: 3px;
 left: 0;
 height: 34px;
 width: 0;
 background: var(--tabs-pill-bg);
 border-radius: 48px;
 transform: translateX(0);
 transition:
 transform var(--tabs-dur) var(--tabs-ease),
 width var(--tabs-dur) var(--tabs-ease);
 will-change: transform, width;
 z-index: 0;
 pointer-events: none;
 }
 /* Active tab sits on white pill → black text; inactive stay muted.
 When pill is white, selected should be black - already set.
 Cyan accent variant: when research active we can tint pill via JS? Keep white like secnotes primary. */

 /* - Progress metric (secnotes GiantMetric craft) - */
 .metric {
 display: flex;
 align-items: baseline;
 gap: 0.45rem;
 flex-wrap: wrap;
 }
 .metric-num {
 font-size: clamp(2.5rem, 8vw, 3.75rem);
 font-weight: 500;
 letter-spacing: -0.04em;
 line-height: 1;
 color: var(--cyan);
 }
 .metric-rest {
 font-size: 0.95rem;
 font-weight: 500;
 color: rgba(255,255,255,0.5);
 letter-spacing: -0.01em;
 }

 /* - Main stage - */
 .stage {
 flex: 1;
 display: flex;
 flex-direction: column;
 margin-top: 2rem;
 }
 .card-slot {
 position: relative;
 width: 100%;
 perspective: 1400px;
 perspective-origin: 50% 45%;
 transform-style: flat;
 overflow: hidden;
 }
 .card-pane {
 transform-style: preserve-3d;
 backface-visibility: hidden;
 will-change: transform, opacity, filter;
 }

 /* card-resize */
 .t-resize {
 transition:
 width var(--resize-dur) var(--resize-ease),
 height var(--resize-dur) var(--resize-ease);
 will-change: width, height;
 overflow: hidden;
 }

 .card {
 position: relative;
 border-radius: var(--radius);
 border: 1px solid var(--faint);
 background: var(--card);
 padding: 1.75rem 1.5rem 1.5rem;
 }
 @media (min-width: 640px) {
 .card { padding: 2.25rem 2rem 1.75rem; }
 }

 .chips {
 display: flex;
 flex-wrap: wrap;
 gap: 0.5rem;
 margin-bottom: 1.25rem;
 }
 .chip {
 display: inline-flex;
 align-items: center;
 height: 26px;
 padding: 0 0.7rem;
 border-radius: 999px;
 font-size: 11px;
 font-weight: 500;
 letter-spacing: 0.04em;
 border: 1px solid var(--faint);
 color: rgba(255,255,255,0.65);
 background: transparent;
 }
 .chip-kind-practice { color: rgba(255,255,255,0.75); }
 .chip-kind-lab { color: rgba(255,255,255,0.75); }
 .chip-kind-paper { color: rgba(255,255,255,0.75); }
 .chip-unread {
 border-color: rgba(0, 174, 239, 0.35);
 color: var(--cyan);
 background: rgba(0, 174, 239, 0.08);
 }
 .chip-read {
 color: rgba(255,255,255,0.45);
 }
 .chip-acid {
 border-color: rgba(200, 245, 66, 0.35);
 color: var(--acid);
 }

 /* texts-reveal */
 .t-stagger-line {
 display: block;
 opacity: 0;
 transform: translateY(var(--stagger-distance));
 filter: blur(var(--stagger-blur));
 transition:
 opacity var(--stagger-dur) var(--stagger-ease),
 transform var(--stagger-dur) var(--stagger-ease),
 filter var(--stagger-dur) var(--stagger-ease);
 will-change: transform, opacity, filter;
 }
 .t-stagger-line--2 { transition-delay: var(--stagger-stagger); }
 .t-stagger.is-shown .t-stagger-line {
 opacity: 1;
 transform: translateY(0);
 filter: blur(0);
 }
 .t-stagger.is-hiding .t-stagger-line {
 opacity: 0;
 transform: translateY(0);
 filter: blur(0);
 transition:
 opacity 200ms ease,
 transform 0s linear,
 filter 0s linear;
 transition-delay: 0s;
 }

 .headline {
 margin: 0;
 font-size: clamp(1.65rem, 4.2vw, 2.35rem);
 font-weight: 500;
 letter-spacing: -0.03em;
 line-height: 1.12;
 text-wrap: balance;
 color: #fff;
 }
 .lede {
 margin: 1.25rem 0 0;
 max-width: 38rem;
 font-size: 1.05rem;
 line-height: 1.7;
 color: var(--muted);
 }
 .cite {
 margin-top: 1.75rem;
 padding-top: 1.25rem;
 border-top: 1px solid var(--faint);
 display: flex;
 flex-direction: column;
 gap: 0.35rem;
 }
 .cite-label {
 font-size: 11px;
 font-weight: 500;
 text-transform: uppercase;
 letter-spacing: 0.28em;
 color: rgba(255,255,255,0.45);
 }
 .cite a {
 font-size: 0.95rem;
 font-weight: 500;
 color: var(--cyan);
 }

 /* Card roll — transitions.dev page-slide + 3D roll for Inshorts-like deck feel */
 .card-pane {
 width: 100%;
 }
 .card-pane.is-enter-next {
 animation: card-roll-in-next var(--page-slide-dur) var(--page-slide-ease) both;
 }
 .card-pane.is-enter-prev {
 animation: card-roll-in-prev var(--page-slide-dur) var(--page-slide-ease) both;
 }
 .card-pane.is-exit-next {
 position: absolute;
 inset: 0;
 width: 100%;
 animation: card-roll-out-next var(--page-slide-dur) var(--page-slide-ease) both;
 pointer-events: none;
 }
 .card-pane.is-exit-prev {
 position: absolute;
 inset: 0;
 width: 100%;
 animation: card-roll-out-prev var(--page-slide-dur) var(--page-slide-ease) both;
 pointer-events: none;
 }
 @keyframes card-roll-in-next {
 from {
   opacity: 0;
   transform: translateX(28%) rotateY(-28deg) scale(0.94);
   filter: blur(var(--page-blur));
 }
 55% { opacity: 1; filter: blur(1px); }
 to {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 }
 @keyframes card-roll-in-prev {
 from {
   opacity: 0;
   transform: translateX(-28%) rotateY(28deg) scale(0.94);
   filter: blur(var(--page-blur));
 }
 55% { opacity: 1; filter: blur(1px); }
 to {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 }
 @keyframes card-roll-out-next {
 from {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 to {
   opacity: 0;
   transform: translateX(-32%) rotateY(32deg) scale(0.92);
   filter: blur(var(--page-blur));
 }
 }
 @keyframes card-roll-out-prev {
 from {
   opacity: 1;
   transform: translateX(0) rotateY(0deg) scale(1);
   filter: blur(0);
 }
 to {
   opacity: 0;
   transform: translateX(32%) rotateY(-32deg) scale(0.92);
   filter: blur(var(--page-blur));
 }
 }

 /* - Actions - */
 .actions {
 display: flex;
 flex-wrap: wrap;
 gap: 0.75rem;
 margin-top: 1.75rem;
 align-items: center;
 }
 .btn-primary {
 appearance: none;
 display: inline-flex;
 align-items: center;
 justify-content: center;
 gap: 0.5rem;
 border: 0;
 border-radius: 999px;
 background: #fff;
 color: #000;
 padding: 0.9rem 1.65rem;
 font-size: 0.9rem;
 font-weight: 600;
 cursor: pointer;
 transition: background 300ms var(--ease), color 300ms var(--ease), transform 200ms var(--ease);
 }
 .btn-primary:hover { background: var(--cyan); color: #000; }
 .btn-primary:active { transform: scale(0.98); }
 .btn-primary:disabled {
 opacity: 0.4;
 cursor: not-allowed;
 transform: none;
 }
 .btn-primary:focus-visible {
 outline: 2px solid var(--cyan);
 outline-offset: 3px;
 }
 .btn-secondary {
 appearance: none;
 display: inline-flex;
 align-items: center;
 justify-content: center;
 gap: 0.4rem;
 border-radius: 999px;
 border: 1px solid rgba(255,255,255,0.25);
 background: transparent;
 color: #fff;
 padding: 0.9rem 1.35rem;
 font-size: 0.9rem;
 font-weight: 600;
 cursor: pointer;
 transition: border-color 300ms var(--ease), background 300ms var(--ease);
 }
 .btn-secondary:hover {
 border-color: rgba(255,255,255,0.5);
 background: rgba(255,255,255,0.06);
 }
 .btn-secondary:disabled {
 opacity: 0.35;
 cursor: not-allowed;
 }
 .btn-secondary:focus-visible {
 outline: 2px solid var(--cyan);
 outline-offset: 3px;
 }
 .btn-check {
 display: inline-flex;
 width: 1.1rem;
 height: 1.1rem;
 align-items: center;
 justify-content: center;
 }

 .hint {
 margin-top: 1.25rem;
 font-size: 0.8rem;
 color: rgba(255,255,255,0.35);
 }
 .hint kbd {
 font: inherit;
 font-size: 0.75rem;
 padding: 0.1rem 0.35rem;
 border-radius: 6px;
 border: 1px solid rgba(255,255,255,0.12);
 color: rgba(255,255,255,0.5);
 }

 /* - Toast (transitions.dev) - */
 .toast-wrap {
 position: fixed;
 left: 50%;
 bottom: max(1.5rem, env(safe-area-inset-bottom));
 transform: translateX(-50%);
 z-index: 60;
 pointer-events: none;
 }
 .t-toast {
 display: inline-flex;
 align-items: center;
 gap: 0.65rem;
 padding: 0.85rem 1.15rem;
 border-radius: 999px;
 background: #0a0a0a;
 border: 1px solid var(--faint-2);
 color: #fff;
 font-size: 0.9rem;
 font-weight: 500;
 opacity: 0;
 transform: translateY(var(--toast-distance)) scale(var(--toast-scale));
 filter: blur(var(--toast-blur));
 will-change: transform, opacity, filter;
 transition:
 opacity var(--toast-close) var(--toast-ease),
 transform var(--toast-close) var(--toast-ease),
 filter var(--toast-close) var(--toast-ease);
 }
 .t-toast.is-open {
 opacity: 1;
 transform: translateY(0) scale(1);
 filter: blur(0);
 transition:
 opacity var(--toast-open) var(--toast-ease),
 transform var(--toast-open) var(--toast-ease),
 filter var(--toast-open) var(--toast-ease);
 }

 /* success-check */
 .t-success-check {
 display: inline-block;
 transform-origin: center;
 opacity: 0;
 will-change: transform, opacity, filter;
 width: 1.35rem;
 height: 1.35rem;
 }
 .t-success-check svg { display: block; overflow: visible; width: 100%; height: 100%; }
 .t-success-check svg path {
 stroke-dasharray: 24;
 stroke-dashoffset: 24;
 }
 .t-success-check[data-state="in"] {
 animation:
 t-check-fade var(--check-opacity-dur) var(--check-ease-opacity) forwards,
 t-check-rotate var(--check-rotate-dur) var(--check-ease-rotate) forwards,
 t-check-blur var(--check-blur-dur) var(--check-ease-out) forwards,
 t-check-bob var(--check-bob-dur) var(--check-ease-bob) forwards;
 }
 .t-success-check[data-state="in"] svg path {
 animation: t-check-draw var(--check-path-dur) var(--check-ease-path) var(--check-path-delay, 0ms) forwards;
 }
 @keyframes t-check-fade { from { opacity: 0; } to { opacity: 1; } }
 @keyframes t-check-rotate {
 from { transform: rotate(var(--check-rotate-from)); }
 to { transform: rotate(0deg); }
 }
 @keyframes t-check-blur {
 from { filter: blur(var(--check-blur-from)); }
 to { filter: blur(0); }
 }
 @keyframes t-check-bob {
 from { translate: 0 var(--check-y-amount); }
 to { translate: 0 0; }
 }
 @keyframes t-check-draw { to { stroke-dashoffset: 0; } }

 /* - Drawer / progress sheet - */
 .backdrop {
 position: fixed;
 inset: 0;
 background: rgba(0,0,0,0.55);
 opacity: 0;
 pointer-events: none;
 transition: opacity 280ms var(--ease);
 z-index: 40;
 }
 .backdrop.open { opacity: 1; pointer-events: auto; }
 .sheet {
 position: fixed;
 top: 0;
 right: 0;
 height: 100%;
 width: min(26rem, 100%);
 background: #050505;
 border-left: 1px solid var(--faint);
 transform: translateX(100%);
 transition: transform 320ms var(--ease);
 z-index: 50;
 display: flex;
 flex-direction: column;
 padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
 }
 .sheet.open { transform: translateX(0); }
 .sheet-head {
 display: flex;
 align-items: flex-start;
 justify-content: space-between;
 gap: 1rem;
 margin-bottom: 1.25rem;
 }
 .sheet-title {
 margin: 0.35rem 0 0;
 font-size: 1.5rem;
 font-weight: 500;
 letter-spacing: -0.03em;
 }
 .sheet-filters {
 display: flex;
 flex-wrap: wrap;
 gap: 0.4rem;
 margin-bottom: 1rem;
 }
 .sheet-filters button {
 appearance: none;
 border: 1px solid var(--faint);
 background: transparent;
 color: rgba(255,255,255,0.55);
 border-radius: 999px;
 padding: 0.35rem 0.75rem;
 font-size: 0.75rem;
 font-weight: 500;
 cursor: pointer;
 }
 .sheet-filters button[aria-pressed="true"] {
 background: #fff;
 color: #000;
 border-color: #fff;
 }
 .sheet-list {
 overflow: auto;
 flex: 1;
 display: flex;
 flex-direction: column;
 gap: 0.35rem;
 padding-right: 0.25rem;
 }
 .sheet-item {
 appearance: none;
 width: 100%;
 text-align: left;
 border: 1px solid transparent;
 background: transparent;
 border-radius: 16px;
 padding: 0.85rem 0.9rem;
 cursor: pointer;
 transition: background 200ms var(--ease), border-color 200ms var(--ease);
 }
 .sheet-item:hover {
 background: rgba(255,255,255,0.04);
 border-color: var(--faint);
 }
 .sheet-item.is-current {
 border-color: rgba(0,174,239,0.35);
 background: rgba(0,174,239,0.07);
 }
 .sheet-item .t {
 display: block;
 font-size: 0.92rem;
 font-weight: 500;
 letter-spacing: -0.015em;
 color: #fff;
 }
 .sheet-item .m {
 display: flex;
 flex-wrap: wrap;
 gap: 0.35rem;
 margin-top: 0.35rem;
 font-size: 0.75rem;
 color: rgba(255,255,255,0.45);
 }
 .sheet-item .m .dot-unread { color: var(--cyan); }

 .sr-only {
 position: absolute;
 width: 1px; height: 1px;
 padding: 0; margin: -1px;
 overflow: hidden; clip: rect(0,0,0,0);
 white-space: nowrap; border: 0;
 }

 @media (prefers-reduced-motion: reduce) {
 .t-resize { transition: none !important; }
 .t-tabs-pill, .t-tab { transition: none !important; }
 .t-toast { transition: none !important; }
 .t-success-check { animation: none !important; opacity: 1; }
 .t-success-check svg path { animation: none !important; stroke-dashoffset: 0 !important; }
 .t-stagger-line { transition: none !important; opacity: 1; transform: none; filter: none; }
 .card-pane.is-enter-next,
 .card-pane.is-enter-prev,
 .card-pane.is-exit-next,
 .card-pane.is-exit-prev { animation: none !important; transform: none !important; filter: none !important; }
 .sheet, .backdrop { transition: none !important; }
 }



/* —— Responsive (phones / small tablets) —— */
html, body {
  min-height: 100%;
  min-height: 100dvh;
  overflow-x: hidden;
}
.app {
  min-height: 100dvh;
  box-sizing: border-box;
}
.shell { max-width: min(var(--shell), 100%); }
img, svg, video { max-width: 100%; height: auto; }
.card, .card-pane, .body, .lede, .title { word-wrap: break-word; overflow-wrap: anywhere; }

@media (max-width: 720px) {
  .app {
    padding:
      max(0.85rem, env(safe-area-inset-top))
      max(0.85rem, env(safe-area-inset-right))
      max(0.85rem, env(safe-area-inset-bottom))
      max(0.85rem, env(safe-area-inset-left));
  }
  .top {
    flex-direction: column;
    align-items: stretch;
    gap: 0.75rem;
  }
  .top .ghost-link { align-self: flex-start; min-height: 44px; }
  .brand-logo { width: 32px; height: 32px; }
  .logo-word { font-size: 1.05rem !important; }
  .eyebrow { letter-spacing: 0.18em !important; font-size: 10px !important; }
  .mode-row {
    flex-direction: column;
    align-items: stretch;
    gap: 0.85rem;
    margin-top: 1.25rem;
  }
  .t-tabs { width: 100%; display: flex !important; }
  .t-tab {
    flex: 1;
    height: 44px;
    padding: 4px 12px;
    font-size: 0.8rem;
    text-align: center;
  }
  .metrics { width: 100%; justify-content: space-between; }
  .metric-num { font-size: clamp(1.75rem, 12vw, 2.5rem) !important; }
  .stage { margin-top: 1rem; }
  .card {
    padding: 1.15rem 1rem 1.1rem !important;
    border-radius: 16px;
  }
  .title {
    font-size: clamp(1.25rem, 6.5vw, 1.7rem) !important;
    line-height: 1.25 !important;
  }
  .lede, .body {
    font-size: 0.95rem !important;
    max-width: none !important;
  }
  .chips { gap: 0.4rem; flex-wrap: wrap; }
  .actions {
    flex-direction: column;

  }
  .actions .btn,
  .actions button {
    width: 100%;

  }
  .progress-line, .hint-row {

  }
  .sheet {

}

@media (max-width: 380px) {
  .t-tab { font-size: 0.72rem; padding: 4px 8px; }

}

@media (min-width: 721px) and (max-width: 980px) {
  .app { padding-left: 1.25rem; padding-right: 1.25rem; }
  .card { padding: 1.75rem 1.5rem 1.5rem !important; }
  .title { font-size: clamp(1.5rem, 3vw, 2rem) !important; }

@media (max-height: 700px) and (orientation: landscape) {

  .metric-num { font-size: 1.75rem !important; }

  .actions .btn, .actions button { width: auto; flex: 1 1 auto; min-height: 44px; }

<script>
const STORAGE_KEY = 'secnotes-seceng-ai-read-v1';
const CARDS = [{"id": "seceng-2026-10-21-figma-triage-agents", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Team practice", "title": "How Figma secures its internal systems with agents", "headline": "How Figma secures its internal systems with agents", "body": "Figma's security team made each alert searchable together with what engineers said about it last time. An agent then investigates new alerts with Okta, Wiz, Santa and Panther, and hands deeper questions to a sub-agent that writes SQL over their security logs. It opens draft PRs to tune noisy detections. Rules like \"draft only\" are enforced in code, not just in the prompt. Results: about 70% faster resolution on complex alerts and 20% fewer pages.", "url": "https://www.figma.com/blog/how-we-secure-figmas-internal-systems-with-agents/", "sourceLabel": "Figma", "date": "2026-10-21", "practice": "Index your last 90 days of closed alerts with analysts' comments, and post the top 3 similar past alerts into each new alert's thread."}, {"id": "seceng-2026-10-21-databricks-triage", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Team practice", "title": "Scaling security alert triage with specialized agents on Databricks", "headline": "Scaling security alert triage with specialized agents on Databricks", "body": "Databricks gave every low-severity alert to AI, because those alerts were too numerous for people to check. The team built 17 triage agents, one per alert source. They run in real time on Spark Structured Streaming. Deterministic filters run first, and a shared threat-intel agent enriches IOCs. In the first 30 days the agents triaged more than 18,000 alerts with a 3.2% escalation rate and a 10.5-second median. That saved over 6,500 analyst hours. Escalated alerts were about 10x more likely to be true positives than HIGH/MEDIUM ones.", "url": "https://www.databricks.com/blog/scaling-security-alert-triage-specialized-agents-databricks", "sourceLabel": "Databricks", "date": "2026-10-21", "practice": "Pick your noisiest low-severity alert source and put a cheap deterministic filter in front of a single-source LLM triage prompt. Measure the escalation rate for two weeks."}, {"id": "seceng-2026-10-21-slack-agent-investigations", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Team practice", "title": "Streamlining security investigations with agents", "headline": "Streamlining security investigations with agents", "body": "Slack's security engineers turned one large investigation prompt into a chain of small model calls, each with a JSON-schema structured output. A Director agent asks questions. Four expert agents (Access, Cloud, Code, Threat) answer from their own data sources. A Critic agent scores each finding for credibility against a rubric and builds a timeline. Cheaper models gather evidence and stronger models review it. On-call engineers now supervise investigations and get verifiable reports. The agents have found unprompted issues such as weak IAM policies. The post shares no numbers.", "url": "https://slack.engineering/streamlining-security-investigations-with-agents/", "sourceLabel": "Slack", "date": "2026-10-21", "practice": "Add a separate 'critic' step to your LLM triage: a second call scores each claimed finding 1-5 against the cited evidence, and anything below 3 is dropped from the summary."}, {"id": "seceng-2026-10-21-google-ai-fuzzing", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Team practice", "title": "Leveling up fuzzing: finding more vulnerabilities with AI", "headline": "Leveling up fuzzing: finding more vulnerabilities with AI", "body": "Google's open source security team used LLMs to write and fix OSS-Fuzz fuzz targets. The pipeline mimics a developer's workflow: it writes the harness, fixes compile errors, runs it, and triages crashes. AI-generated targets now cover 272 C/C++ projects and add more than 370,000 lines of new coverage. They found 26 new vulnerabilities in code that had already been fuzzed heavily. These include OpenSSL CVE-2024-9143, which had likely been there for two decades and that human-written targets would not have reached.", "url": "https://security.googleblog.com/2024/11/leveling-up-fuzzing-finding-more.html", "sourceLabel": "Google", "date": "2026-10-21", "practice": "Run google/oss-fuzz-gen against one internal C/C++ or parser library that has low fuzz coverage, and compare its coverage before and after."}, {"id": "seceng-2026-10-23-digitalocean-agentic-dev", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Team practice", "title": "Product Security in the Post-AI Era", "headline": "Product Security in the Post-AI Era", "body": "DigitalOcean's Product Security team says AI turned the development lifecycle into a loop, so security can't wait at fixed review points. They're rebuilding their baseline requirements, design patterns, threat models, and bug-bounty bug types as instructions and plugins agents load automatically, with hooks so agents can't skip the mandatory ones. In an illustrative webhook example, an agent with that context blocks SSRF on its own and adds tests. A real sandbox escape reported through their bug bounty stayed a routine fix because the compute served one customer and the credentials were read-only and narrowly scoped.", "url": "https://www.digitalocean.com/blog/securing-agentic-software-development", "sourceLabel": "DigitalOcean", "date": "2026-10-23", "practice": "Pick one bug type your team keeps seeing and write it as an agent-readable rule. Include when it applies, the approved pattern, what to block, and the test that proves the fix."}, {"id": "seceng-2026-10-24-trailofbits-regression-hunt", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Team practice", "title": "Your AI agent fixed the bug, but what else did it change?", "headline": "Your AI agent fixed the bug, but what else did it change?", "body": "Trail of Bits reviewed 130+ upstream patches from its Patch the Planet work and confirmed 21 regressions, none of which broke a security protection. Their agent had flagged 58 candidates, so precision was about 36%. That led them to publish two Codex plugins with fixed input and output schemas and a live proof of concept for every claim. Their regression-checking plugin produced 25% fewer false positives than a plain \"review the PR\" prompt (95% confidence interval 14–38%), but left some known regressions unconfirmed. Their patch-writing plugin proves each fix three ways: it fails on the original code, passes on the patched code, and fails again after a full revert. Projects feed both plugins a THREAT_MODEL.md and a PATCHING_GUIDELINES.md.", "url": "https://blog.trailofbits.com/2026/10/21/your-ai-agent-fixed-the-bug-but-what-else-did-it-change/", "sourceLabel": "Trail of Bits", "date": "2026-10-24", "practice": "Write a one-page THREAT_MODEL.md for one of your repos. List the assets, trust boundaries, and what counts as a vulnerability, then check whether an agent reading it would reject a false positive."}, {"id": "seceng-2026-10-27-datadog-detection-as-code", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Team practice", "title": "How we use Datadog for detection as code", "headline": "How we use Datadog for detection as code", "body": "Datadog's threat detection team writes every detection rule as Terraform in one Git repo, split into rules, organizations and tests. Pull requests run lint, a sandbox test with synthetic logs, and a Terraform plan. Each environment gets its own Terraform state, so one failed deploy cannot block the others. End-to-end tests use Stratus Red Team and Threatest: an hourly job runs a real command and alerts the team if the expected signal never appears. A scheduled apply catches drift and tampering in the UI.", "url": "https://www.datadoghq.com/blog/datadog-detection-as-code/", "sourceLabel": "Datadog", "date": "2026-10-27", "practice": "Pick one detection you own and write a test that runs the real attack action (for example touching authorized_keys) and checks that the alert fires."}, {"id": "seceng-2026-10-27-palantir-ads-framework", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Project", "title": "Alerting and Detection Strategy (ADS) Framework", "headline": "Alerting and Detection Strategy (ADS) Framework", "body": "Palantir's incident response team found that alerts shipped without documentation or peer review earned a bad reputation and caused alert fatigue. So every new alert now starts from a written template with nine required sections: Goal, Categorization, Strategy Abstract, Technical Context, Blind Spots and Assumptions, False Positives, Validation, Priority and Response. Each strategy is stored in a version-controlled place and reviewed before production. The public repo has the template and worked examples, and suggests running an ADS hack week.", "url": "https://github.com/palantir/alerting-detection-strategy-framework", "sourceLabel": "Palantir", "date": "2026-10-27", "practice": "Take one live alert and fill in only its Blind Spots and Assumptions and False Positives sections. Note what you could not answer."}, {"id": "seceng-2026-10-27-aws-least-privilege-at-scale", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Team practice", "title": "Strategies for achieving least privilege at scale (Part 1)", "headline": "Strategies for achieving least privilege at scale (Part 1)", "body": "AWS security engineers argue that writing near-perfect policies for each team does not scale. They give nine strategies in three groups: plan, policy and process. Part 1 starts at the top of the hierarchy: coarse controls, accounts as strong boundaries, short-term credentials, broad security invariants and choosing guardrails versus grants. Their invariant examples are blocking the root user, disabling unused Regions and preventing CloudTrail or CloudWatch from being turned off. An XY graph of risk versus frequency of use helps you choose which actions to block outright.", "url": "https://aws.amazon.com/blogs/security/strategies-for-achieving-least-privilege-at-scale-part-1/", "sourceLabel": "AWS Security Blog", "date": "2026-10-27", "practice": "List 5 actions that are high-risk and rarely used in your cloud account (for example StopLogging). Check whether an SCP or equivalent guardrail blocks each one."}, {"id": "seceng-2026-10-27-cloudflare-thanksgiving-2023-incident", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Team practice", "title": "Thanksgiving 2023 security incident", "headline": "Thanksgiving 2023 security incident", "body": "Cloudflare's postmortem walks through a nation-state intrusion by timeline. Attackers used one token and three service accounts that were never rotated after the October 2023 Okta compromise, because they were wrongly believed to be unused. They reached Jira, Confluence and Bitbucket, viewed 120 repositories and downloaded 76. An automated alert fired at 16:00 UTC when they added a service account to an admin group, and the SOC deactivated that account 35 minutes later. The cleanup, called Code Red, rotated more than 5,000 production credentials. IOCs are published.", "url": "https://blog.cloudflare.com/thanksgiving-2023-security-incident/", "sourceLabel": "Cloudflare", "date": "2026-10-27", "practice": "After your next credential leak drill, write a table of every secret in scope, who owns it, and the proof it was rotated. Mark any 'believed unused' ones."}, {"id": "seceng-2026-10-27-swtch-xz-timeline", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Practitioner write-up", "title": "Timeline of the xz open source attack", "headline": "Timeline of the xz open source attack", "body": "Russ Cox built a dated timeline of how the attacker 'Jia Tan' took over xz. It began with harmless patches in October 2021 and pressure emails from accounts that look like fakes. Jia Tan gained commit access and then maintainership. On 2024-02-23 the backdoor was hidden in binary test files, and the release tarball carried an extra build script that activated it. Andres Freund found it on 2024-03-28. The timeline shows what review of tarballs, test fixtures and maintainer changes could have caught.", "url": "https://research.swtch.com/xz-timeline", "sourceLabel": "Russ Cox", "date": "2026-10-27", "practice": "For one dependency you rely on, diff its release tarball against its Git tag and list any files that exist only in the tarball."}, {"id": "seceng-2026-10-27-google-cloud-threat-modeling", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Team practice", "title": "How Google Does It: Threat modeling, from basics to AI", "headline": "How Google Does It: Threat modeling, from basics to AI", "body": "A Google Cloud staff security engineer explains Google's threat modeling process using the four questions of the Threat Modeling Manifesto: what are we working on, what could go wrong, what are we going to do about it, and did we do a good job. They scope carefully, get an accurate architecture description, and use STRIDE plus internal threat libraries. Models then feed mitigations, detections and red team work. To scale, engineering teams write their own threat models and security reviews them afterward. Google is also testing Gemini for drafting architecture descriptions and threats.", "url": "https://cloud.google.com/transform/how-google-does-it-threat-modeling-from-basics-to-ai", "sourceLabel": "Google Cloud", "date": "2026-10-27", "practice": "Threat model one feature in 10 minutes: draw its data flow, mark trust boundaries, and write one STRIDE threat per boundary crossing."}, {"id": "seceng-2026-10-27-cartography-infra-graph", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Project", "title": "Cartography: infrastructure and identity graph for security", "headline": "Cartography: infrastructure and identity graph for security", "body": "Cartography is an Apache 2.0 Python tool, now a CNCF sandbox project, that loads assets and relationships from AWS, GCP, Azure, Kubernetes, GitHub, Okta and 30+ other platforms into a Neo4j graph. You then ask attacker-style questions: which identities reach which datastores, and which instances are exposed to the internet. Its rules library follows a Rule and Fact design, where each fact is a Cypher query. It shows evidence instead of fixed thresholds, so you can decide what matters for your environment.", "url": "https://github.com/cartography-cncf/cartography", "sourceLabel": "Cartography (CNCF)", "date": "2026-10-27", "practice": "Run Cartography against a sandbox AWS account and execute the built-in object_storage_public rule. Then write one Cypher query for a risk of your own."}, {"id": "seceng-2026-10-27-project-zero-big-sleep", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Team practice", "title": "From Naptime to Big Sleep: Using LLMs to catch vulnerabilities in real-world code", "headline": "From Naptime to Big Sleep: Using LLMs to catch vulnerabilities in real-world code", "body": "Google's Big Sleep agent found an exploitable stack buffer underflow in SQLite by doing variant analysis. It was given recent commits and asked to look for similar unfixed bugs at HEAD. The bug involved a -1 ROWID sentinel in an index field. It was fixed the day it was reported, before any release. Fuzzing missed it because OSS-Fuzz did not build the generate_series extension, and a 150 CPU-hour AFL run did not find it. The team says a target-specific fuzzer would likely be at least as effective.", "url": "https://googleprojectzero.blogspot.com/2024/10/from-naptime-to-big-sleep.html", "sourceLabel": "Google Project Zero", "date": "2026-10-27", "practice": "Pick a recent security fix in a library you use. Write down the bug pattern and grep the current code for sibling paths with the same pattern."}, {"id": "seceng-2026-10-27-heelan-o3-ksmbd-cve", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Practitioner write-up", "title": "How I used o3 to find CVE-2025-37899, a remote zeroday in the Linux kernel's SMB implementation", "headline": "How I used o3 to find CVE-2025-37899, a remote zeroday in the Linux kernel's SMB implementation", "body": "Sean Heelan benchmarked o3 on a ksmbd use-after-free he had found by hand, using about 3.3k lines of code and 100 runs. o3 found it in 8 runs, missed it in 66 and gave 28 false positives. With all command handlers (about 12k lines) it found it once, but in other runs reported a new use-after-free in the logoff handler. He puts the signal to noise at about 1:50. The 100 larger runs cost about $116. His takeaway is to build tooling around the model.", "url": "https://sean.heelan.io/2025/05/22/how-i-used-o3-to-find-cve-2025-37899-a-remote-zeroday-vulnerability-in-the-linux-kernels-smb-implementation/", "sourceLabel": "Sean Heelan", "date": "2026-10-27", "practice": "Run the same code-audit prompt 10 times on one function with a known bug. Count hits, misses and false positives before you trust the result."}, {"id": "seceng-2026-10-27-intruder-slice-triage-exploit", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Team practice", "title": "A 0-day vending machine: No Mythos necessary", "headline": "A 0-day vending machine: No Mythos necessary", "body": "Intruder built a pipeline that runs the Joern code scanner over a codebase, cuts a code slice for each unauthenticated WordPress hook, and drops slices proven safe by taint tracking. A cheaper triage model then filters the rest, a stronger model judges exploitability, and an exploitation agent writes a proof of concept against a Docker instance. They ran it on the top 200 plugins and found CVE-2026-3985, a two-request blind SQL injection in a plugin with 300k+ users. The root cause was a phpcs:disable comment hiding the bug from the developer's own scanner.", "url": "https://www.intruder.io/research/a-0-day-vending-machine-no-mythos-necessary", "sourceLabel": "Intruder", "date": "2026-10-27", "practice": "Search your own code for blanket linter-disable comments on lines that build SQL, and check that each one hides only the warning it was meant for."}, {"id": "seceng-2026-10-27-ioactive-llm-vuln-research", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Practitioner write-up", "title": "LLM-Assisted Vulnerability Research: Finding Real Bugs with Code-Reasoning Models", "headline": "LLM-Assisted Vulnerability Research: Finding Real Bugs with Code-Reasoning Models", "body": "IOActive's Carlos Gomez argues that 'find all bugs' prompts produce noise. His method is to write invariants (one-sentence rules the code must never break) from a project's past advisories and patches. He then asks the model one testable claim at a time. Four passes cover patch-variant farming, parser differentials, missing symmetric checks and cross-framework transfer. Survivors face a prove-it and a disprove-it session, then a runtime proof with a negative control and a fixed-version comparison. It produced two HIGH Angular CVEs, CVE-2026-68945 and CVE-2026-69151.", "url": "https://www.ioactive.com/llm-assisted-vulnerability-research-finding-real-bugs-with-code-reasoning-models/", "sourceLabel": "IOActive", "date": "2026-10-27", "practice": "Take one past advisory in a library you use and write its invariant plus an oracle: the exact observable result that separates the vulnerable build from the fixed one."}, {"id": "seceng-2026-10-28-ghsl-pwn-requests", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Practitioner write-up", "title": "Pwn requests: when a pull request gets your repo's keys", "headline": "Pwn requests: when a pull request gets your repo's keys", "body": "GitHub's `pull_request_target` trigger runs with write access and secrets so it can label or comment on PRs from forks. Check out and build the PR's code there, and an outsider's `npm install` hook or new test runs with those keys. The safe pattern is two workflows: build untrusted code under `pull_request` with read-only permissions, then let a `workflow_run` job do the privileged step using only artifacts, which it still treats as untrusted. A \"safe to test\" label is a stopgap, not a fix.", "url": "https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/", "sourceLabel": "GitHub Security Lab", "date": "2026-10-28", "practice": "Grep your repos for `pull_request_target` and check whether any of those workflows checks out the PR head."}, {"id": "seceng-2026-10-28-zizmor-actions-audits", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Project", "title": "Lint your CI workflows like code", "headline": "Lint your CI workflows like code", "body": "zizmor is an open-source static analyzer for GitHub Actions workflows, plus Dependabot and pre-commit configs. It flags dangerous triggers, template injection from attacker-controlled fields like issue titles, actions not pinned to a commit hash, impostor commits from forks, cache poisoning into release jobs, over-broad token permissions and `secrets: inherit`. Every rule in its docs shows a vulnerable and a fixed example, and some have auto-fixes. Run it locally or in CI as a gate.", "url": "https://docs.zizmor.sh/audits/", "sourceLabel": "zizmor (github.com/zizmorcore/zizmor)", "date": "2026-10-28", "practice": "Run zizmor on one repo's `.github/workflows` and fix the highest-severity finding."}, {"id": "seceng-2026-10-28-wiz-tj-actions-changed-files", "mode": "research", "day": null, "category": "SecEng", "kind": "post", "kindLabel": "Practitioner write-up", "title": "A moved tag leaked secrets from CI logs", "headline": "A moved tag leaked secrets from CI logs", "body": "In March 2025 an attacker repointed the existing version tags of the popular `tj-actions/changed-files` action to a malicious commit. Every workflow referencing it by tag ran code that dumped runner memory and printed secrets into logs, double base64 encoded, which was public on public repos. Hash-pinned users were safe unless they updated during the window. GitHub's advisory for CVE-2025-30066 counts over 23,000 affected repositories. Wiz's triage: find usages, check run logs, rotate secrets, pin by SHA, allowlist actions.", "url": "https://www.wiz.io/blog/github-action-tj-actions-changed-files-supply-chain-attack-cve-2025-30066", "sourceLabel": "Wiz Threat Research", "date": "2026-10-28", "practice": "List every third-party action in one repo and pin each to a full commit SHA."}];

const state = {
 mode: 'research',
 index: 0,
 read: {},
 animating: false,
 drawerFilter: 'all',
 touchStartX: null,
 touchStartY: null,
};

function loadRead() {
 try {
 const raw = localStorage.getItem(STORAGE_KEY);
 state.read = raw ? JSON.parse(raw) : {};
 if (typeof state.read !== 'object' || state.read === null || Array.isArray(state.read)) state.read = {};
 } catch (e) {
 state.read = {};
 }
}
function saveRead() {
 localStorage.setItem(STORAGE_KEY, JSON.stringify(state.read));
}
function isRead(id) {
 return !!(state.read[id] && state.read[id].readAt);
}
function markRead(id) {
 if (!isRead(id)) {
 state.read[id] = { readAt: new Date().toISOString() };
 saveRead();
 return true;
 }
 return false;
}

/** Unread-first within mode; stable relative order from CARDS. */
function modeCards() {
 const list = CARDS.filter(c => c.mode === state.mode);
 const unread = list.filter(c => !isRead(c.id));
 const read = list.filter(c => isRead(c.id));
 return unread.concat(read);
}

function counts() {
 const train = CARDS.filter(c => c.mode === 'training');
 const res = CARDS.filter(c => c.mode === 'research');
 return {
 train: train.length,
 res: res.length,
 trainRead: train.filter(c => isRead(c.id)).length,
 resRead: res.filter(c => isRead(c.id)).length,
 total: CARDS.length,
 readN: CARDS.filter(c => isRead(c.id)).length,
 };
}

function escapeHtml(s) {
 return String(s).replace(/[&<>"']/g, c => ({
 '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
 }[c]));
}
function escapeAttr(s) {
 return escapeHtml(s).replace(/`/g, '&#96;');
}

function kindChipClass(kind) {
 if (kind === 'lab') return 'chip-kind-lab';
 if (kind === 'practice') return 'chip-kind-practice';
 return 'chip-kind-paper';
}

function buildCardHTML(card) {
 const read = isRead(card.id);
 const citeLabel = card.sourceLabel || 'Source';
 const linkText = citeLabel === 'Read the paper' ? 'Read the paper ↗' : 'Open primary source ↗';
 return `
 <article class="card" data-id="${escapeAttr(card.id)}" aria-label="${escapeAttr(card.title)}">
 <div class="chips">
 <span class="chip ${kindChipClass(card.kind)}">${escapeHtml(card.kindLabel)}</span>
 <span class="chip ${read ? 'chip-read' : 'chip-unread'}">${read ? 'Read' : 'Unread'}</span>
 ${card.date ? `<span class="chip">${escapeHtml(card.date)}</span>` : ''}
 ${card.mode === 'training' && card.day ? `<span class="chip chip-acid">Day ${card.day}</span>` : ''}
 </div>
 <div class="t-stagger" data-stagger>
 <h2 class="headline t-stagger-line t-stagger-line--1">${escapeHtml(card.headline || card.title)}</h2>
 <p class="lede t-stagger-line t-stagger-line--2">${escapeHtml(card.body)}</p>
 </div>
 <div class="cite">
 <span class="cite-label">${escapeHtml(citeLabel)}</span>
 <a href="${escapeAttr(card.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(linkText)}</a>
 </div>
 </article>
 `;
}

function syncTabsPill(animate) {
 const bar = document.getElementById('modeTabs');
 const pill = document.getElementById('tabsPill');
 const tabs = [...bar.querySelectorAll('.t-tab')];
 const active = tabs.find(t => t.getAttribute('aria-selected') === 'true') || tabs[0];
 if (!animate) {
 const prev = pill.style.transition;
 pill.style.transition = 'none';
 pill.style.transform = `translateX(${active.offsetLeft}px)`;
 pill.style.width = `${active.offsetWidth}px`;
 void pill.offsetWidth;
 pill.style.transition = prev;
 } else {
 pill.style.transform = `translateX(${active.offsetLeft}px)`;
 pill.style.width = `${active.offsetWidth}px`;
 }
}

function updateChrome() {
 const list = modeCards();
 const c = counts();
 const modeRead = state.mode === 'training' ? c.trainRead : c.resRead;
 const modeTotal = state.mode === 'training' ? c.train : c.res;
 document.getElementById('metricRead').textContent = String(modeRead);
 document.getElementById('metricRest').textContent =
 `/ ${modeTotal} ${state.mode === 'training' ? 'training' : 'research'}`;

 const markBtn = document.getElementById('markBtn');
 const cur = list[state.index];
 if (cur && isRead(cur.id)) {
 markBtn.textContent = 'Already read';
 markBtn.disabled = true;
 } else {
 markBtn.innerHTML = `<span class="btn-check" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 48 48" fill="none"><path d="M10 24.5L20 34.5L38 14" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span> Mark as read`;
 markBtn.disabled = state.animating || !cur;
 }
 document.getElementById('prevBtn').disabled = state.animating || state.index <= 0;
 document.getElementById('nextBtn').disabled = state.animating || !cur || state.index >= list.length - 1;

 document.getElementById('tabTraining').setAttribute('aria-selected', state.mode === 'training' ? 'true' : 'false');
 document.getElementById('tabResearch').setAttribute('aria-selected', state.mode === 'research' ? 'true' : 'false');

 document.getElementById('live').textContent =
 `${modeRead} of ${modeTotal} ${state.mode} read. Showing card ${state.index + 1} of ${list.length}.`;
}

function setSlotHeight(el) {
 const slot = document.getElementById('cardSlot');
 if (!el) { slot.style.height = 'auto'; return; }
 const h = el.offsetHeight;
 slot.style.height = h + 'px';
}

function revealStagger(root) {
 const block = root.querySelector('[data-stagger]');
 if (!block) return;
 block.classList.remove('is-hiding', 'is-shown');
 void block.offsetHeight;
 block.classList.add('is-shown');
}

function showToast(msg) {
 const t = document.getElementById('toast');
 const check = document.getElementById('toastCheck');
 document.getElementById('toastText').textContent = msg;
 check.setAttribute('data-state', 'out');
 void check.offsetWidth;
 check.setAttribute('data-state', 'in');
 t.classList.add('is-open');
 clearTimeout(showToast._timer);
 showToast._timer = setTimeout(() => {
 t.classList.remove('is-open');
 setTimeout(() => check.setAttribute('data-state', 'out'), 280);
 }, 1600);
}

function mountCard(direction) {
 const list = modeCards();
 if (!list.length) return;
 if (state.index < 0) state.index = 0;
 if (state.index >= list.length) state.index = list.length - 1;
 const card = list[state.index];
 const slot = document.getElementById('cardSlot');

 const pane = document.createElement('div');
 pane.className = 'card-pane';
 pane.innerHTML = buildCardHTML(card);

 const prev = slot.querySelector('.card-pane:not(.is-exit-next):not(.is-exit-prev)');

 if (prev && direction) {
 state.animating = true;
 updateChrome();
 const exitClass = direction === 'prev' ? 'is-exit-prev' : 'is-exit-next';
 const enterClass = direction === 'prev' ? 'is-enter-prev' : 'is-enter-next';
 prev.classList.add(exitClass);
 pane.classList.add(enterClass);
 slot.appendChild(pane);

 // Measure incoming content for height morph
 requestAnimationFrame(() => {
 setSlotHeight(pane);
 revealStagger(pane);
 });

 const done = () => {
 prev.remove();
 pane.classList.remove(enterClass);
 state.animating = false;
 updateChrome();
 setSlotHeight(pane);
 };
 prev.addEventListener('animationend', done, { once: true });
 setTimeout(done, 320);
 } else {
 slot.innerHTML = '';
 slot.appendChild(pane);
 // First paint: set height without fighting layout
 slot.style.height = 'auto';
 requestAnimationFrame(() => {
 setSlotHeight(pane);
 revealStagger(pane);
 });
 updateChrome();
 }
}

function goNext(mark) {
 if (state.animating) return;
 const list = modeCards();
 const cur = list[state.index];
 if (!cur) return;

 // Enter / Mark on an already-read card just advances (no toast)
 if (mark && isRead(cur.id)) {
 if (state.index < list.length - 1) {
 state.index += 1;
 mountCard('next');
 }
 return;
 }

 if (mark) {
 const newly = markRead(cur.id);
 if (newly) showToast('Marked read');
 const nextList = modeCards();
 // Current card just moved into the read section; land on first unread
 const nextUnread = nextList.findIndex(c => !isRead(c.id));
 if (nextUnread >= 0) {
 state.index = nextUnread;
 mountCard('next');
 } else {
 state.index = Math.max(0, nextList.length - 1);
 mountCard(null);
 if (newly) showToast('Marked read · end of list');
 }
 return;
 }

 if (state.index < list.length - 1) {
 state.index += 1;
 mountCard('next');
 }
}

function goPrev() {
 if (state.animating || state.index <= 0) return;
 state.index -= 1;
 mountCard('prev');
}

function setMode(mode) {
 if (mode === state.mode) return;
 state.mode = mode;
 state.index = 0;
 syncTabsPill(true);
 mountCard('next');
}

function openSheet() {
 const backdrop = document.getElementById('backdrop');
 const sheet = document.getElementById('sheet');
 backdrop.hidden = false;
 sheet.hidden = false;
 requestAnimationFrame(() => {
 backdrop.classList.add('open');
 sheet.classList.add('open');
 });
 renderSheet();
}
function closeSheet() {
 const backdrop = document.getElementById('backdrop');
 const sheet = document.getElementById('sheet');
 backdrop.classList.remove('open');
 sheet.classList.remove('open');
 setTimeout(() => {
 backdrop.hidden = true;
 sheet.hidden = true;
 }, 300);
}

function renderSheet() {
 const list = document.getElementById('sheetList');
 const f = state.drawerFilter;
 let items = CARDS.slice();
 if (f === 'unread') items = items.filter(c => !isRead(c.id));
 else if (f === 'read') items = items.filter(c => isRead(c.id));
 else if (f === 'training') items = items.filter(c => c.mode === 'training');
 else if (f === 'research') items = items.filter(c => c.mode === 'research');
 else if (f === 'lab' || f === 'practice' || f === 'paper') items = items.filter(c => c.kind === f);

 const cur = modeCards()[state.index];
 list.innerHTML = items.map(c => `
 <button type="button" class="sheet-item${cur && cur.id === c.id ? ' is-current' : ''}" data-id="${escapeAttr(c.id)}">
 <span class="t">${escapeHtml(c.title)}</span>
 <span class="m">
 <span>${c.mode === 'training' ? 'Training' : 'Research'}</span>
 <span>· ${escapeHtml(c.kindLabel)}</span>
 <span class="${isRead(c.id) ? '' : 'dot-unread'}">· ${isRead(c.id) ? 'Read' : 'Unread'}</span>
 </span>
 </button>
 `).join('') || '<p style="padding:1rem;color:rgba(255,255,255,0.45)">No cards match.</p>';
}

function jumpTo(id) {
 const card = CARDS.find(c => c.id === id);
 if (!card) return;
 state.mode = card.mode;
 syncTabsPill(true);
 const list = modeCards();
 const idx = list.findIndex(c => c.id === id);
 state.index = Math.max(0, idx);
 closeSheet();
 mountCard('next');
}

/* Events */
document.getElementById('markBtn').addEventListener('click', () => goNext(true));
document.getElementById('nextBtn').addEventListener('click', () => goNext(false));
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('tabTraining').addEventListener('click', () => setMode('training'));
document.getElementById('tabResearch').addEventListener('click', () => setMode('research'));
document.getElementById('openSheet').addEventListener('click', openSheet);
document.getElementById('closeSheet').addEventListener('click', closeSheet);
document.getElementById('backdrop').addEventListener('click', closeSheet);

document.getElementById('sheetFilters').addEventListener('click', (e) => {
 const btn = e.target.closest('button[data-filter]');
 if (!btn) return;
 state.drawerFilter = btn.dataset.filter;
 document.querySelectorAll('#sheetFilters button').forEach(b =>
 b.setAttribute('aria-pressed', b === btn ? 'true' : 'false')
 );
 renderSheet();
});
document.getElementById('sheetList').addEventListener('click', (e) => {
 const item = e.target.closest('[data-id]');
 if (item) jumpTo(item.dataset.id);
});

document.addEventListener('keydown', (e) => {
 if (e.target.matches('input, textarea, select')) return;
 if (e.key === 'ArrowRight') { e.preventDefault(); goNext(false); }
 else if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
 else if (e.key === 'Enter') { e.preventDefault(); goNext(true); }
 else if (e.key === 'Escape') closeSheet();
});

/* Optional swipe: left = next, right = prev */
const slot = document.getElementById('cardSlot');
slot.addEventListener('touchstart', (e) => {
 if (!e.touches[0]) return;
 state.touchStartX = e.touches[0].clientX;
 state.touchStartY = e.touches[0].clientY;
}, { passive: true });
slot.addEventListener('touchend', (e) => {
 if (state.touchStartX == null) return;
 const t = e.changedTouches[0];
 if (!t) return;
 const dx = t.clientX - state.touchStartX;
 const dy = t.clientY - state.touchStartY;
 state.touchStartX = null;
 state.touchStartY = null;
 if (Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
 if (dx < 0) goNext(false);
 else goPrev();
}, { passive: true });

window.addEventListener('resize', () => {
 syncTabsPill(false);
 const pane = document.querySelector('#cardSlot .card-pane');
 if (pane) setSlotHeight(pane);
});

loadRead();
requestAnimationFrame(() => {
 syncTabsPill(false);
 mountCard(null);
 updateChrome();
});
</script>
</body>
